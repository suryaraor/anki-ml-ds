<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f766e"><title>ML &amp; Data Science Flashcards</title><style>
:root{--bg:#eef3f2;--ink:#14212b;--card:#fff;--acc:#0f766e;--mut:#64748b;--code:#f1f5f9}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center}
header{width:100%;max-width:820px;padding:16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
h1{font-size:21px;margin:0 auto 0 0}select,button,input{font:inherit;font-size:14px;padding:6px 10px;border:1px solid #cbd5d4;border-radius:8px;background:#fff;color:inherit;cursor:pointer}
.bar{width:100%;max-width:820px;padding:0 16px;color:var(--mut);font-size:14px;display:flex;justify-content:space-between}
.scene{perspective:1400px;width:calc(100% - 32px);max-width:788px;height:min(520px,calc(100vh - 230px));min-height:340px;margin:12px 16px;cursor:pointer}
.card{position:relative;width:100%;height:100%;transition:transform .55s;transform-style:preserve-3d}.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;background:var(--card);border-radius:18px;box-shadow:0 10px 30px #0f172a1f;padding:26px 30px;display:flex;flex-direction:column;align-items:center;overflow:auto}
.face>.in{margin:auto 0;width:100%}.front .in{text-align:center}.back{transform:rotateY(180deg)}
.lbl{font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:var(--acc);margin-bottom:12px;text-align:center}
.q{font-size:24px;line-height:1.4}.front .q .code{text-align:left;font-size:15px}
.ans{font-size:17px;line-height:1.55}.ans ul,.ans ol,.x ul,.x ol{padding-left:22px;margin:6px 0}.ans li{margin:2px 0}
.qsmall{color:var(--mut);font-size:14px;text-align:center;margin-bottom:12px;max-height:5.5em;overflow:hidden}.qsmall .code{display:inline;padding:0;background:none;white-space:normal}
.code,pre{font:14px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;background:var(--code);border-radius:10px;padding:12px 14px;white-space:pre-wrap;overflow-x:auto;margin:0}
.code pre{padding:0;background:none}
.face img{display:block;max-width:100%;max-height:300px;border-radius:8px;margin:8px auto;cursor:zoom-in}
.x{margin-top:14px;padding-top:12px;border-top:1px dashed #cbd5d4;color:#334155;font-size:15px;line-height:1.5}
.x::before{content:"Explanation";display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin-bottom:4px}
.chips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}.chip{font-size:12px;background:#ccfbf1;color:var(--acc);padding:2px 9px;border-radius:99px}
.controls{display:flex;gap:10px;margin:6px 0 16px;flex-wrap:wrap;justify-content:center}.controls button{padding:10px 18px;font-size:15px}
.again{border-color:#dc2626!important;color:#dc2626}.good{border-color:#16a34a!important;color:#16a34a}
.hint{font-size:12px;color:var(--mut);margin-bottom:20px;text-align:center;padding:0 12px}.hint a{color:var(--mut)}
#help{width:34px;height:34px;padding:0;border-radius:50%;font-weight:bold}
#zoom{position:fixed;inset:0;background:#0f172ae6;display:none;align-items:center;justify-content:center;z-index:40;cursor:zoom-out}#zoom.on{display:flex}#zoom img{max-width:95vw;max-height:92vh;background:#fff;border-radius:8px}
#upd{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:12px;padding:10px 12px 10px 16px;display:none;gap:12px;align-items:center;font-size:14px;box-shadow:0 8px 30px #0005;z-index:45}
#upd.on{display:flex}#upd button{background:var(--acc);border-color:var(--acc);color:#fff}
#tour{position:fixed;inset:0;z-index:50;display:none}#tour.on{display:block}
#spot{position:fixed;border-radius:14px;box-shadow:0 0 0 9999px #0f172acc;transition:all .3s;pointer-events:none}
#tip{position:fixed;width:min(360px,calc(100vw - 24px));background:#fff;border-radius:14px;padding:18px 18px 14px;box-shadow:0 12px 40px #0006;font-size:15px;line-height:1.5;transition:top .3s,left .3s}
#tip h3{margin:0 0 6px;font-size:18px;color:var(--acc)}#tip p{margin:0 0 12px}#tip kbd{background:#f3f4f6;border:1px solid #d1d5db;border-radius:4px;padding:0 5px;font-size:13px}
#tip .row{display:flex;align-items:center;gap:8px}#tip .dots{margin-right:auto;color:var(--mut);font-size:13px}
#tip button{font-size:14px;padding:6px 12px}#tip .pri{background:var(--acc);color:#fff;border-color:var(--acc)}#tip .skip{border:none;background:none;color:var(--mut)}
</style></head><body>
<header><h1>ML &amp; Data Science Flashcards</h1><select id="deck"></select>
<select id="mode"><option value="all">All cards</option><option value="due">Not yet known</option></select>
<input id="q" placeholder="Search…" size="12"><button id="shuf">Shuffle</button><button id="help" title="How to use this (tour)">?</button></header>

<div id="zoom"></div><div id="upd" role="status"><span>New cards are available.</span><button id="updBtn">Refresh</button></div>
<div class="bar"><span id="pos"></span><span id="stats"></span></div>

<div class="controls"><button id="prev">← Prev</button><button id="say">🔊 Speak</button><button class="again" id="again">Again</button><button class="good" id="good">Know it</button><button id="next">Next →</button></div>
<div class="hint">Space/click = flip · ←/→ = navigate · 1 = again · 2 = know it · S = speak<br>
Cards from <a href="https://github.com/ppant/anki" target="_blank" rel="noopener">ppant/anki</a> · <span id="net"></span></div>
<script>
const DECKS=[{"name": "Machine Learning", "cards": [{"id": "H4_X/eNQp;", "q": "How Deep Belief Network is created?", "a": "Stacking multiple Restricted Boltzman Machine (RBM)", "x": "", "src": "Hands-On ML (Géron)"}, {"id": "t-9d24cdc5e2c9", "q": "Semi-Supervised Algorithm Example", "a": "Deep Belief Networks (DBN)", "x": "", "src": ""}, {"id": "t-4cb5d3aa63a7", "q": "Restricted Boltzman Machine (RBM) is?", "a": "an Unsupervised Learning Algorithm", "x": "", "src": ""}, {"id": "t-dc81f3cd6a12", "q": "What are some most important supervised learning algorithms", "a": "* KNN<br>* Linear Regression<br>* Logistic Regression<br>* Support Vector Machines (SVM)<br>* Decision Trees and Random Forests<br>* Neural Networks", "x": "", "src": ""}, {"id": "t-97a973b04920", "q": "What are two main approach to generalize ML", "a": "1. Instance based learning<br>2. Model based learning", "x": "", "src": ""}, {"id": "t-76bd5a5a8b39", "q": "What is instance based learning?", "a": "* This uses similarity of measure between two examples. e.g.: count the total no of words <br><br>* System learns the examples by heart, then generalize to new cases using similarity measure", "x": "", "src": ""}, {"id": "t-f16d2ca98646", "q": "What is Model-based learning", "a": "Set of examples are used to build a model and use model to make new predictions", "x": "", "src": ""}, {"id": "t-434c9648aec6", "q": "Main challenges of Machine learning", "a": "1. Insufficient quality of training data<br>2. Non-representative Training data<br>3. Poor quality data<br>4. Irrelevant features<br>5. Overfitting the training data<br>6. Underfitting the training data", "x": "", "src": ""}, {"id": "t-333f4dae05e0", "q": "What are mostly used unsupervised learning algorithms?", "a": "<div> <li>Dimensionality reduction<\/li><li>Clustering<\/li><li>Anomaly detection<\/li><li>Density estimation<\/li> <\/div>", "x": "", "src": ""}, {"id": "t-a27c007848b0", "q": "What is clustering?", "a": "<div> clustering is grouping similar instances based on properties/features <\/div>", "x": "", "src": ""}, {"id": "t-1e2060480b27", "q": "Clustering examples?", "a": "<div> <li>Customer segmentation<\/li><li>Recommender systems<\/li><li>Search engines<\/li><li>Image segmentation <\/li><li>Semi-supervised learning<\/li><li>Dimensionality reduction<\/li>  <\/div>", "x": "", "src": ""}]}, {"name": "Deep Learning", "cards": [{"id": "oY6FcUN^cP", "q": "What padding is needed in convolution operation?", "a": "- Shrinking output<br>- Throw away into from edge<br><br>If we use a 6x6 image and convol with 3x3 filter than output will be a 4x4 image. So we loose information. <br>With padding we add zeros and make image 8x8 and conv with 3x3 filter and get 6x6 output image", "x": "", "src": "Coursera DL Specialization"}, {"id": "nB|*R&_P9b", "q": "Summary of convolutions", "a": "<img src=\"media/paste-c1a025d3d76a38243f9c2bcc5d7a87db35ff24ed.jpg\" alt=\"\" loading=\"lazy\">", "x": "", "src": "Coursera DL Specialization"}, {"id": "JK%/?VugvC", "q": "Type of layers in convolutional network", "a": "<img src=\"media/paste-9bca3656e72b9607b7ed707921cf6b7d4af2c2f2.jpg\" alt=\"\" loading=\"lazy\">", "x": "", "src": "Coursera DL Specialization"}, {"id": "mjII?JnHWG", "q": "Example of ConvNet (how it works)", "a": "<img src=\"media/paste-fc4b013badf94d0449eb60fd901f19c0bd8fa3d5.jpg\" alt=\"\" loading=\"lazy\">", "x": "", "src": "Coursera DL Specialization"}, {"id": "z-lmpO^2R-", "q": "What is the use of Pooling layer in Convnet?", "a": "- Pooling layer helps in reducing the size of presenation to speed-up computation<br>- detecing some features<br><br>Hyperparameter:<br>f: filter size<br>s: stride<br>Max/Avg pooling", "x": "Pl note that \"No parameter to learn\" in Max pooling layer you just have to set the hyperparameter f and s and there are no weights", "src": "Coursera DL Specialization"}, {"id": "vlr7X{0J:x", "q": "Example of Neural Network (LeNet-5 Arch)", "a": "<img src=\"media/paste-cd71ebbc561bf2c24a5c2e4816b5ad952eff1d5e.jpg\" alt=\"\" loading=\"lazy\"><br><br><img src=\"media/paste-564b105c5e15e5322403f52e18203d4d395c19df.jpg\" alt=\"\" loading=\"lazy\">", "x": "", "src": "Coursera DL Specialization"}, {"id": "QYl.>}XgIP", "q": "Why convolutions?", "a": "<img src=\"media/paste-590648a629258f351032192b5d43360e03efc06f.jpg\" alt=\"\" loading=\"lazy\"><br><br><img src=\"media/paste-acff2f0ed0a7f3db1333c6ec69a06bb0988c08bc.jpg\" alt=\"\" loading=\"lazy\">", "x": "", "src": "Coursera DL Specialization"}]}, {"name": "Data Mining & Data Engineering", "cards": [{"id": "Ai&LD~]P`|", "q": "What is Support of Association rules in data mining", "a": "Support is the no of times an item apperas in then total transactions, this helps in understanding the popularity of the product.", "x": "", "src": "Data Mining"}, {"id": "Ri)uG(n>!6", "q": "What is Confidence of Association rules in data mining", "a": "Confidence is an indication of how often the rule is valid, a kind of likelyhood, say if A is purchased and B is also purchased. This helps in finding more assocations in transaction.", "x": "", "src": "Data Mining"}, {"id": "QF:[pObILH", "q": "What is Entropy in Decesion Trees in data mining", "a": "Entropy is a probability distribution which tell about some sort of uncertanity. Inj decesion tress we use entropy to check the discorder. High entropy means high level of disorder, we should aim for lowe entropy close to 0 (zero)", "x": "", "src": "Data Mining"}, {"id": "r<}5S<auQ,", "q": "What is Information Gain in Decesion tree in data mining", "a": "IG is a metric to train decesion trees, this actually mesaures the quality of split, we can get information about a variable.", "x": "", "src": "Data Mining"}, {"id": "Qw^cQTe(hS", "q": "What is BigQuery?", "a": "Google Cloud Data Warehouse", "x": "", "src": "Coursera ML on GCP"}, {"id": "t-f4d4fa3c0e2d", "q": "What is the data pipeline?", "a": "<div> A sequence of data processing components  <\/div>", "x": "", "src": ""}, {"id": "t-5cffddea09b4", "q": "What are the data pipeline components?", "a": "<div> 1. Origin - IoT Sensor, Social Media API's, Data Warehouse, Data Lake<br><br>2. Destination - Data Visualization, Data Warehouse, Data Lake<br><br>3. Data flow - ETL tools<br><br>4. Storage - Data Store<br><br>5. Processing<br><br>6. Workflow<br><br>7. Monitoring<br><br>8. Technology<div><br><br> Read more here: https://www.altexsoft.com/blog/data-pipeline-components-and-types<\/div> <\/div>", "x": "", "src": ""}, {"id": "t-b6a3da588d1a", "q": "What is Correlation?", "a": "<div> Correlation (association) is a statistical relationship between two entities, it is a measure of the extent to which two variables are related In other words, it's how two variables move in relation to one another. A positive correlation is a relationship between two variables in which both variables move in the same direction. <\/div>", "x": "", "src": ""}, {"id": "t-1e593308b05c", "q": "When is histogram is used?", "a": "<div> Histogram is mainly used in places where you want to know the distribution of your variables.  <\/div>", "x": "", "src": ""}]}, {"name": "Data Structures & Algorithms", "cards": [{"id": "J8ZVi|^~&b", "q": "What is the brute force technique for problem solving in algorithms?", "a": "<ul>\n<li>The first approach that comes to our mind on seeing the problem, just like iterating every possibility available to solve that problem.<br><br><\/li>\n<li>Brute force technique typically tries to exhaust all possibilities (extreme search).<br><br><\/li>\n<li>Checking all possible candidates for the solution and also checking whether each candidate satisfies the problem's statement<\/li>\n<\/ul>", "x": "", "src": "Big O Notation"}, {"id": "y`aZNI7;<s", "q": "Give few example of brute-force approach of problem solving?", "a": "<ul>\n<li>Bubble Sort<br><br><\/li>\n<li>Selection Sort<\/li>\n<\/ul>", "x": "", "src": "Basics"}, {"id": "c]1W6^-!G%", "q": "What are the most important type of Algorithms in problem solving?", "a": "<ul><br><li>Brute Force Algorithms<br><br><\/li><br><li>Recursive Algorithms<br><br><\/li><br><li>Divide and Conquer Algorithms<br><br><\/li><br><li>Dynamic Programming Algorithms<br><br><\/li><br><li>Greedy Algorithms<br><br><\/li><br><li>Backtracking Algorithms<\/li><br><\/ul>", "x": "", "src": "Basics"}, {"id": "OzHe{AiLx@", "q": "What are the problems which can be solved by using Recursive algorithms?", "a": "<ul>\n<li>Factorial of a Number<br><br><\/li><li>Fibonacci Series<br><br><\/li><li>Tower of Hanoi<br><br><\/li><li>DFS for Graph<\/li>\n<\/ul>", "x": "", "src": "Basics"}, {"id": "QjQP:$u`Rs", "q": "What are the problems which can be solved by using Divide and Conquer Algorithms?", "a": "<ul>\n<li>Binary Search<br><br><\/li><li>Merge Sort<br><br><\/li><li>Quick Sort<br><br><\/li><li>Strassen’s Matrix Multiplication<br><\/li>\n<\/ul>", "x": "", "src": "Basics"}, {"id": "sl!{zJ?**K", "q": "What is Divide and Conquer Algorithm?", "a": "Solve problem in 2 sections:<div><br><div>1. Divide problem into subproblem of the same type<\/div><div><br><\/div><div>2. Solve smaller problem independently<\/div><div><br><\/div><div>Finally add the combined result to produce the final answer<\/div><\/div>", "x": "", "src": "Basics"}, {"id": "ymGkL^a>rf", "q": "What are Dynamic Programming Algorithms?", "a": "<div>Dyamic programming algoritms are:<\/div><ul><li>Based on the memoization technique <br><br><\/li><li>Divide the complex problem into smaller overlapping subproblems and storing the result for future use to avoid calculating it again.<br><\/li><\/ul>", "x": "", "src": "Basics"}, {"id": "q7:Cr^Bdxq", "q": "What are the problems which can be solved by using Dynamic Programming Algorithms?", "a": "<ul><li>Knapsack Problem<br><br><\/li><li>Weighted Job Scheduling<br><br><\/li><li>Floyd Warshall Algorithm<br><br><\/li><li>Dijkstra Shortest Path Algorithm<br><\/li><\/ul>", "x": "", "src": "Basics"}, {"id": "ox@9{ew-u/", "q": "What are Greedy Algorithms?", "a": "<div>By using Greedy Algorithms:<\/div><ul><li>Solution is built part by part<br><br><\/li><li>Next part is chosen on the basis that it gives immediate benefit<br><br><\/li><li>Previous choice not considered<\/li><\/ul>", "x": "", "src": "Basics"}, {"id": "Di}sBf7|u/", "q": "What are the problems which can be solved by using Greedy Algorithms?", "a": "<ul><li>Prim’s Algorithm<br><br><\/li><li>Kruskal’s Algorithm<br><br><\/li><li>Huffman Coding<\/li><\/ul>", "x": "", "src": "Basics"}, {"id": "O%yRSy.4Sf", "q": "What are Backtracking Algorithms?", "a": "In Backtracking algorithm:<div><ul><li>Problem is solved recursively in an incremental way<br><br><\/li><li>It is a systematic way of trying out different sequences of decisions until we found one that \"works\" <br><br><\/li><li>It remove all those solutions that fail to satisfy the constraints of the problem at any point of time<br><br><\/li><li>This algorithms is generally used to solve optimization problems<br><br><\/li><\/ul><\/div>", "x": "", "src": "Basics"}, {"id": "As)]AASW<z", "q": "What are the problems which can be solved by using Backtracking Algorithms?", "a": "<ul><li>Hamiltonian Cycle<br><br><\/li><li>M-Coloring Problem<br><br><\/li><li>N Queen Problem<br><br><\/li><li>Rat in Maze Problem<br><\/li><\/ul>", "x": "", "src": "Basics"}, {"id": "KjGQfCQb1*", "q": "What is Big-O notation?", "a": "* how quickly runtime will grow relative to the input as the input get arbitrarily large. <div>* It's not always a measure of speed but instead a mesure of how well an algorithm scales.<\/div>", "x": "", "src": "Big O Notation"}, {"id": "eHBsxu$5w,", "q": "What are runtime of common Big-O functions?", "a": "<img src=\"media/paste-d219be8b71c6a527375335139e2474bf752d8649.jpg\" alt=\"\" loading=\"lazy\"><div><br><\/div><div>https://www.bigocheatsheet.com/<br><\/div><div><br><\/div>", "x": "", "src": "Big O Notation"}, {"id": "CbyH_<a!ho", "q": "<div class=\"code\"><div><span>What is the Big-O (<\/span><span>time complexity) <\/span><span>of the below code?<\/span><\/div><div><br><\/div><div>def func_constant(values):<br><\/div><div>    #prints first item in a list of values.<\/div><div>    print values[0]<\/div><div><br><\/div><div>func_constant([1,2,3])<\/div><\/div>", "a": "<div class=\"code\"><strong>O(1) Constant<\/strong><\/div>", "x": "function is constant because regardless of the list size, the function will only ever take a constant step size, in this case 1, printing the first value from a list. so we can see here that an input list of 100 values will print just 1 item, a list of 10,000 values will print just 1 item, and a list of <strong>n<\/strong> values will print just 1 item!", "src": "Big O Notation"}, {"id": "Ene1z4=F%D", "q": "<div class=\"code\"><div><span>What is the Big-O (<\/span><span>time complexity) <\/span><span>of the below code?<\/span><\/div><div><br><\/div><div>def func_lin(lst):<br>    '''<br>    Takes in list and prints out all values<br>    '''<br>    for val in lst:<br>        print val<br>        <br>func_lin([1,2,3])<span><br><\/span><\/div><\/div>", "a": "<div class=\"code\"><strong>O(n) Linear<br><\/strong><\/div>", "x": "This function runs in O(n) (linear time). This means that the number of operations taking place scales linearly with n, so we can see here that an input list of 100 values will print 100 times, a list of 10,000 values will print 10,000 times, and a list of n values will print n times.", "src": "Big O Notation"}, {"id": "pr#`Zu38W|", "q": "<div class=\"code\"><div><span>What is the Big-O (<\/span><span>time complexity) <\/span><span>of the below code?<\/span><\/div><div><br><\/div><div><br><\/div>def func_quad(lst):<br>    '''<br>    Prints pairs for every item in list.<br>    '''<br>    for item_1 in lst:<br>        for item_2 in lst:<br>            print item_1,item_2<br>            <br>lst = [0, 1, 2, 3]<br><br>func_quad(lst)<\/div>", "a": "<div class=\"code\"><strong>O(n^2) Quadratic<\/strong><\/div>", "x": "Note how we now have two loops, one nested inside another. This means that for a list of n items, we will have to perform n operations for <em>every item in the list!<\/em> This means in total, we will perform n times n assignments, or n^2. So a list of 10 items will have 10^2, or 100 operations. You can see how dangerous this can get for very large inputs! This is why Big-O is so important to be aware of!", "src": "Big O Notation"}, {"id": "J_Zu6r[uX/", "q": "<div class=\"code\"><div><span>What is the Big-O (<\/span><span>time complexity) <\/span><span>of the below code?<\/span><\/div><div><br><\/div><div><br><\/div>def print_3(lst):<br>    '''<br>    Prints all items three times<br>    '''<br>    for val in lst:<br>        print val<br>        <br>    for val in lst:<br>        print val<br>        <br>    for val in lst:<br>        print val<div>print_3(lst)<br><\/div><\/div>", "a": "<div class=\"code\"><strong>O(n) Linear<\/strong><\/div>", "x": "We can see that the first function will print O(n) items and the second will print O(3n) items. However for n going to inifinity the constant can be dropped, since it will not have a large effect, so both functions are O(n).", "src": "Big O Notation"}, {"id": "J^R8[#l@}>", "q": "<strong>What is Space Complexity in algorithm analysis?<\/strong>", "a": "Space Complexity focuses on how much memory/space an algorithm uses.", "x": "", "src": "Big O Notation"}, {"id": "G=mUi0a0q}", "q": "<div class=\"code\"><div><span>What is the Big-O (Space<\/span><span> Complexity) <\/span><span>of the below code?<\/span><\/div><div><br><\/div><div>def create_list(n):<br>    new_list = []<br>    <br>    for num in range(n):<br>        new_list.append('new')<br>    <br>    return new_list<br><\/div><div><br><\/div><div>print create_list(5)<br><\/div><\/div>", "a": "<div class=\"code\"><strong>O(n) Linear<\/strong><\/div>", "x": "Size of the new_list object scales with the input <strong>n<\/strong>, this shows that it is an O(n) algorithm with regards to <strong>space<\/strong> complexity.", "src": "Big O Notation"}, {"id": "C84k$V0b,R", "q": "<div class=\"code\"><div>What is the space complexity of the below function?<\/div><div><br><\/div>def printer(n=10):<br>    '''<br>    Prints \"hello world!\" n times<br>    '''<br>    for x in range(n):<br>        print 'Hello World!'<div>printer()<br><\/div><\/div>", "a": "<div class=\"code\"><strong>O(1) Constant<\/strong><\/div>", "x": "we only assign the 'hello world!' variable once, not every time we print. So the algorithm has O(1) <strong>space<\/strong> complexity and an O(n) <strong>time<\/strong> complexity.", "src": "Big O Notation"}, {"id": "hYd/>Y`63_", "q": "Big-O for common list operations?", "a": "<img src=\"media/paste-6252ba5390a5439c8d9aae9adc120f1604e65950.jpg\" alt=\"\" loading=\"lazy\">", "x": "", "src": "Big O Notation"}, {"id": "v8s(kU|%!j", "q": "Big-O for common dict operations?", "a": "<img src=\"media/paste-77361644ec8220b127b812f84d816937bef00266.jpg\" alt=\"\" loading=\"lazy\">", "x": "", "src": "Big O Notation"}, {"id": "KGU#^UAPy]", "q": "<div class=\"code\"><div>What is the time complexity of the given code?<\/div><div><br><\/div>x = n<br>while x &gt; 0:<br>   y = 2 + 2<br>   x = x // 2<\/div>", "a": "<div class=\"code\">O(log n)<\/div>", "x": "<span>x is cut in half each time through the loop, so it will only take log(n) iterations<\/span>", "src": "Big O Notation"}, {"id": "fT+X6{!m!w", "q": "What is a dynamic array?", "a": "<li>A dynamic array is similar to an array, but with the difference that its size can be dynamically modified at runtime<br><br><\/li><li>It grows automatically when you try to make an insertion into a fully occupied list<br><br><\/li><li>They double in size when full<br><br><\/li><li>Python list is a dynamic array<br><br><br>Check Dynamic Array Imple:<br>https://www.tutorialspoint.com/implementation-of-dynamic-array-in-python<br><\/li>", "x": "", "src": "Array"}, {"id": "r{l03Wq*X|", "q": "What is an amortized analysis?", "a": "<li>Amortized analysis is a method for analyzing a given algorithm's complexity, or how much of a resource, especially time or memory, it takes to execute.<br><br><\/li><li>Amortized Analysis is used for algorithms where an occasional operation is very slow, but most of the other operations are faster. <br><br><\/li><li> In Amortized Analysis, we analyze a sequence of operations and guarantee a worst case average time which is lower than the worst case time of a particular expensive operation.<br><br><br>Check here: https://www.geeksforgeeks.org/analysis-algorithm-set-5-amortized-analysis-introduction/<br><\/li>", "x": "", "src": "Array"}, {"id": "vfxIQ,Z_KZ", "q": "How to check for an anagram for given two strings?", "a": "An anagram is when the two strings can be written using the exact same letters, we can just rearrange letters to get a different phrase/word.<div><br><\/div><div>e.g.; \"clint eastwood\" is an anagram of \"old west action\"<\/div><div><br><\/div><div>Code:<\/div><div>https://github.com/ppant/DS-Algos-Python/tree/master/Arrays<br><\/div><div><br><\/div>", "x": "", "src": "Array"}, {"id": "F)X|u*IZx}", "q": "Python Stack Data Structure Implementation", "a": "<div class=\"code\"><img src=\"media/paste-d33dac366ee933af5eefafcef0e711a542379225.jpg\" alt=\"\" loading=\"lazy\"><\/div>", "x": "Check my Github for full code: https://github.com/ppant/DS-Algos-Python/blob/master/Stacks/StackImple.py", "src": "Stack Queues Deques"}, {"id": "D^O22;5j~c", "q": "BFS (Breadth First Search)", "a": "Facts: BFS can be started from any vertex you like also while exploring vertices you can visit vertices in any order you like.<br><br>Rule is:<br>1. When you are selecting a vetex for exploration then you should visit all its adjacent verices then only you should go to next vertex for exploration<br>2. You should select the next vertex for exploration from a queue data structure only.<br><br>BFS spanning tree<br>Level order of binary tree<br>Time complexity: O(n) where n is no of vertices", "x": "", "src": "Graph Algorithms"}, {"id": "K|,#fqn}-U", "q": "DFS (Depth First Search)", "a": "Facts: DFS can be started from any vertex you like.<br><br>Rule is:<br>1. While exploration once you have reached a new vertex, start exploring it and suspend the previous one , similarly you dig deep till no new node to explore. <br>2. Suspended node to be stored in stack data structure which will be used while coming back during traversal.<br><br>DFS spanning tree<br>Preorder<br>Time complexity: O(n) no of vertices", "x": "", "src": "Graph Algorithms"}]}, {"name": "Python", "cards": [{"id": "P;*uHrcq{:", "q": "<div class=\"code\">{x:x**2 for x in range(10)}<\/div>", "a": "<div class=\"code\"><div><div><div><div><div><pre>{0: 0, 1: 1, 2: 4, 3: 9, 4: 16, 5: 25, 6: 36, 7: 49, 8: 64, 9: 81}<\/pre><\/div><\/div><\/div><\/div><\/div><\/div>", "x": "<div>This is an example of dictionary comprehension<\/div>", "src": "Python"}, {"id": "z.t}iK%C:z", "q": "<div class=\"code\">[x**2 for x in range(10)]<\/div>", "a": "<div class=\"code\"><div><div><div><div><div><pre>[0, 1, 4, 9, 16, 25, 36, 49, 64, 81]<\/pre><\/div><\/div><\/div><\/div><\/div><\/div>", "x": "This is an example of List comprehension", "src": "Python"}, {"id": "16)PD", "q": "Strings in Python are immutable/mutable?", "a": "Strings in Python are immutable means you can't change in-place value of a char. Once string is created you can't change/replace its elements", "x": "", "src": "Python"}, {"id": "5sFH4", "q": "What is set?", "a": "Set is a collection of un-ordered unique items it looks like dictionary (in notation) but only keys which are unique. It can help in removing repeated items means you can use set to cast list.", "x": "", "src": "Python"}, {"id": "tSk+1", "q": "Is Python list mutable?", "a": "List are mutable, this means that we can change in-place value.", "x": "", "src": "Python"}, {"id": "b+<_C", "q": "Is tuples are mutable?", "a": "tuples are not mutable (does not support item assignment) aka immutable, fewer methods in tuples then why to use instead of list. The key is immutability. if an program if you want sequence/val does not get changed then tuple is an solution like storing calendar dates which know will not change during your programs.", "x": "", "src": "Python"}, {"id": "ft*W3", "q": "<div class=\"code\">s= \"Hello World\" <br>s[::-1]<\/div>", "a": "<div class=\"code\">dlroW olleH<\/div>", "x": "this will reverse string s \"dlroW olleH\" double colon is used to tell the range and also how many elements can be skipped.", "src": "Python"}, {"id": "pF^425kNtx", "q": "How to make a dictionary?", "a": "<div class=\"code\">my_dict = {}<\/div>", "x": "", "src": "Python"}, {"id": "n`jQr-aC/E", "q": "<div class=\"code\">How to access key1 in dictionary <span>my_dict = {'key1':'value1','key2':'value2'}<\/span>?<\/div>", "a": "<div class=\"code\">my_dict['key1']<\/div>", "x": "Pl note that dictinary is defined by {} and accessed using ['key-name']", "src": "Python"}, {"id": "G^O@O$qm/)", "q": "Method to return a list of all keys of a dictionary?", "a": "<div class=\"code\">d.keys()<\/div>", "x": "", "src": "Python"}, {"id": "FA]|vY&uO7", "q": "What are Python methods?", "a": "Functions that belong to objects", "x": "In Python everything is an object, each object have methods associated, depending on type i.e.; list, int, float etc but avaliable methods are different.", "src": "Python"}, {"id": "cpkZ2nKJGE", "q": "Name a method which can change the object in which it was called?", "a": "<div class=\"code\">append<\/div>", "x": "str.append(\"test\") will change the str", "src": "Python"}, {"id": "y47nu@3B,f", "q": "Given a list with tuple, sort the second element using lambda expression in Python", "a": "<div>sorted([('abc', 121),('abc', 231),('abc', 148), ('abc',221)],key=lambda x: x[1], reverse=True)<br><\/div>", "x": "", "src": "Python"}]}];const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const txt=h=>{const d=document.createElement('div');d.innerHTML=h;return d.textContent.replace(/\s+/g,' ').trim();};
// Storage keys are prefixed: localStorage is shared with every other repo on the same github.io origin.
const KEY='mlds.known',TOUR='mlds.tourDone',DECK='mlds.deck';
let known={};try{known=JSON.parse(localStorage.getItem(KEY)||'{}');}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(known));}catch(e){}};
const ALL=DECKS.flatMap(d=>d.cards.map(c=>({...c,deck:d.name,plain:(txt(c.q)+' '+txt(c.a)+' '+txt(c.x)).toLowerCase()})));
let list=[],i=0,flipped=false;
$('deck').add(new Option('All decks ('+ALL.length+')','all'));
DECKS.forEach(d=>$('deck').add(new Option(d.name+' ('+d.cards.length+')',d.name)));
if([...$('deck').options].some(o=>o.value==localStorage.getItem(DECK)))$('deck').value=localStorage.getItem(DECK);
const pool=()=>$('deck').value=='all'?ALL:ALL.filter(c=>c.deck==$('deck').value);
function build(keep){const q=$('q').value.toLowerCase().trim();
 list=pool().filter(c=>(!q||c.plain.includes(q))&&($('mode').value=='all'||!known[c.id]));
 if(!keep)i=0;i=Math.min(i,Math.max(0,list.length-1));render();}
function render(){flipped=false;$('card').classList.remove('flip');const c=list[i],p=pool();
 $('stats').textContent='Known: '+p.filter(x=>known[x.id]).length+'/'+p.length;
 if(!c){$('front').innerHTML='<div class="in"><div class="q">🎉 No cards here.</div></div>';$('back').innerHTML='';$('pos').textContent='';return;}
 $('pos').textContent='Card '+(i+1)+' of '+list.length;
 const chips='<div class="chips">'+($('deck').value=='all'?'<span class="chip">'+esc(c.deck)+'</span>':'')+(c.src?'<span class="chip">'+esc(c.src)+'</span>':'')+'</div>';
 $('front').innerHTML='<div class="in">'+chips+'<div class="lbl">Question</div><div class="q">'+c.q+'</div></div>';
 $('back').innerHTML='<div class="in"><div class="lbl">Answer</div><div class="qsmall">'+c.q.replace(/<img[^>]*>/g,'')+'</div><div class="ans">'+c.a+'</div>'+(c.x?'<div class="x">'+c.x+'</div>':'')+'</div>';
 $('front').scrollTop=$('back').scrollTop=0;}
const flip=()=>{flipped=!flipped;$('card').classList.toggle('flip',flipped)};
const go=n=>{if(list.length){i=(i+n+list.length)%list.length;render();}};
const mark=v=>{const c=list[i];if(!c)return;if(v)known[c.id]=1;else delete known[c.id];save();
 if($('mode').value=='due'&&v)build(true);else go(1);};
const say=()=>{const c=list[i];if(!c||!window.speechSynthesis)return;speechSynthesis.cancel();
 speechSynthesis.speak(new SpeechSynthesisUtterance(flipped?txt(c.a)+'. '+txt(c.x):txt(c.q)));};
$('scene').onclick=e=>{if(e.target.tagName=='IMG'&&(flipped?e.target.closest('.back'):e.target.closest('.front'))){
 $('zoom').innerHTML='<img src="'+esc(e.target.getAttribute('src'))+'" alt="">';$('zoom').classList.add('on');return;}flip();};
$('zoom').onclick=()=>$('zoom').classList.remove('on');
$('prev').onclick=()=>go(-1);$('next').onclick=()=>go(1);
$('again').onclick=()=>mark(0);$('good').onclick=()=>mark(1);$('say').onclick=say;
$('shuf').onclick=()=>{for(let a=list.length-1;a>0;a--){const b=Math.random()*(a+1)|0;[list[a],list[b]]=[list[b],list[a]];}i=0;render();};
$('deck').onchange=()=>{localStorage.setItem(DECK,$('deck').value);build();};$('mode').onchange=()=>build();$('q').oninput=()=>build();
const STEPS=[
 {t:'Welcome 👋',p:`Flashcards for machine learning, deep learning, data mining, algorithms and Python: <b>${ALL.length}</b> cards in ${DECKS.length} decks. This quick tour shows how it works.`},
 {el:'deck',t:'1. Pick a deck',p:'Study one topic, or choose <b>All decks</b> to mix them. Your choice is remembered.'},
 {el:'scene',t:'2. Think, then flip',p:'Read the question and answer it in your head. Then <b>click the card</b> or press <kbd>Space</kbd> to flip it.'},
 {el:'scene',flip:1,t:'3. Check the answer',p:'The back shows the answer, and sometimes an explanation or a diagram. Click a diagram to enlarge it.'},
 {el:'rate',t:'4. Be honest with yourself',p:'Press <b>Know it</b> (<kbd>2</kbd>) if you got it right, or <b>Again</b> (<kbd>1</kbd>) if you didn’t. Use <b>← Prev</b> / <b>Next →</b> to browse without rating.'},
 {el:'stats',t:'5. Track your progress',p:'This counts the cards you know. Progress is saved in this browser.'},
 {el:'mode',t:'6. Focus on what’s left',p:'Switch to <b>Not yet known</b> to study only the cards you haven’t marked as known.'},
 {el:'tools',t:'7. Search and shuffle',p:'<b>Search</b> looks through questions, answers and explanations. <b>Shuffle</b> mixes up the order.'},
 {el:'help',t:'You’re all set! 🎉',p:'The cards also work offline once loaded. Shortcuts: <kbd>Space</kbd> flip · <kbd>←</kbd><kbd>→</kbd> move · <kbd>1</kbd> Again · <kbd>2</kbd> Know it · <kbd>S</kbd> speak.<br>Click <b>?</b> any time to see this tour again.'}];
let ts=-1;
function tourRect(id){if(id=='rate'){const a=$('again').getBoundingClientRect(),b=$('good').getBoundingClientRect();return{left:a.left,top:Math.min(a.top,b.top),right:b.right,bottom:Math.max(a.bottom,b.bottom)};}
 if(id=='tools'){const a=$('q').getBoundingClientRect(),b=$('shuf').getBoundingClientRect();return{left:Math.min(a.left,b.left),top:Math.min(a.top,b.top),right:Math.max(a.right,b.right),bottom:Math.max(a.bottom,b.bottom)};}
 return $(id).getBoundingClientRect();}
function tourShow(){const s=STEPS[ts],tip=$('tip'),spot=$('spot'),last=ts==STEPS.length-1;
 if(!!s.flip!==flipped)flip();
 tip.innerHTML=`<h3>${s.t}</h3><p>${s.p}</p><div class="row"><span class="dots">${ts+1} / ${STEPS.length}</span>${last?'':'<button class="skip" id="tSkip">Skip tour</button>'}${ts?'<button id="tBack">Back</button>':''}<button class="pri" id="tNext">${last?'Start learning':ts?'Next':'Show me'}</button></div>`;
 $('tNext').onclick=()=>tourGo(1);if(ts)$('tBack').onclick=()=>tourGo(-1);if(!last)$('tSkip').onclick=tourEnd;
 const W=innerWidth,H=innerHeight,tw=tip.offsetWidth,th=tip.offsetHeight,pad=8;
 if(!s.el){spot.style.cssText=`left:${W/2}px;top:${H/2}px;width:0;height:0`;tip.style.left=(W-tw)/2+'px';tip.style.top=Math.max(12,(H-th)/2)+'px';$('tNext').focus();return;}
 $(s.el=='rate'?'good':s.el=='tools'?'q':s.el).scrollIntoView({block:'center'});
 const r=tourRect(s.el);spot.style.cssText=`left:${r.left-pad}px;top:${r.top-pad}px;width:${r.right-r.left+2*pad}px;height:${r.bottom-r.top+2*pad}px`;
 let top=r.bottom+pad+12;if(top+th>H-12)top=r.top-pad-12-th;if(top<12)top=Math.max(12,H-th-12);
 tip.style.top=top+'px';tip.style.left=Math.min(Math.max(12,(r.left+r.right)/2-tw/2),W-tw-12)+'px';$('tNext').focus();}
function tourGo(n){ts+=n;if(ts>=STEPS.length)return tourEnd();tourShow();}
function tourStart(){ts=0;$('tour').classList.add('on');tourShow();}
function tourEnd(){ts=-1;$('tour').classList.remove('on');if(flipped)flip();try{localStorage.setItem(TOUR,'1');}catch(e){}}
$('help').onclick=e=>{e.stopPropagation();tourStart();};
addEventListener('resize',()=>{if(ts>=0)tourShow();});
document.onkeydown=e=>{if(ts>=0){if(e.key=='Escape')tourEnd();else if(e.key=='ArrowRight')tourGo(1);else if(e.key=='ArrowLeft'&&ts)tourGo(-1);return;}
 if($('zoom').classList.contains('on')){if(e.key=='Escape'||e.key==' '){e.preventDefault();$('zoom').classList.remove('on');}return;}
 if(e.target.tagName=='INPUT'||e.target.tagName=='SELECT')return;
 if(e.key==' '){e.preventDefault();flip();}else if(e.key=='ArrowRight')go(1);else if(e.key=='ArrowLeft')go(-1);
 else if(e.key=='1')mark(0);else if(e.key=='2')mark(1);else if(e.key.toLowerCase()=='s')say();};
build();
if(!localStorage.getItem(TOUR))setTimeout(tourStart,400);

// Offline cache: sw.js keeps the page and images; a new build is fetched in the background
// and the "Refresh" banner switches to it (old cache is then removed).
const net=()=>{$('net').textContent=navigator.onLine?'':'offline';};addEventListener('online',net);addEventListener('offline',net);net();
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
 let reload=false;  // only after "Refresh"; the first install also changes the controller
 navigator.serviceWorker.addEventListener('controllerchange',()=>{if(reload){reload=false;location.reload();}});
 navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>{
  const offer=w=>{$('upd').classList.add('on');$('updBtn').onclick=()=>{reload=true;$('upd').classList.remove('on');w.postMessage('skipWaiting');};};
  if(reg.waiting&&navigator.serviceWorker.controller)offer(reg.waiting);
  reg.addEventListener('updatefound',()=>{const w=reg.installing;w.addEventListener('statechange',()=>{
   if(w.state=='installed'&&navigator.serviceWorker.controller)offer(w);});});
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState=='visible')reg.update().catch(()=>{});});
 }).catch(()=>{});
 if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
}
</script></body></html>
