at are misclassified or inside the margin.", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 3}, {"id": "sc-f6b3f3f037a2", "q": "Linear regression", "a": "Predicts a numeric target as a weighted sum of features, usually fitted by least squares.", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 2}, {"id": "sc-a287ff35b15c", "q": "Ordinary least squares (OLS)", "a": "Fits a linear model by minimizing the sum of squared residuals.", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 3}, {"id": "sc-2b3c00661991", "q": "Normal equation", "a": "The closed-form linear regression solution: θ = (XᵀX)⁻¹Xᵀy.", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 4}, {"id": "sc-082c4574e67b", "q": "Linear regression assumptions", "a": "Linearity, independent errors, constant error variance (homoscedasticity) and normally distributed errors for valid inference.", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 3}, {"id": "sc-eef2ca16bb74", "q": "Multicollinearity", "a": "Strong correlation among features, which makes linear model coefficients unstable and hard to interpret.", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 3}, {"id": "sc-251c1932eb62", "q": "Variance inflation factor (VIF)", "a": "A measure of how much a coefficient's variance is inflated by correlation with the other features.", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 3}, {"id": "sc-2b0db4e73173", "q": "Polynomial regression", "a": "Linear regression on polynomial powers of the features, which allows a curved fit.", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 2}, {"id": "sc-67bed8a8994b", "q": "Logistic regression", "a": "A linear classifier that passes a weighted sum through a sigmoid to output a class probability.", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 2}, {"id": "sc-a15c1ceaeb76", "q": "Sigmoid function", "a": "σ(x) = 1 / (1 + e⁻ˣ): squashes any real number into the range (0, 1).", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 2}, {"id": "sc-9cd750ef2b88", "q": "Log-odds (logit)", "a": "log(p / (1 − p)). Logistic regression models the log-odds as a linear function of the features.", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 3}, {"id": "sc-1870b5714f6a", "q": "Softmax regression", "a": "Extends logistic regression to multiple classes by converting scores into probabilities that sum to 1.", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 3}, {"id": "sc-1a7c5515667e", "q": "Decision boundary", "a": "The surface in feature space that separates the regions a classifier assigns to different classes.", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 2}, {"id": "sc-a552ffed791f", "q": "K-nearest neighbors (KNN)", "a": "Predicts from the labels of the k closest training points. It is a lazy learner with no real training step.", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 2}, {"id": "sc-a485e7d55d73", "q": "Naive Bayes", "a": "A probabilistic classifier that applies Bayes' theorem and assumes features are independent given the class.", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 3}, {"id": "sc-17b6a368d596", "q": "Laplace smoothing", "a": "Adding a small count to every feature-class pair so unseen values do not produce zero probability.", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 3}, {"id": "sc-f092b6bf8953", "q": "Decision tree", "a": "A model that splits data with a series of if-then feature tests, ending in leaf predictions.", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 2}, {"id": "sc-e868c7658450", "q": "Gini impurity", "a": "The chance of misclassifying a random item if it is labeled according to the node's class mix. Decision trees use it to choose splits.", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 3}, {"id": "sc-50b9aa24b4ed", "q": "Information gain", "a": "The reduction in entropy achieved by a split. Decision trees can pick splits that maximize it.", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 3}, {"id": "sc-c7fdf158c558", "q": "Pruning", "a": "Removing tree branches that add little predictive value, which reduces overfitting.", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 3}, {"id": "sc-8bfb4e1aa590", "q": "CART", "a": "Classification and Regression Trees: an algorithm that builds binary trees using Gini impurity or squared error.", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 3}, {"id": "sc-d0e3192f0566", "q": "Support vector machine (SVM)", "a": "A classifier that finds the boundary with the largest margin between classes.", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 3}, {"id": "sc-5033fb5f759a", "q": "Margin", "a": "The distance between an SVM's decision boundary and the nearest training points.", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 3}, {"id": "sc-e19fab19c51e", "q": "Support vectors", "a": "The training points closest to the SVM boundary, which alone determine its position.", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 3}, {"id": "sc-43f26fc63589", "q": "Kernel trick", "a": "Computing inner products as if data were in a higher-dimensional space, without explicitly transforming it.", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 4}, {"id": "sc-17d56d4aeabe", "q": "RBF kernel", "a": "A similarity function that decays with squared distance between points; a common default for non-linear SVMs.", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 4}, {"id": "sc-2ac7c97340e1", "q": "Ensemble learning", "a": "Combining several models so that the group performs better than the individual members.", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 2}, {"id": "sc-b1f11803c061", "q": "Bagging", "a": "Bootstrap aggregating: training models on resampled data and averaging their outputs to reduce variance.", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 3}, {"id": "sc-0e420d7b5667", "q": "Boosting", "a": "Training models one after another, each focusing on the errors of those before, which mainly reduces bias.", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 3}, {"id": "sc-a1b76f38a325", "q": "Stacking", "a": "Using a meta-model to learn how to combine the predictions of several base models.", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 3}, {"id": "sc-8b3233a8a8e8", "q": "Voting classifier", "a": "An ensemble that predicts by majority vote (hard) or averaged probabilities (soft).", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 2}, {"id": "sc-945469fdb46c", "q": "Random forest", "a": "An ensemble of decision trees trained with bagging and random feature subsets at each split.", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 3}, {"id": "sc-c6673682e861", "q": "Out-of-bag (OOB) error", "a": "A validation estimate for bagging, computed on the samples each tree did not see during training.", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 3}, {"id": "sc-df327f605b30", "q": "Extra Trees", "a": "Extremely randomized trees: a forest that also picks split thresholds at random, trading a little bias for lower variance.", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 3}, {"id": "sc-afc812cc1b43", "q": "AdaBoost", "a": "A boosting method that reweights examples to focus on those misclassified earlier, combining weak learners.", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 3}, {"id": "sc-24e857aa534a", "q": "Gradient boosting", "a": "Builds an ensemble in stages, with each new model fitting the negative gradient of the loss (the residuals, for squared error).", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 3}, {"id": "sc-f3105f7eafd1", "q": "XGBoost", "a": "A fast, regularized gradient boosting library, long a favorite for tabular data.", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 3}, {"id": "sc-95887900b325", "q": "LightGBM", "a": "A gradient boosting library that uses histogram-based splits and leaf-wise tree growth for speed.", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 3}, {"id": "sc-ac71f9b34f7a", "q": "CatBoost", "a": "A gradient boosting library with built-in handling of categorical features through ordered target statistics.", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 3}, {"id": "sc-ed1fe888668f", "q": "K-means clustering", "a": "Partitions data into k clusters by alternately assigning points to the nearest centroid and recomputing centroids.", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 2}, {"id": "sc-259c1f0b29cd", "q": "K-means++", "a": "A k-means initialization that spreads the starting centroids apart, improving results and convergence.", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 3}, {"id": "sc-996b163e1733", "q": "Elbow method", "a": "Choosing k by plotting within-cluster error against k and looking for the bend.", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 2}, {"id": "sc-2725941db965", "q": "Silhouette score", "a": "A clustering metric from −1 to 1 comparing how close a point is to its own cluster versus the nearest other cluster.", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 3}, {"id": "sc-814abf23722a", "q": "Hierarchical clustering", "a": "Builds a tree of nested clusters, either by merging up (agglomerative) or splitting down (divisive).", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 3}, {"id": "sc-738ec80ddcae", "q": "Dendrogram", "a": "A tree diagram showing the order and distances of merges in hierarchical clustering.", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 2}, {"id": "sc-85304367eb97", "q": "DBSCAN", "a": "A density-based clustering method that finds arbitrarily shaped clusters and labels sparse points as noise.", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 3}, {"id": "sc-8e956f07d448", "q": "Gaussian mixture model (GMM)", "a": "Models data as a mix of Gaussian components, giving each point a soft cluster membership.", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 4}, {"id": "sc-e916ba89828e", "q": "Expectation-maximization (EM)", "a": "An iterative algorithm for models with hidden variables, alternating between estimating them and updating parameters.", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 4}, {"id": "sc-a2dc0bcb928a", "q": "Curse of dimensionality", "a": "As features increase, data grows sparse and distances lose meaning, making learning harder.", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 3}, {"id": "sc-a7e922a55a2f", "q": "Dimensionality reduction", "a": "Reducing the number of features while keeping as much useful information as possible.", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 3}, {"id": "sc-050737fcac0d", "q": "Principal component analysis (PCA)", "a": "Projects data onto orthogonal directions that capture the most variance.", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 3}, {"id": "sc-b5f53b0b38a6", "q": "Explained variance ratio", "a": "The share of total variance captured by each principal component.", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 3}, {"id": "sc-eef0a630e165", "q": "Singular value decomposition (SVD)", "a": "Factorizes a matrix as UΣVᵀ. It underlies PCA and many recommendation methods.", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 4}, {"id": "sc-ebc2af5d88d4", "q": "Linear discriminant analysis (LDA)", "a": "A supervised dimensionality reduction method that finds directions which best separate the classes.", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 4}, {"id": "sc-15fa57cce9a8", "q": "t-SNE", "a": "A non-linear method for visualizing high-dimensional data in 2D or 3D by preserving local neighborhoods.", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 4}, {"id": "sc-4df785b3553b", "q": "UMAP", "a": "A non-linear dimensionality reduction method like t-SNE, usually faster and better at keeping some global structure.", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 4}, {"id": "sc-e401a5fcf389", "q": "Anomaly detection", "a": "Identifying rare items or events that differ significantly from normal behavior.", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 2}, {"id": "sc-0944bd7c4d4c", "q": "Isolation Forest", "a": "Detects anomalies by randomly partitioning data; anomalies take fewer splits to isolate.", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 3}, {"id": "sc-4088ba9d6171", "q": "One-class SVM", "a": "Learns a boundary around normal data, so that points outside it can be flagged as anomalies.", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 3}, {"id": "sc-5dff7d8c6e2c", "q": "Association rules", "a": "If-then patterns in transaction data, such as \"people who buy bread often buy butter.\"", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 2}, {"id": "sc-bb97fb14d663", "q": "Support, confidence and lift", "a": "Support is how often items occur together; confidence is P(B|A); lift compares confidence to B's base rate.", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 2}, {"id": "sc-8e6ef611a30b", "q": "Apriori algorithm", "a": "Mines frequent itemsets, relying on the fact that every subset of a frequent itemset must also be frequent.", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 3}, {"id": "sc-7884d1c9ad0f", "q": "Collaborative filtering", "a": "Recommends items using the behavior of similar users or similar items, not the item's content.", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 2}, {"id": "sc-8afc49e157cc", "q": "Content-based filtering", "a": "Recommends items whose attributes resemble what the user has liked before.", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 2}, {"id": "sc-075fdc1ee556", "q": "Matrix factorization", "a": "Decomposes a user-item matrix into latent user and item factors for recommendation.", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 4}, {"id": "sc-f87d0d9aad4d", "q": "Cold start problem", "a": "The difficulty of recommending to new users or new items that have little or no interaction history.", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 2}, {"id": "sc-914a5c1f9f01", "q": "Time series", "a": "Data points indexed in time order, such as daily sales.", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 2}, {"id": "sc-78a3bbf43143", "q": "Seasonality", "a": "A regular pattern that repeats at a fixed period, such as weekly or yearly.", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 2}, {"id": "sc-d192d2127412", "q": "Stationarity", "a": "A time series property in which the mean, variance and autocorrelation stay stable over time.", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 3}, {"id": "sc-2497c5ed377b", "q": "Autocorrelation", "a": "The correlation of a time series with lagged copies of itself.", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 3}, {"id": "sc-37c1c397074c", "q": "ARIMA", "a": "AutoRegressive Integrated Moving Average: a time series forecasting model combining lags, differencing and past errors.", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 4}, {"id": "sc-bf4ce449c0e0", "q": "Exponential smoothing", "a": "Forecasting with weighted averages that give more weight to recent observations.", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 3}, {"id": "sc-a5afbb5eef00", "q": "Prophet", "a": "A forecasting library from Meta that models trend, seasonality and holidays additively.", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 3}, {"id": "sc-f8b77d20f468", "q": "Gradient descent", "a": "An optimization method that repeatedly moves parameters in the direction that most reduces the loss.", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 2}, {"id": "sc-3121de2bdeac", "q": "Learning rate", "a": "The step size of each gradient descent update. Too high diverges; too low is slow.", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 2}, {"id": "sc-a4e8c2536d0f", "q": "Batch gradient descent", "a": "Computes each update using the whole training set.", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 2}, {"id": "sc-c5d0b956babd", "q": "Stochastic gradient descent (SGD)", "a": "Updates parameters using one example at a time. It is noisy but cheap, and the term often also covers mini-batches.", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 3}, {"id": "sc-25a463a455af", "q": "Mini-batch gradient descent", "a": "Updates parameters using small batches, balancing stable gradients with speed.", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 3}, {"id": "sc-ccb118868927", "q": "Convex function", "a": "A function where any local minimum is also the global minimum, which makes optimization easier.", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 3}, {"id": "sc-2b1d18770039", "q": "Local minimum", "a": "A point lower than its neighbors but not necessarily the lowest overall.", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 3}, {"id": "sc-8ac1f753a4a7", "q": "Epoch", "a": "One complete pass through the whole training set.", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 2}, {"id": "sc-61b6c394ee06", "q": "Parametric vs non-parametric models", "a": "Parametric models have a fixed number of parameters; non-parametric models can grow in complexity with the data.", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 3}, {"id": "sc-a88e5cbe1cb1", "q": "Generative vs discriminative models", "a": "Generative models learn how the data is distributed, P(x, y); discriminative models learn the class boundary, P(y|x).", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 3}, {"id": "sc-50838f0b7f2b", "q": "Lazy vs eager learning", "a": "Lazy learners defer work until prediction, like KNN; eager learners build a model up front.", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 3}, {"id": "sc-2408cd7e499e", "q": "Online learning", "a": "Updating a model incrementally as new data arrives, instead of retraining from scratch.", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 3}, {"id": "sc-101bcc221713", "q": "Semi-supervised learning", "a": "Training with a small amount of labeled data and a large amount of unlabeled data.", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 3}, {"id": "sc-676b15aef504", "q": "Self-supervised learning", "a": "Generating labels from the data itself, for example by predicting a hidden part of the input.", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 3}, {"id": "sc-ff6b59b88465", "q": "Active learning", "a": "The model picks which unlabeled examples would be most useful for humans to label next.", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 3}, {"id": "sc-2c49bd015a27", "q": "Multi-armed bandit", "a": "A simple reinforcement problem of balancing trying options (exploration) with using the best so far (exploitation).", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 4}, {"id": "sc-a07e80c4fa9f", "q": "No free lunch theorem", "a": "Averaged over all possible problems, no learning algorithm is better than any other, so assumptions must fit the task.", "x": "", "src": "Level 4 · Core ML Ideas & Classic Algorithms", "c": 4}, {"id": "sc-a2ebfd2b89a7", "q": "Overfitting", "a": "When a model learns noise in the training data, so it performs well there but poorly on new data.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 2}, {"id": "sc-a151b1bbdff8", "q": "Underfitting", "a": "When a model is too simple to capture the underlying pattern, so it performs poorly even on training data.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 2}, {"id": "sc-5429eb02ba5e", "q": "Generalization", "a": "A model's ability to perform well on new data it has not seen.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 2}, {"id": "sc-2bd877fe285e", "q": "Generalization gap", "a": "The difference between a model's performance on training data and on unseen data.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 3}, {"id": "sc-52d7bcc8e59e", "q": "Bias-variance tradeoff", "a": "Simple models tend to err through bias, flexible models through variance; good models balance the two.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 3}, {"id": "sc-b153eb94b383", "q": "Bias (model error)", "a": "Error from overly simple assumptions, which causes a model to miss real patterns.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 3}, {"id": "sc-849cd245b5a4", "q": "Variance (model error)", "a": "Error from sensitivity to the particular training set, which causes a model to fit noise.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 3}, {"id": "sc-9f1877a12b96", "q": "Irreducible error", "a": "The noise inherent in a problem, which no model can remove.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 3}, {"id": "sc-224c7c96523c", "q": "Regularization", "a": "Techniques that constrain a model to reduce overfitting, such as penalizing large weights.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 3}, {"id": "sc-0e051a911f08", "q": "L1 regularization (Lasso)", "a": "Adds the sum of absolute weights to the loss, which drives some weights to exactly zero.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 3}, {"id": "sc-afee414582c6", "q": "L2 regularization (Ridge)", "a": "Adds the sum of squared weights to the loss, which shrinks weights without usually zeroing them.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 3}, {"id": "sc-17e0040328c1", "q": "Elastic Net", "a": "Combines L1 and L2 penalties.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 3}, {"id": "sc-46b030919e79", "q": "Early stopping", "a": "Halting training when validation performance stops improving.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 2}, {"id": "sc-5328b2ab66bc", "q": "Holdout method", "a": "Splitting data once into separate training and test portions.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 2}, {"id": "sc-d0c69c04a5f6", "q": "Stratified split", "a": "A train-test split that keeps class proportions the same in both parts.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 3}, {"id": "sc-012b2d4d56b7", "q": "K-fold cross-validation", "a": "Splits data into k folds, training on k−1 and validating on the remaining one, rotating through all k.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 3}, {"id": "sc-98d6809e8ad7", "q": "Stratified k-fold", "a": "K-fold cross-validation that preserves each fold's class proportions.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 3}, {"id": "sc-37539eb107ec", "q": "Leave-one-out cross-validation", "a": "K-fold where k equals the number of samples. It is accurate on small data but costly.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 3}, {"id": "sc-50dfd932464e", "q": "Nested cross-validation", "a": "An outer loop estimates performance while an inner loop tunes hyperparameters, avoiding optimistic estimates.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 4}, {"id": "sc-2285db4188cb", "q": "Time series split", "a": "Validation that always trains on the past and tests on the future, which avoids look-ahead leakage.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 3}, {"id": "sc-ac420180ef67", "q": "Group k-fold", "a": "Keeps all samples from the same group, such as one patient, in a single fold.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 3}, {"id": "sc-617d299bcddf", "q": "Data leakage", "a": "When training uses information unavailable at prediction time, which makes results look unrealistically good.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 3}, {"id": "sc-64c4707e59ef", "q": "Target leakage", "a": "A feature that directly encodes or is produced after the target, such as \"refund issued\" when predicting a return.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 3}, {"id": "sc-fc04d6f6ef0e", "q": "Train-test contamination", "a": "Letting test data influence training, for example by fitting a scaler on the whole dataset.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 3}, {"id": "sc-646e7b836b10", "q": "Confusion matrix", "a": "A table of true positives, false positives, true negatives and false negatives.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 2}, {"id": "sc-0a92da101328", "q": "True positive (TP)", "a": "A positive case correctly predicted as positive.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 2}, {"id": "sc-10127fc70df2", "q": "False positive (FP)", "a": "A negative case wrongly predicted as positive.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 2}, {"id": "sc-223997f43413", "q": "True negative (TN)", "a": "A negative case correctly predicted as negative.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 2}, {"id": "sc-8c15fab21ef2", "q": "False negative (FN)", "a": "A positive case wrongly predicted as negative.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 2}, {"id": "sc-13800272d7a8", "q": "Precision", "a": "TP / (TP + FP): of the items predicted positive, the share that really are.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 2}, {"id": "sc-5f8639d847f3", "q": "Recall (sensitivity)", "a": "TP / (TP + FN): of the actual positives, the share the model found.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 2}, {"id": "sc-e8d196f163ab", "q": "Specificity", "a": "TN / (TN + FP): of the actual negatives, the share correctly identified.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 2}, {"id": "sc-bbeb458cb860", "q": "F1 score", "a": "The harmonic mean of precision and recall: 2PR / (P + R).", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 2}, {"id": "sc-40d23e14c419", "q": "F-beta score", "a": "A generalized F1 in which β weights recall relative to precision.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 3}, {"id": "sc-1cad18311b80", "q": "Macro vs micro averaging", "a": "Macro averages the metric per class equally; micro pools all decisions, so frequent classes count more.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 3}, {"id": "sc-209c8619aa72", "q": "Balanced accuracy", "a": "The average of recall across classes, which is useful for imbalanced data.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 3}, {"id": "sc-4b32ccc9d70c", "q": "Matthews correlation coefficient (MCC)", "a": "A balanced metric from −1 to +1 that uses all four confusion-matrix cells.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 4}, {"id": "sc-2094a8e2bf6e", "q": "Cohen's kappa", "a": "Measures agreement between two raters or a model and labels, adjusted for agreement expected by chance.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 3}, {"id": "sc-8a1ad8b3d470", "q": "ROC curve", "a": "Plots the true positive rate against the false positive rate across classification thresholds.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 3}, {"id": "sc-e594240d4155", "q": "AUC (area under the ROC curve)", "a": "The probability that the model ranks a random positive above a random negative. 0.5 is chance level.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 3}, {"id": "sc-923abd91bb0a", "q": "Precision-recall curve", "a": "Plots precision against recall across thresholds. It is more informative than ROC when positives are rare.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 3}, {"id": "sc-58dd73b2d2f1", "q": "Average precision (AP)", "a": "A summary of the precision-recall curve, roughly the area beneath it.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 3}, {"id": "sc-00516ed47225", "q": "Log loss", "a": "Cross-entropy used as an evaluation metric; it rewards well-calibrated probabilities.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 3}, {"id": "sc-3277e16a1050", "q": "Classification threshold", "a": "The probability cutoff above which a prediction is labeled positive. It can be tuned to trade precision against recall.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 3}, {"id": "sc-9a7090e4dd83", "q": "Precision-recall tradeoff", "a": "Raising the classification threshold usually increases precision and lowers recall, and lowering it does the reverse.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 3}, {"id": "sc-6ee64c514626", "q": "Accuracy paradox", "a": "A model can score high accuracy on imbalanced data by always predicting the majority class.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 2}, {"id": "sc-384509ed5413", "q": "Calibration", "a": "How well predicted probabilities match observed frequencies; 80% predictions should be right about 80% of the time.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 3}, {"id": "sc-e44e017dc7a8", "q": "Reliability diagram", "a": "A plot of predicted probability against observed frequency, used to check calibration.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 3}, {"id": "sc-3112bdfaa45d", "q": "Brier score", "a": "The mean squared difference between predicted probabilities and actual outcomes.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 3}, {"id": "sc-56be4a3d2190", "q": "Platt scaling", "a": "Calibrating a model's scores by fitting a logistic regression on top of them.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 4}, {"id": "sc-779998e66a97", "q": "Isotonic regression", "a": "A non-parametric calibration method that fits a piecewise-constant, non-decreasing function.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 4}, {"id": "sc-9f50bf6d8622", "q": "Adjusted R²", "a": "R² penalized for the number of features, so adding useless predictors does not improve it.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 3}, {"id": "sc-40418b12e176", "q": "MAPE", "a": "Mean absolute percentage error. It is easy to interpret but unstable when true values are near zero.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 3}, {"id": "sc-50b5d6c6ac11", "q": "AIC and BIC", "a": "Model selection criteria that reward fit and penalize complexity. BIC penalizes complexity more for large samples.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 4}, {"id": "sc-68d22e27d130", "q": "Learning curve", "a": "A plot of performance against training size or time, used to diagnose overfitting and underfitting.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 3}, {"id": "sc-f1939128e792", "q": "Baseline model", "a": "A very simple reference model, such as always predicting the mean, that a real model must beat.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 2}, {"id": "sc-49465e5fb602", "q": "Grid search", "a": "Tries every combination of a specified set of hyperparameter values.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 2}, {"id": "sc-0b124de58b28", "q": "Random search", "a": "Samples hyperparameter combinations randomly, often more efficient than grid search in high dimensions.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 2}, {"id": "sc-0a8ec5306b76", "q": "Bayesian optimization", "a": "Uses a surrogate model of past trials to choose which hyperparameters to try next.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 4}, {"id": "sc-dbd8a56ae2fd", "q": "Successive halving (Hyperband)", "a": "Gives many configurations small budgets and repeatedly keeps only the best for more resources.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 4}, {"id": "sc-ada54977e2b2", "q": "AutoML", "a": "Automating model selection, feature processing and tuning.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 3}, {"id": "sc-c1f82f77d6cd", "q": "Feature engineering", "a": "Using domain knowledge to create or transform inputs that make models more effective.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 2}, {"id": "sc-c167a9388fa0", "q": "Feature selection", "a": "Choosing a useful subset of features and discarding the rest.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 2}, {"id": "sc-963eb69348e3", "q": "Filter methods", "a": "Selecting features using a statistic such as correlation or mutual information, independently of the model.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 3}, {"id": "sc-0216ca85461c", "q": "Wrapper methods", "a": "Selecting features by training a model on different subsets, such as recursive feature elimination.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 3}, {"id": "sc-ba9616f105a4", "q": "Embedded methods", "a": "Feature selection that happens during model training, such as L1 regularization.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 3}, {"id": "sc-3a459eee5d6e", "q": "Mutual information", "a": "A measure of how much knowing one variable reduces uncertainty about another; it captures non-linear relationships.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 3}, {"id": "sc-31bf28a692a4", "q": "One-hot encoding", "a": "Representing a category as a binary vector with a 1 in that category's position and 0 elsewhere.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 2}, {"id": "sc-8e15dd4d0f11", "q": "Label encoding", "a": "Mapping each category to an integer. It implies an order that linear models may misinterpret.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 2}, {"id": "sc-c0eb54ccf1e0", "q": "Ordinal encoding", "a": "Mapping ordered categories to integers that preserve their order.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 2}, {"id": "sc-71e2298ccf2c", "q": "Target encoding", "a": "Replacing a category with the mean target for that category. It must be done within folds to avoid leakage.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 3}, {"id": "sc-cee9ecca9aa1", "q": "Frequency encoding", "a": "Replacing a category with how often it appears.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 2}, {"id": "sc-dedcef4e4cfb", "q": "Feature hashing", "a": "Mapping categories into a fixed number of columns with a hash function; collisions are possible.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 3}, {"id": "sc-d2f063e87925", "q": "High cardinality", "a": "A categorical feature with very many distinct values, such as a user ID.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 3}, {"id": "sc-8399c6fde667", "q": "Binning", "a": "Grouping continuous values into discrete intervals, such as age bands.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 2}, {"id": "sc-2c6ced0d1412", "q": "Log transform", "a": "Applying a logarithm to reduce right skew and compress large values.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 3}, {"id": "sc-dde9f3c1895c", "q": "Box-Cox transformation", "a": "A family of power transformations that make positive data more normal.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 3}, {"id": "sc-7c2b95080fe4", "q": "Interaction feature", "a": "A feature combining two others, such as their product, to capture a joint effect.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 3}, {"id": "sc-f476474e9e4b", "q": "Min-max scaling", "a": "Rescales a feature to a fixed range, usually 0 to 1.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 2}, {"id": "sc-b7c9a48b2d28", "q": "Standardization", "a": "Rescales a feature to mean 0 and standard deviation 1.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 2}, {"id": "sc-646b2389a5db", "q": "Robust scaling", "a": "Rescales using the median and IQR, which limits the effect of outliers.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 3}, {"id": "sc-43c4a01a59b0", "q": "When scaling matters", "a": "Distance-based and gradient-based models such as KNN, SVM, PCA and neural networks need it; tree models generally do not.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 3}, {"id": "sc-df9f9b4bd699", "q": "Imputation", "a": "Filling in missing values using a statistic or a model.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 2}, {"id": "sc-b33c5d8791d0", "q": "MCAR, MAR and MNAR", "a": "Missing completely at random, missing at random (explained by other variables) and missing not at random (related to the missing value itself).", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 3}, {"id": "sc-3ff568444082", "q": "KNN imputation", "a": "Filling a missing value using the values of the most similar rows.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 3}, {"id": "sc-c2c76af7e6f4", "q": "Winsorization", "a": "Capping extreme values at chosen percentiles rather than removing them.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 3}, {"id": "sc-8cf9ddf2edba", "q": "Class imbalance", "a": "When one class has many more examples than the others, such as fraud detection data.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 2}, {"id": "sc-d3e73fcbe36b", "q": "Random oversampling", "a": "Duplicating examples from the minority class to balance the data.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 2}, {"id": "sc-59c6e4f52df2", "q": "Random undersampling", "a": "Removing examples from the majority class to balance the data.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 2}, {"id": "sc-54a494a1ee90", "q": "SMOTE", "a": "Creates synthetic minority examples by interpolating between neighboring minority points.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 3}, {"id": "sc-264eb56001f4", "q": "Class weights", "a": "Increasing the loss penalty for minority classes during training, without changing the data.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 3}, {"id": "sc-ccef8e783fff", "q": "Sklearn Pipeline", "a": "Chains preprocessing and modeling steps so that they are fitted only on training folds, which prevents leakage.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 3}, {"id": "sc-7728370d1106", "q": "Feature importance", "a": "A score for how much each feature contributes to a model's predictions.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 3}, {"id": "sc-bf460b8b1181", "q": "Permutation importance", "a": "Measures how much performance drops when a feature's values are randomly shuffled.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 3}, {"id": "sc-8021ffc77a92", "q": "Partial dependence plot (PDP)", "a": "Shows how predictions change on average as one feature varies.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 3}, {"id": "sc-f6d040b7cb28", "q": "SHAP", "a": "SHapley Additive exPlanations: attributes a prediction to features using Shapley values from game theory.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 4}, {"id": "sc-cbd777d76165", "q": "LIME", "a": "Explains an individual prediction by fitting a simple model to the behavior around that input.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 3}, {"id": "sc-fef490651155", "q": "Model interpretability", "a": "How easily a person can understand why a model makes its predictions.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 3}, {"id": "sc-2a9af8c5346c", "q": "Global vs local explanation", "a": "Global explanations describe overall model behavior; local explanations describe one prediction.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 3}, {"id": "sc-f74ccc1fbcfd", "q": "Occam's razor (in ML)", "a": "Among models that perform about equally well, prefer the simpler one.", "x": "", "src": "Level 5 · Measuring Models & Preparing Features", "c": 3}, {"id": "sc-c9a2207889a0", "q": "Neural network", "a": "A model made of layers of connected units that transform inputs into outputs through learned weights.", "x": "", "src": "Level 6 · Neural Networks & Deep Learning", "c": 2}, {"id": "sc-922c2a88d56c", "q": "Artificial neuron", "a": "A unit that computes a weighted sum of its inputs plus a bias, then applies an activation function.", "x": "", "src": "Level 6 · Neural Networks & Deep Learning", "c": 2}, {"id": "sc-8a66dda5052a", "q": "Perceptron", "a": "Frank Rosenblatt's early single-layer linear classifier, introduced in 1958.", "x": "", "src": "Level 6 · Neural Networks & Deep Learning", "c": 2}, {"id": "sc-a420fb830bf7", "q": "XOR problem", "a": "A single perceptron cannot learn XOR because the classes are not linearly separable. It takes a hidden layer.", "x": "", "src": "Level 6 · Neural Networks & Deep Learning", "c": 3}, {"id": "sc-3ffc3c1e3b1c", "q": "Multilayer perceptron (MLP)", "a": "A feed-forward network with one or more hidden layers of fully connected neurons.", "x": "", "src": "Level 6 · Neural Networks & Deep Learning", "c": 3}, {"id": "sc-266062a79aaf", "q": "Input layer", "a": "The first layer of a network, which receives the features.", "x": "", "src": "Level 6 · Neural Networks & Deep Learning", "c": 2}, {"id": "sc-e4c63643b552", "q": "Hidden layer", "a": "Any layer between input and output, where intermediate representations are learned.", "x": "", "src": "Level 6 · Neural Networks & Deep Learning", "c": 2}, {"id": "sc-664c9c1a1e9e", "q": "Output layer", "a": "The final layer, which produces the prediction.", "x": "", "src": "Level 6 · Neural Networks & Deep Learning", "c": 2}, {"id": "sc-afe0444198ad", "q": "Weight", "a": "A learned value that scales how strongly one neuron's output influences the next.", "x": "", "src": "Level 6 · Neural Networks & Deep Learning", "c": 2}, {"id": "sc-34f02ab33b92", "q": "Bias term", "a": "A learned constant added to a neuron's weighted sum, which shifts its activation.", "x": "", "src": "Level 6 · Neural Networks & Deep Learning", "c": 2}, {"id": "sc-0393908bb729", "q": "Fully connected layer", "a": "A layer in which every neuron connects to every neuron in the previous layer (also called a dense layer).", "x": "", "src": "Level 6 · Neural Networks & Deep Learning", "c": 2}, {"id": "sc-5f906f7d2276", "q": "Universal approximation theorem", "a": "A network with enough hidden units and a suitable activation can approximate any continuous function on a bounded domain.", "x": "", "src": "Level 6 · Neural Networks & Deep Learning", "c": 4}, {"id": "sc-00c62513c2ac", "q": "Activation function", "a": "A non-linear function applied to a neuron's output. Without it, stacked layers collapse into one linear transformation.", "x": "", "src": "Level 6 · Neural Networks & Deep Learning", "c": 2}, {"id": "sc-223364cb0e34", "q": "ReLU", "a": "Rectified linear unit: f(x) = max(0, x). Simple, fast and the long-time default for hidden layers.", "x": "", "src": "Level 6 · Neural Networks & Deep Learning", "c": 2}, {"id": "sc-ef6a63f849ca", "q": "Dying ReLU problem", "a": "Neurons stuck in the zero region output zero, get zero gradient and stop learning.", "x": "", "src": "Level 6 · Neural Networks & Deep Learning", "c": 3}, {"id": "sc-fed0b9d8ccff", "q": "Leaky ReLU", "a": "A ReLU variant with a small slope for negative inputs, which keeps gradients from vanishing to zero.", "x": "", "src": "Level 6 · Neural Networks & Deep Learning", "c": 3}, {"id": "sc-437fd76f35d0", "q": "GELU", "a": "Gaussian Error Linear Unit: a smooth ReLU-like activation widely used in transformers.", "x": "", "src": "Level 6 · Neural Networks & Deep Learning", "c": 3}, {"id": "sc-e37dc0a85458", "q": "Tanh", "a": "An activation that maps inputs to (−1, 1), with zero-centered outputs.", "x": "", "src": "Level 6 · Neural Networks & Deep Learning", "c": 3}, {"id": "sc-2e5560100dfa", "q": "Softmax", "a": "Converts a vector of scores into probabilities that sum to 1.", "x": "", "src": "Level 6 · Neural Networks & Deep Learning", "c": 3}, {"id": "sc-c7d6c722c714", "q": "Logits", "a": "The raw, unnormalized scores a model outputs before softmax or sigmoid.", "x": "", "src": "Level 6 · Neural Networks & Deep Learning", "c": 3}, {"id": "sc-9755546a5e9f", "q": "Forward pass", "a": "Computing a network's output from its input, layer by layer.", "x": "", "src": "Level 6 · Neural Networks & Deep Learning", "c": 2}, {"id": "sc-5c8feab1e5ec", "q": "Backpropagation", "a": "Using the chain rule to compute the gradient of the loss with respect to every weight, working from output back to input.", "x": "", "src": "Level 6 · Neural Networks & Deep Learning", "c": 3}, {"id": "sc-b3a447b134d9", "q": "Chain rule", "a": "The calculus rule for differentiating composed functions, which is the mathematical basis of backpropagation.", "x": "", "src": "Level 6 · Neural Networks & Deep Learning", "c": 3}, {"id": "sc-7502dbb07223", "q": "Gradient", "a": "The vector of partial derivatives pointing in the direction of steepest increase of a function.", "x": "", "src": "Level 6 · Neural Networks & Deep Learning", "c": 3}, {"id": "sc-ba1a7e88854a", "q": "Computational graph", "a": "A graph of the operations in a model, used by frameworks to compute gradients.", "x": "", "src": "Level 6 · Neural Networks & Deep Learning", "c": 4}, {"id": "sc-e24a92fb1d2d", "q": "Automatic differentiation", "a": "Computing exact derivatives by applying the chain rule through a program's operations.", "x": "", "src": "Level 6 · Neural Networks & Deep Learning", "c": 4}, {"id": "sc-397e103b2040", "q": "Tensor", "a": "A multi-dimensional array and the core data structure of deep learning frameworks.", "x": "", "src": "Level 6 · Neural Networks & Deep Learning", "c": 2}, {"id": "sc-dfecc9eaf34d", "q": "PyTorch", "a": "A deep learning framework from Meta known for its dynamic graphs and Pythonic style, now dominant in research.", "x": "", "src": "Level 6 · Neural Networks & Deep Learning", "c": 2}, {"id": "sc-3d3f421e9db6", "q": "TensorFlow", "a": "Google's deep learning framework, with strong deployment tools.", "x": "", "src": "Level 6 · Neural Networks & Deep Learning", "c": 2}, {"id": "sc-c76e548e3306", "q": "Keras", "a": "A high-level neural network API, which is now multi-backend.", "x": "", "src": "Level 6 · Neural Networks & Deep Learning", "c": 2}, {"id": "sc-5bb0af57f42d", "q": "JAX", "a": "Google's library for high-performance numerical computing, with composable autodiff, JIT compilation and vectorization.", "x": "", "src": "Level 6 · Neural Networks & Deep Learning", "c": 4}, {"id": "sc-7786424beaf6", "q": "GPU", "a": "Graphics processing unit: a chip with many parallel cores, well suited to the matrix math of deep learning.", "x": "", "src": "Level 6 · Neural Networks & Deep Learning", "c": 2}, {"id": "sc-42ed9f8f58c6", "q": "TPU", "a": "Tensor Processing Unit: Google's custom chip built to accelerate neural network workloads.", "x": "", "src": "Level 6 · Neural Networks & Deep Learning", "c": 3}, {"id": "sc-50241ea523e9", "q": "CUDA", "a": "NVIDIA's platform for programming its GPUs, a major part of its advantage in AI.", "x": "", "src": "Level 6 · Neural Networks & Deep Learning", "c": 3}, {"id": "sc-bc7dd72aa75d", "q": "Batch size", "a": "The number of examples processed in each training step.", "x": "", "src": "Level 6 · Neural Networks & Deep Learning", "c": 2}, {"id": "sc-6a76880257a9", "q": "Iteration", "a": "One parameter update, usually from one batch.", "x": "", "src": "Level 6 · Neural Networks & Deep Learning", "c": 2}, {"id": "sc-503c4af7903c", "q": "Momentum", "a": "Speeds up gradient descent by accumulating an exponentially decaying average of past gradients.", "x": "", "src": "Level 6 · Neural Networks & Deep Learning", "c": 3}, {"id": "sc-7150abaf1c9b", "q": "Nesterov momentum", "a": "A variant of momentum that computes the gradient at the point momentum is about to reach.", "x": "", "src": "Level 6 · Neural Networks & Deep Learning", "c": 4}, {"id": "sc-6bd8f168ae0d", "q": "Adagrad", "a": "An optimizer that adapts per-parameter learning rates using accumulated squared gradients.", "x": "", "src": "Level 6 · Neural Networks & Deep Learning", "c": 3}, {"id": "sc-3447d4c81ae0", "q": "RMSProp", "a": "An optimizer that adapts learning rates using a moving average of squared gradients.", "x": "", "src": "Level 6 · Neural Networks & Deep Learning", "c": 3}, {"id": "sc-0e18f44c1fec", "q": "Adam", "a": "An optimizer combining momentum with per-parameter adaptive learning rates, a popular default.", "x": "", "src": "Level 6 · Neural Networks & Deep Learning", "c": 3}, {"id": "sc-7cd9ef56b01b", "q": "AdamW", "a": "Adam with decoupled weight decay, the standard choice for training transformers.", "x": "", "src": "Level 6 · Neural Networks & Deep Learning", "c": 4}, {"id": "sc-fbe10fa6330b", "q": "Learning rate schedule", "a": "A plan for changing the learning rate during training.", "x": "", "src": "Level 6 · Neural Networks & Deep Learning", "c": 3}, {"id": "sc-ce211c713751", "q": "Learning rate warmup", "a": "Starting with a small learning rate and increasing it gradually at the start of training.", "x": "", "src": "Level 6 · Neural Networks & Deep Learning", "c": 3}, {"id": "sc-4599dc6fd4f0", "q": "Cosine annealing", "a": "Decreasing the learning rate along a cosine curve.", "x": "", "src": "Level 6 · Neural Networks & Deep Learning", "c": 3}, {"id": "sc-6f9585bc51bf", "q": "Vanishing gradients", "a": "Gradients shrink as they pass back through many layers, so early layers barely learn.", "x": "", "src": "Level 6 · Neural Networks & Deep Learning", "c": 3}, {"id": "sc-7ffb6f5b1563", "q": "Exploding gradients", "a": "Gradients grow uncontrollably as they pass back through layers, which destabilizes training.", "x": "", "src": "Level 6 · Neural Networks & Deep Learning", "c": 3}, {"id": "sc-fad4bb70460b", "q": "Gradient clipping", "a": "Limiting the size of gradients to prevent exploding gradients.", "x": "", "src": "Level 6 · Neural Networks & Deep Learning", "c": 3}, {"id": "sc-34ce5a4a5b90", "q": "Weight initialization", "a": "Setting a network's starting weights; poor choices can stop gradients from flowing.", "x": "", "src": "Level 6 · Neural Networks & Deep Learning", "c": 3}, {"id": "sc-ad641b47ad16", "q": "Xavier (Glorot) initialization", "a": "Scales initial weights to keep variance stable across layers, suited to tanh and sigmoid.", "x": "", "src": "Level 6 · Neural Networks & Deep Learning", "c": 4}, {"id": "sc-2d083a9b0f11", "q": "He initialization", "a": "A weight initialization scaled for ReLU activations.", "x": "", "src": "Level 6 · Neural Networks & Deep Learning", "c": 4}, {"id": "sc-d21e9f7f5973", "q": "Batch normalization", "a": "Normalizes layer inputs using batch statistics, which speeds up and stabilizes training.", "x": "", "src": "Level 6 · Neural Networks & Deep Learning", "c": 3}, {"id": "sc-d81c7ecacd46", "q": "Layer normalization", "a": "Normalizes across the features of each example, independent of batch size. It is standard in transformers.", "x": "", "src": "Level 6 · Neural Networks & Deep Learning", "c": 3}, {"id": "sc-faca6eb13adc", "q": "Dropout", "a": "Randomly disables neurons during training, reducing co-adaptation and overfitting.", "x": "", "src": "Level 6 · Neural Networks & Deep Learning", "c": 3}, {"id": "sc-aa7f622c134d", "q": "Weight decay", "a": "A penalty that shrinks weights toward zero during training.", "x": "", "src": "Level 6 · Neural Networks & Deep Learning", "c": 3}, {"id": "sc-f7dff421e096", "q": "Label smoothing", "a": "Replacing hard targets with slightly : 2}, {"id": "sc-96ef9e2d237f", "q": "ONNX", "a": "An open format for exchanging models between frameworks and runtimes.", "x": "", "src": "Level 8 · Production ML, Big Data & Deployment", "c": 3}, {"id": "sc-41a1373cef2a", "q": "FastAPI", "a": "A Python web framework commonly used to wrap models in APIs.", "x": "", "src": "Level 8 · Production ML, Big Data & Deployment", "c": 2}, {"id": "sc-c3b9a01442e0", "q": "Latency", "a": "The time taken to return a response, often reported as percentiles such as p95.", "x": "", "src": "Level 8 · Production ML, Big Data & Deployment", "c": 2}, {"id": "sc-31eee010484c", "q": "Throughput", "a": "The number of requests or predictions a system handles per unit of time.", "x": "", "src": "Level 8 · Production ML, Big Data & Deployment", "c": 2}, {"id": "sc-c184fa93f2b4", "q": "Autoscaling", "a": "Automatically adding or removing resources as demand changes.", "x": "", "src": "Level 8 · Production ML, Big Data & Deployment", "c": 3}, {"id": "sc-07fab71bcca9", "q": "Shadow deployment", "a": "Running a new model on live traffic without showing its output to users, to compare it safely.", "x": "", "src": "Level 8 · Production ML, Big Data & Deployment", "c": 3}, {"id": "sc-4b76b8ee3701", "q": "Canary deployment", "a": "Releasing a new model to a small share of users before a wider rollout.", "x": "", "src": "Level 8 · Production ML, Big Data & Deployment", "c": 3}, {"id": "sc-00e19cc0ce36", "q": "Blue-green deployment", "a": "Running old and new versions side by side, then switching traffic so rollback is fast.", "x": "", "src": "Level 8 · Production ML, Big Data & Deployment", "c": 3}, {"id": "sc-ff3a6f3b41f1", "q": "Rollback", "a": "Quickly reverting to a previous model version when a new release misbehaves.", "x": "", "src": "Level 8 · Production ML, Big Data & Deployment", "c": 2}, {"id": "sc-e4f2293f2bae", "q": "Model monitoring", "a": "Tracking a live model's inputs, outputs and performance to catch problems.", "x": "", "src": "Level 8 · Production ML, Big Data & Deployment", "c": 3}, {"id": "sc-73558bee0c11", "q": "Data drift", "a": "A change in the distribution of input data over time.", "x": "", "src": "Level 8 · Production ML, Big Data & Deployment", "c": 3}, {"id": "sc-ae0f6de704d8", "q": "Concept drift", "a": "A change in the relationship between inputs and the target over time.", "x": "", "src": "Level 8 · Production ML, Big Data & Deployment", "c": 3}, {"id": "sc-4ea0415ab7e9", "q": "Label shift", "a": "A change in how common each class is, while the class-conditional inputs stay the same.", "x": "", "src": "Level 8 · Production ML, Big Data & Deployment", "c": 4}, {"id": "sc-a16ca8ee31bb", "q": "Population Stability Index (PSI)", "a": "A metric that quantifies how far a distribution has shifted from a baseline.", "x": "", "src": "Level 8 · Production ML, Big Data & Deployment", "c": 4}, {"id": "sc-4ab194d4fb13", "q": "Kolmogorov-Smirnov test", "a": "A statistical test that compares two distributions and is often used to detect drift.", "x": "", "src": "Level 8 · Production ML, Big Data & Deployment", "c": 4}, {"id": "sc-0db0f875e5cf", "q": "Feedback loop", "a": "A model's predictions influence its future training data, which can reinforce errors or bias.", "x": "", "src": "Level 8 · Production ML, Big Data & Deployment", "c": 3}, {"id": "sc-f592ddf1bfb8", "q": "Model decay", "a": "The gradual decline of a model's performance after deployment.", "x": "", "src": "Level 8 · Production ML, Big Data & Deployment", "c": 3}, {"id": "sc-a3dde2dc8b31", "q": "Model card", "a": "A short document describing a model's intended use, performance and limitations.", "x": "", "src": "Level 8 · Production ML, Big Data & Deployment", "c": 3}, {"id": "sc-79235f40c141", "q": "Technical debt in ML", "a": "Hidden long-term maintenance costs of ML systems, such as tangled data dependencies.", "x": "", "src": "Level 8 · Production ML, Big Data & Deployment", "c": 3}, {"id": "sc-2e1985775b73", "q": "Quantization", "a": "Reducing the numerical precision of weights, such as from 32-bit to 8-bit, to save memory and speed up inference.", "x": "", "src": "Level 8 · Production ML, Big Data & Deployment", "c": 3}, {"id": "sc-5df615ff9a09", "q": "Model pruning", "a": "Removing unimportant weights or neurons to shrink a network.", "x": "", "src": "Level 8 · Production ML, Big Data & Deployment", "c": 3}, {"id": "sc-d76b001055a6", "q": "Algorithmic fairness", "a": "Evaluating and reducing unjust differences in a system's outcomes across groups.", "x": "", "src": "Level 8 · Production ML, Big Data & Deployment", "c": 3}, {"id": "sc-ecdd04f76307", "q": "Demographic parity", "a": "A fairness criterion requiring similar positive prediction rates across groups.", "x": "", "src": "Level 8 · Production ML, Big Data & Deployment", "c": 3}, {"id": "sc-eeaa0dc1c9b8", "q": "Equalized odds", "a": "A fairness criterion requiring similar true positive and false positive rates across groups.", "x": "", "src": "Level 8 · Production ML, Big Data & Deployment", "c": 4}, {"id": "sc-3000750326de", "q": "Proxy variable", "a": "A feature that stands in for a sensitive attribute, such as ZIP code for race.", "x": "", "src": "Level 8 · Production ML, Big Data & Deployment", "c": 3}, {"id": "sc-d5ef27a6ef99", "q": "Personally identifiable information (PII)", "a": "Data that can identify a specific person, such as a name or Social Security number.", "x": "", "src": "Level 8 · Production ML, Big Data & Deployment", "c": 2}, {"id": "sc-f111c5d041ab", "q": "Anonymization vs pseudonymization", "a": "Anonymization irreversibly removes identity; pseudonymization replaces identifiers with codes that can be linked back.", "x": "", "src": "Level 8 · Production ML, Big Data & Deployment", "c": 3}, {"id": "sc-b6e184f19d9c", "q": "GDPR", "a": "The EU's data protection regulation, which covers consent, access and erasure rights.", "x": "", "src": "Level 8 · Production ML, Big Data & Deployment", "c": 2}, {"id": "sc-2d or training data or for decisions.", "x": "", "src": "Level 8 · Production ML, Big Data & Deployment", "c": 2}, {"id": "sc-8a14b9981768", "q": "Data labeling", "a": "Annotating raw data with target labels, often through tools or crowdworkers.", "x": "", "src": "Level 8 · Production ML, Big Data & Deployment", "c": 2}, {"id": "sc-b392a2fcf4a2", "q": "Weak supervision", "a": "Using noisy programmatic rules or other imperfect sources to label data at scale.", "x": "", "src": "Level 8 · Production ML, Big Data & Deployment", "c": 4}, {"id": "sc-f0b7a87be466", "q": "Rule of thumb on ML effort", "a": "Most project time typically goes to data and infrastructure, with only a small part spent on model code.", "x": "", "src": "Level 8 · Production ML, Big Data & Deployment", "c": 3}, {"id": "sc-9236e026cc17", "q": "Transformer", "a": "A neural architecture built on self-attention that processes sequences in parallel, introduced in 2017.", "x": "", "src": "Level 9 · Transformers & Large Language Models", "c": 3}, {"id": "sc-0ea83918854b", "q": "\"Attention Is All You Need\"", "a": "The 2017 Google paper that introduced the transformer.", "x": "", "src": "Level 9 · Transformers & Large Language Models", "c": 3}, {"id": "sc-57fb5695f3dd", "q": "Self-attention", "a": "Each token computes weighted connections to the other tokens in the same sequence.", "x": "", "src": "Level 9 · Transformers & Large Language Models", "c": 4}, {"id": "sc-180be30906b2", "q": "Query, key and value", "a": "Attention compares a query with keys to get weights, then uses those weights to average the values.", "x": "", "src": "Level 9 · Transformers & Large Language Models", "c": 4}, {"id": "sc-8c446f0aaa66", "q": "Scaled dot-product attention", "a": "Attention(Q, K, V) = softmax(QKᵀ / √d) V. Scaling by √d keeps gradients stable.", "x": "", "src": "Level 9 · Transformers & Large Language Models", "c": 4}, {"id": "sc-3c9af3fc58d3", "q": "Multi-head attention", "a": "Runs several attention operations in parallel so that a model can focus on different relationships.", "x": "", "src": "Level 9 · Transformers & Large Language Models", "c": 4}, {"id": "sc-c3bb89b74c0f", "q": "Cross-attention", "a": "Attention in which queries come from one sequence and keys and values come from another.", "x": "", "src": "Level 9 · Transformers & Large Language Models", "c": 4}, {"id": "sc-dc47dd10210b", "q": "Causal mask", "a": "Stops a position from attending to future tokens during generation.", "x": "", "src": "Level 9 · Transformers & Large Language Models", "c": 4}, {"id": "sc-53694ec0db71", "q": "Positional encoding", "a": "Adds position information to tokens, because attention alone ignores order.", "x": "", "src": "Level 9 · Transformers & Large Language Models", "c": 4}, {"id": "sc-283b808a6194", "q": "Rotary position embedding (RoPE)", "a": "Encodes position by rotating query and key vectors, and is common in modern LLMs.", "x": "", "src": "Level 9 · Transformers & Large Language Models", "c": 5}, {"id": "sc-7fe882fb8526", "q": "Transformer block", "a": "Self-attention and a feed-forward layer, each with normalization and a residual connection.", "x": "", "src": "Level 9 · Transformers & Large Language Models", "c": 4}, {"id": "sc-ce9bae4b9d37", "q": "Feed-forward layer (transformer)", "a": "A small MLP applied independently at each token position.", "x": "", "src": "Level 9 · Transformers & Large Language Models", "c": 4}, {"id": "sc-29afd1832f22", "q": "Foundation model", "a": "A large general-purpose model that can be adapted to many tasks.", "x": "", "src": "Level 9 · Transformers & Large Language Models", "c": 3}, {"id": "sc-65425cc573a1", "q": "Generative AI", "a": "AI that creates new content such as text, images, audio, video or code.", "x": "", "src": "Level 9 · Transformers & Large Language Models", "c": 2}, {"id": "sc-0158b2ae8ba9", "q": "Large language model (LLM)", "a": "A large neural network trained on text to predict tokens, which lets it generate and understand language.", "x": "", "src": "Level 9 · Transformers & Large Language Models", "c": 3}, {"id": "sc-4da5b01439e5", "q": "Token (LLM)", "a": "The unit an LLM reads and writes, often a word piece; in English, roughly three-quarters of a word on average.", "x": "", "src": "Level 9 · Transformers & Large Language Models", "c": 3}, {"id": "sc-057e26e02998", "q": "Byte-pair encoding (BPE)", "a": "A subword tokenizer that repeatedly merges the most frequent adjacent symbol pairs.", "x": "", "src": "Level 9 · Transformers & Large Language Models", "c": 4}, {"id": "sc-21861253d6fc", "q": "Vocabulary", "a": "The fixed set of tokens that a tokenizer and model can represent.", "x": "", "src": "Level 9 · Transformers & Large Language Models", "c": 3}, {"id": "sc-fcd8bd1f21b3", "q": "Context window", "a": "The maximum number of tokens a model can consider at once, including input and output.", "x": "", "src": "Level 9 · Transformers & Large Language Models", "c": 3}, {"id": "sc-06808acd4c27", "q": "Embedding layer", "a": "Converts token IDs into dense vectors that the network can process.", "x": "", "src": "Level 9 · Transformers & Large Language Models", "c": 4}, {"id": "sc-7b964cd933b2", "q": "BERT", "a": "A 2018 Google transformer encoder trained to predict masked words, using context from both directions.", "x": "", "src": "Level 9 · Transformers & Large Language Models", "c": 3}, {"id": "sc-66bb77ea8ffa", "q": "Encoder-only vs decoder-only transformers", "a": "BERT-style encoders read a whole input at once; GPT-style decoders use a causal mask so they can generate text.", "x": "", "src": "Level 9 · Transformers & Large Language Models", "c": 4}, {"id": "sc-b84ab73df222", "q": "GPT", "a": "Generative Pre-trained Transformer: OpenAI's family of decoder-only language models.", "x": "", "src": "Level 9 · Transformers & Large Language Models", "c": 3}, {"id": "sc-d7c3d7361e20", "q": "GPT-3", "a": "OpenAI's 2020 language model with 175 billion parameters, which showed how much capability scale alone could add.", "x": "", "src": "Level 9 · Transformers & Large Language Models", "c": 3}, {"id": "sc-ab0ddc029a7e", "q": "ChatGPT", "a": "OpenAI's conversational assistant, launched in November 2022, which brought generative AI to the mainstream.", "x": "", "src": "Level 9 · Transformers & Large Language Models", "c": 2}, {"id": "sc-b93a873362cd", "q": "GPT-4", "a": "OpenAI's March 2023 multimodal model, which accepted images as well as text.", "x": "", "src": "Level 9 · Transformers & Large Language Models", "c": 3}, {"id": "sc-f1dda22f6c87", "q": "Claude", "a": "Anthropic's family of AI assistants, trained with an emphasis on safety and helpfulness.", "x": "", "src": "Level 9 · Transformers & Large Language Models", "c": 2}, {"id": "sc-fb1fdba7decc", "q": "Multimodal LLM", "a": "An LLM that accepts inputs beyond text, such as images or audio.", "x": "", "src": "Level 9 · Transformers & Large Language Models", "c": 3}, {"id": "sc-468da084e995", "q": "Gemini", "a": "Google DeepMind's family of multimodal models.", "x": "", "src": "Level 9 · Transformers & Large Language Models", "c": 2}, {"id": "sc-ad4ba4cc53b9", "q": "Llama", "a": "Meta's family of open-weight language models.", "x": "", "src": "Level 9 · Transformers & Large Language Models", "c": 2}, {"id": "sc-1b03c368bfb5", "q": "Mistral", "a": "A French AI company known for efficient open-weight and commercial language models.", "x": "", "src": "Level 9 · Transformers & Large Language Models", "c": 2}, {"id": "sc-b4e9ebbe73fc", "q": "Open weights vs open source", "a": "Open-weight models publish their weights; truly open-source models also offer training data and code under open terms.", "x": "", "src": "Level 9 · Transformers & Large Language Models", "c": 3}, {"id": "sc-ed4feadeca10", "q": "Autoregressive generation", "a": "Producing output one token at a time, with each new token fed back as input.", "x": "", "src": "Level 9 · Transformers & Large Language Models", "c": 4}, {"id": "sc-7033e90fcdda", "q": "Temperature", "a": "Scales the output probabilities. Low values make output focused; high values make it more varied.", "x": "", "src": "Level 9 · Transformers & Large Language Models", "c": 3}, {"id": "sc-b465bf7643d3", "q": "Top-k sampling", "a": "Samples the next token from the k most likely candidates.", "x": "", "src": "Level 9 · Transformers & Large Language Models", "c": 3}, {"id": "sc-6b6561ef9f95", "q": "Top-p (nucleus) sampling", "a": "Samples from the smallest token set whose cumulative probability reaches p.", "x": "", "src": "Level 9 · Transformers & Large Language Models", "c": 3}, {"id": "sc-2519c7581a7e", "q": "Hallucination", "a": "When a model generates fluent but false or unsupported content.", "x": "", "src": "Level 9 · Transformers & Large Language Models", "c": 2}, {"id": "sc-c726bf9d7426", "q": "Knowledge cutoff", "a": "The date after which a model has little or no training data.", "x": "", "src": "Level 9 · Transformers & Large Language Models", "c": 3}, {"id": "sc-3755810f66db", "q": "Stop sequence", "a": "A specified string that ends generation when it is produced.", "x": "", "src": "Level 9 · Transformers & Large Language Models", "c": 3}, {"id": "sc-9c7e05e5868a", "q": "Prompt", "a": "The input given to a generative model.", "x": "", "src": "Level 9 · Transformers & Large Language Models", "c": 2}, {"id": "sc-8a0db137e6e8", "q": "System prompt", "a": "Instructions that set an assistant's role, rules and behavior for a conversation.", "x": "", "src": "Level 9 · Transformers & Large Language Models", "c": 3}, {"id": "sc-a209a9c40068", "q": "Prompt engineering", "a": "The practice of designing prompts to get better results from a model.", "x": "", "src": "Level 9 · Transformers & Large Language Models", "c": 3}, {"id": "sc-645da856bc3a", "q": "Zero-shot prompting", "a": "Asking a model to perform a task with no examples.", "x": "", "src": "Level 9 · Transformers & Large Language Models", "c": 3}, {"id": "sc-cb35884998e5", "q": "Few-shot prompting", "a": "Including a few worked examples in the prompt.", "x": "", "src": "Level 9 · Transformers & Large Language Models", "c": 3}, {"id": "sc-7145c5f408d7", "q": "Chain-of-thought prompting", "a": "Encouraging a model to reason step by step before answering.", "x": "", "src": "Level 9 · Transformers & Large Language Models", "c": 3}, {"id": "sc-1864ad47db59", "q": "Structured output", "a": "Constraining a model to return a specified format, such as valid JSON.", "x": "", "src": "Level 9 · Transformers & Large Language Models", "c": 3}, {"id": "sc-246b2e503081", "q": "Function calling (tool use)", "a": "A model outputs a structured request to call an external tool, then uses the result in its response.", "x": "", "src": "Level 9 · Transformers & Large Language Models", "c": 3}, {"id": "sc-04f0d90af66b", "q": "Base model vs chat model", "a": "A base model simply continues text; a chat model has also been trained to follow instructions in dialogue.", "x": "", "src": "Level 9 · Transformers & Large Language Models", "c": 3}, {"id": "sc-18f0918704f2", "q": "Pretraining", "a": "The initial stage in which an LLM learns from a huge corpus by predicting the next token.", "x": "", "src": "Level 9 · Transformers & Large Language Models", "c": 3}, {"id": "sc-3b146b11f9cf", "q": "Instruction tuning", "a": "Fine-tuning a model on instruction-response pairs so that it follows requests.", "x": "", "src": "Level 9 · Transformers & Large Language Models", "c": 3}, {"id": "sc-e3bf51473b53", "q": "RLHF", "a": "Reinforcement learning from human feedback: tuning a model using human preferences between its responses.", "x": "", "src": "Level 9 · Transformers & Large Language Models", "c": 4}, {"id": "sc-a48c2c2c248e", "q": "Reward model", "a": "A model trained on human preferences to score responses during RLHF.", "x": "", "src": "Level 9 · Transformers & Large Language Models", "c": 4}, {"id": "sc-39656294b9d8", "q": "Constitutional AI", "a": "Anthropic's method of es it easy to download and run LLMs locally.", "x": "", "src": "Level 9 · Transformers & Large Language Models", "c": 2}, {"id": "sc-87185e8f7f83", "q": "vLLM", "a": "A high-throughput LLM serving engine known for its PagedAttention memory management.", "x": "", "src": "Level 9 · Transformers & Large Language Models", "c": 4}, {"id": "sc-f35a85b0a3db", "q": "Embedding (text)", "a": "A vector representing the meaning of a piece of text, used for search, clustering and retrieval.", "x": "", "src": "Level 9 · Transformers & Large Language Models", "c": 3}, {"id": "sc-465b5c61e6bc", "q": "Vector database", "a": "A database optimized to store embeddings and find the nearest ones to a query.", "x": "", "src": "Level 9 · Transformers & Large Language Models", "c": 3}, {"id": "sc-fd26eaa8ad85", "q": "Approximate nearest neighbor (ANN)", "a": "Finding very close vectors quickly by giving up guaranteed exact results.", "x": "", "src": "Level 9 · Transformers & Large Language Models", "c": 4}, {"id": "sc-4fb28cf0b4b0", "q": "HNSW", "a": "Hierarchical Navigable Small World: a graph-based index for fast approximate nearest neighbor search.", "x": "", "src": "Level 9 · Transformers & Large Language Models", "c": 4}, {"id": "sc-0902c1735b48", "q": "Semantic search", "a": "Searching by meaning using embeddings, rather than by exact keyword match.", "x": "", "src": "Level 9 · Transformers & Large Language Models", "c": 3}, {"id": "sc-d96d7fcf37da", "q": "BM25", "a": "A classic keyword ranking function that scores documents by term frequency, rarity and length.", "x": "", "src": "Level 9 · Transformers & Large Language Models", "c": 3}, {"id": "sc-05a4772ae0ec", "q": "Hybrid search", "a": "Combining keyword and vector search to get the benefits of both.", "x": "", "src": "Level 9 · Transformers & Large Language Models", "c": 3}, {"id": "sc-3e492a4c8f68", "q": "Retrieval-augmented generation (RAG)", "a": "Retrieving relevant documents and adding them to the prompt, so that a model can sformers & Large Language Models", "c": 3}, {"id": "sc-1c3de8a93287", "q": "Prompt injection", "a": "An attack in which malicious text causes a model to follow an attacker's instructions rather than the developer's.", "x": "", "src": "Level 9 · Transformers & Large Language Models", "c": 3}, {"id": "sc-2a65bfdc85ec", "q": "Indirect prompt injection", "a": "Prompt injection hidden in content that a model reads, such as a web page or document.", "x": "", "src": "Level 9 · Transformers & Large Language Models", "c": 3}, {"id": "sc-781973e7f545", "q": "Jailbreak", "a": "A prompt crafted to get a model to bypass its safety training.", "x": "", "src": "Level 9 · Transformers & Large Language Models", "c": 3}, {"id": "sc-7712005501c4", "q": "Red teaming", "a": "Deliberately probing a system for harmful behavior and weaknesses before attackers or users find them.", "x": "", "src": "Level 9 · Transformers & Large Language Models", "c": 3}, {"id": "sc-285b28344fe2", "q": "Guardrails", "a": "Checks around a model's inputs and outputs that enforce safety and policy rules.", "x": "", "src": "Level 9 · Transformers & Large Language Models", "c": 3}, {"id": "sc-fda36e4be748", "q": "Diffusion model", "a": "A generative model that learns to reverse a gradual noising process, creating data from noise.", "x": "", "src": "Level 9 · Transformers & Large Language Models", "c": 4}, {"id": "sc-a1176c4ac322", "q": "Denoising diffusion (DDPM)", "a": "A diffusion approach in which a network learns to predict and remove noise step by step.", "x": "", "src": "Level 9 · Transformers & Large Language Models", "c": 4}, {"id": "sc-19d62781f7c8", "q": "Latent diffusion", "a": "Runs diffusion in a compressed latent space, which greatly reduces cost. It underlies Stable Diffusion.", "x": "", "src": "Level 9 · Transformers & Large Language Models", "c": 4}, {"id": "sc-aa38822a7318", "q": "Classifier-free guidance", "a": "Steers diffusion toward a prompt by combining conditional and unconditional predic , an oversight method that depends on the reasoning remaining legible.", "x": "", "src": "Level 10 · Frontier Topics (2023–2026)", "c": 5}, {"id": "sc-d7423e07b5ef", "q": "Self-consistency", "a": "Sampling multiple reasoning paths and taking the most common answer.", "x": "", "src": "Level 10 · Frontier Topics (2023–2026)", "c": 4}, {"id": "sc-0f3209db19a0", "q": "Tree of Thoughts", "a": "A prompting framework that explores and evaluates multiple reasoning branches.", "x": "", "src": "Level 10 · Frontier Topics (2023–2026)", "c": 5}, {"id": "sc-1b128d90ed87", "q": "Reward hacking", "a": "A model finds a way to get high reward while failing at what was actually intended.", "x": "", "src": "Level 10 · Frontier Topics (2023–2026)", "c": 4}, {"id": "sc-91f797043389", "q": "Verifiable reward", "a": "Using automatic checks, such as math answers or unit tests, as the reward for reinforcement learning.", "x": "", "src": "Level 10 · Frontier Topics (2023–2026)", "c": 5}, {"id": "sc-0c98a6cfda0d", "q": "AI agent", "a": "A system in which a model pursues a goal by planning, using tools and acting over multiple steps.", "x": "", "src": "Level 10 · Frontier Topics (2023–2026)", "c": 3}, {"id": "sc-20453b72936a", "q": "Agentic loop", "a": "The repeating cycle of a model choosing an action, a tool running, and the result being fed back.", "x": "", "src": "Level 10 · Frontier Topics (2023–2026)", "c": 4}, {"id": "sc-6415e8b0f8e2", "q": "ReAct pattern", "a": "An agent pattern that interleaves reasoning steps with actions and observations.", "x": "", "src": "Level 10 · Frontier Topics (2023–2026)", "c": 5}, {"id": "sc-f681b3cec666", "q": "Model Context Protocol (MCP)", "a": "An open standard from Anthropic, introduced in November 2024, for connecting AI applications to tools and data.", "x": "", "src": "Level 10 · Frontier Topics (2023–2026)", "c": 4}, {"id": "sc-d2acdb71a0dc", "q": "Agent2Agent (A2A) protocol", "a": "An open protocol introduced by Google in 2025 for communication be
