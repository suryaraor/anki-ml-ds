<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f766e"><title>ML &amp; Data Science Flashcards</title><style>
:root{--bg:#eef3f2;--ink:#14212b;--card:#fff;--acc:#0f766e;--mut:#64748b;--code:#f1f5f9;--fs:1}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center}
header{width:100%;max-width:820px;padding:16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.bar{width:100%;max-width:820px;padding:0 16px;color:var(--mut);font-size:14px;display:flex;justify-content:space-between}
.scene{perspective:1400px;width:calc(100% - 32px);max-width:788px;height:min(520px,calc(100vh - 230px));min-height:340px;margin:12px 16px;cursor:pointer;position:relative}
#more{position:absolute;bottom:12px;right:22px;z-index:5;display:flex;gap:5px;align-items:center;padding:6px 12px;border:1px solid #cbd5d4;border-radius:99px;background:#fffd;color:var(--acc);font-size:13px;text-decoration:none;cursor:pointer}#more:hover{background:#ccfbf1}

.card{position:relative;width:100%;height:100%;transition:transform .55s;transform-style:preserve-3d}.card.flip{transform:rotateY(180deg)}

.face>.in{margin:auto 0;width:100%}.front .in{text-align:center}.back{transform:rotateY(180deg)}
.lbl{font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:var(--acc);margin-bottom:12px;text-align:center}
.q{font-size:calc(24px*var(--fs));line-height:1.4}.front .q .code{text-align:left;font-size:calc(15px*var(--fs))}

.code,pre{font:calc(14px*var(--fs))/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;background:var(--code);border-radius:10px;padding:12px 14px;white-space:pre-wrap;overflow-x:auto;margin:0}
.code pre{padding:0;background:none}
.face img{display:block;max-width:100%;max-height:300px;border-radius:8px;margin:8px auto;cursor:zoom-in}
.x{margin-top:14px;padding-top:12px;border-top:1px dashed #cbd5d4;color:#334155;font-size:calc(15px*var(--fs));line-height:1.5}

.chips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}.chip{font-size:12px;background:#ccfbf1;color:var(--acc);padding:2px 9px;border-radius:99px}

.again{border-color:#dc2626!important;color:#dc2626}.good{border-color:#16a34a!important;color:#16a34a}
.hint{font-size:12px;color:var(--mut);margin-bottom:20px;text-align:center;padding:0 12px;max-width:820px}

#shuf{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:104px}#shuf.on{background:var(--acc);border-color:var(--acc);color:#fff}
#help{width:34px;height:34px;padding:0;border-radius:50%;font-weight:bold}
#zoom{position:fixed;inset:0;background:#0f172ae6;display:none;align-items:center;justify-content:center;z-index:40;cursor:zoom-out}#zoom.on{display:flex}#zoom img{max-width:95vw;max-height:92vh;background:#fff;border-radius:8px}
#upd{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:12px;padding:10px 12px 10px 16px;display:none;gap:12px;align-items:center;font-size:14px;box-shadow:0 8px 30px #0005;z-index:45}
#upd.on{display:flex}#upd button{background:var(--acc);border-color:var(--acc);color:#fff}
#tour{position:fixed;inset:0;z-index:50;display:none}#tour.on{display:block}
#spot{position:fixed;border-radius:14px;box-shadow:0 0 0 9999px #0f172acc;transition:all .3s;pointer-events:none}
#tip{position:fixed;width:min(360px,calc(100vw - 24px));background:#fff;border-radius:14px;padding:18px 18px 14px;box-shadow:0 12px 40px #0006;font-size:15px;line-height:1.5;transition:top .3s,left .3s}
#tip h3{margin:0 0 6px;font-size:18px;color:var(--acc)}#tip p{margin:0 0 12px}#tip kbd{background:#f3f4f6;border:1px solid #d1d5db;border-radius:4px;padding:0 5px;font-size:13px}
#tip .row{display:flex;align-items:center;gap:8px}#tip .dots{margin-right:auto;color:var(--mut);font-size:13px}
#tip button{font-size:14px;padding:6px 12px}#tip .pri{background:var(--acc);color:#fff;border-color:var(--acc)}#tip .skip{border:none;background:none;color:var(--mut)}
</style></head><body>

c-0a2b9827e548", "q": "Training", "a": "The process of fitting a model's parameters to data so that it learns a useful mapping.", "x": "", "src": "Level 1 · Foundations", "c": 1}, {"id": "sc-1e59ab574d42", "q": "Inference", "a": "Using a trained model to make predictions on new, unseen data.", "x": "", "src": "Level 1 · Foundations", "c": 1}, {"id": "sc-f8492df6421f", "q": "Prediction", "a": "The output a model produces for a given input, such as a class label or a number.", "x": "", "src": "Level 1 · Foundations", "c": 1}, {"id": "sc-4b7615dce52c", "q": "Feature", "a": "An individual measurable property or input variable used by a model (also called attribute, predictor or independent variable).", "x": "", "src": "Level 1 · Foundations", "c": 1}, {"id": "sc-64c65374dbab", "q": "Label", "a": "The known answer or target value attached to a training example in supervised learning.", "x": "", "src": "Level 1 · Foundations", "c": 1}, {"id": "sc-600f0f12d705", "q": "Target variable", "a": "The variable a model is trained to predict (also called the dependent variable, response or outcome).", "x": "", "src": "Level 1 · Foundations", "c": 1}, {"id": "sc-7c02c7e8a01b", "q": "Observation", "a": "A single row or record in a dataset, representing one entity or event (also called a sample, instance or example).", "x": "", "src": "Level 1 · Foundations", "c": 1}, {"id": "sc-b46d0172433d", "q": "Variable", "a": "A characteristic that can take different values across observations, such as age or price.", "x": "", "src": "Level 1 · Foundations", "c": 1}, {"id": "sc-5bd7d56b8d8e", "q": "Structured data", "a": "Data organized in a fixed schema such as tables with rows and columns (e.g., spreadsheets, relational databases).", "x": "", "src": "Level 1 · Foundations", "c": 1}, {"id": "sc-ae163e19997d", "q": "Unstructured data", "a": "Data without a predefined tabular schema, such as free text, images, audio and video.", "x": "", "src": "Level 1 · Foundations", "c": 1}, {"id": "sc-b6499d ual intervals and a true zero, so ratios are meaningful (e.g., weight, income).", "x": "", "src": "Level 1 · Foundations", "c": 2}, {"id": "sc-fc811de4c92f", "q": "Big data", "a": "Datasets too large, fast or varied for traditional tools, often described by the 3 Vs: volume, velocity and variety.", "x": "", "src": "Level 1 · Foundations", "c": 1}, {"id": "sc-d43f003813c1", "q": "The 5 Vs of big data", "a": "Volume, Velocity, Variety, Veracity (trustworthiness) and Value.", "x": "", "src": "Level 1 · Foundations", "c": 2}, {"id": "sc-6d613a1ee01e", "q": "Database", "a": "An organized collection of data stored electronically and managed by a database management system.", "x": "", "src": "Level 1 · Foundations", "c": 1}, {"id": "sc-469342764c05", "q": "Spreadsheet", "a": "A grid-based application (e.g., Excel, Google Sheets) for storing, calculating and analyzing tabular data.", "x": "", "src": "Level 1 · Foundations", "c": 1}, {"id": "sc-2341c60dcc92", "q": "Data analysis", "a": "Inspecting, cleaning, transforming and modeling data to discover useful information and support decisions.", "x": "", "src": "Level 1 · Foundations", "c": 1}, {"id": "sc-3551e891c7be", "q": "Data analyst", "a": "A role focused on querying, summarizing and visualizing data to answer business questions.", "x": "", "src": "Level 1 · Foundations", "c": 1}, {"id": "sc-1ff3b9c48b13", "q": "Data scientist", "a": "A role combining statistics, programming and domain knowledge to build models and extract insight from data.", "x": "", "src": "Level 1 · Foundations", "c": 1}, {"id": "sc-67538ca7d36f", "q": "Data engineer", "a": "A role that builds and maintains the pipelines and infrastructure that collect, store and move data.", "x": "", "src": "Level 1 · Foundations", "c": 1}, {"id": "sc-993bb507f5e1", "q": "Machine learning engineer", "a": "A role that builds, deploys and maintains ML models in production systems.", "x": "", "src": "Level 1 · Foundations", "c": 1}, {"id": "sc-11b7849ec1eb", "q": "Descriptive analytics", "a": "Analytics that answers \"What happened?\" by summarizing historical data.", "x": "", "src": "Level 1 · Foundations", "c": 1}, {"id": "sc-d4cdfab52c2b", "q": "Diagnostic analytics", "a": "Analytics that answers \"Why did it happen?\" by finding causes and relationships.", "x": "", "src": "Level 1 · Foundations", "c": 2}, {"id": "sc-3f22211ad677", "q": "Predictive analytics", "a": "Analytics that answers \"What is likely to happen?\" using statistical or ML models.", "x": "", "src": "Level 1 · Foundations", "c": 2}, {"id": "sc-7c036a60cbac", "q": "Prescriptive analytics", "a": "Analytics that answers \"What should we do?\" by recommending actions, often via optimization or simulation.", "x": "", "src": "Level 1 · Foundations", "c": 2}, {"id": "sc-b26c22076ab8", "q": "Data visualization", "a": "The graphical representation of data (charts, graphs, maps) to reveal patterns and communicate insights.", "x": "", "src": "Level 1 · Foundations", "c": 1}, {"id": "sc-f90453ec712c", "q": "Dashboard", "a": "A visual display that consolidates key metrics and charts for at-a-glance monitoring.", "x": "", "src": "Level 1 · Foundations", "c": 1}, {"id": "sc-79232425d909", "q": "KPI (key performance indicator)", "a": "A measurable value that shows how effectively an organization is achieving a key objective.", "x": "", "src": "Level 1 · Foundations", "c": 1}, {"id": "sc-c5a39a3a7b3d", "q": "Metric", "a": "A quantitative measure used to track and assess performance or quality.", "x": "", "src": "Level 1 · Foundations", "c": 1}, {"id": "sc-9fbd3f316cae", "q": "Data-driven decision making", "a": "Basing decisions on data analysis and evidence rather than intuition alone.", "x": "", "src": "Level 1 · Foundations", "c": 1}, {"id": "sc-29179836ef8b", "q": "Data literacy", "a": "The ability to read, understand, work with, analyze and communicate with data.", "x": "", "src": "Level 1 · Foundations", "c": 1}, {"id": "sc-9129f56e6a1d", "q": "Narrow AI (weak AI)", "a": "AI designed for a specific task, such as image recognition or playing chess. All AI deployed today is narrow in this sense.", "x": "", "src": "Level 1 · Foundations", "c": 1}, {"id": "sc-b48833d862da", "q": "Artificial general intelligence (AGI)", "a": "A hypothetical AI that matches or exceeds human ability across virtually all cognitive tasks.", "x": "", "src": "Level 1 · Foundations", "c": 2}, {"id": "sc-07b8697b1378", "q": "Artificial superintelligence (ASI)", "a": "A hypothetical AI whose intelligence vastly surpasses the best human minds in every domain.", "x": "", "src": "Level 1 · Foundations", "c": 2}, {"id": "sc-387dab55d8db", "q": "Turing test", "a": "Alan Turing's 1950 test: a machine passes if a human judge cannot reliably tell its conversation apart from a human's.", "x": "", "src": "Level 1 · Foundations", "c": 1}, {"id": "sc-2c62ac6c1fdf", "q": "Alan Turing", "a": "British mathematician who formalized computation (the Turing machine) and proposed the \"imitation game\" for machine intelligence.", "x": "", "src": "Level 1 · Foundations", "c": 1}, {"id": "sc-28d2ff4f0b9d", "q": "Dartmouth Conference (1956)", "a": "The workshop where John McCarthy and colleagues coined the term \"artificial intelligence\" and launched AI as a field.", "x": "", "src": "Level 1 · Foundations", "c": 2}, {"id": "sc-bd15fddcccc4", "q": "AI winter", "a": "A period of reduced funding and interest in AI after hype failed to meet expectations (notably the mid-1970s and late 1980s).", "x": "", "src": "Level 1 · Foundations", "c": 2}, {"id": "sc-032f4176924b", "q": "Expert system", "a": "A rule-based AI program that encodes human expert knowledge as if-then rules to solve problems in a narrow domain.", "x": "", "src": "Level 1 · Foundations", "c": 2}, {"id": "sc-864926972f7e", "q": "Symbolic AI", "a": "An approach to AI using explicit symbols, logic and rules to represent knowledge (also called GOFAI, \"good old-fashioned AI\").", "x": "", "src": "Level 1 · Foundations", "c": 2}, {"id": "sc-5266d2e0758f", "q": "Rule-based system", "a": "A system that makes decisions by applying hand-written if-then rules rather than learning from data.", "x": "", "src": "Level 1 · Foundations", "c": 1}, {"id": "sc-bbc8584d502d", "q": "Heuristic", "a": "A practical rule of thumb or shortcut that finds a good-enough solution quickly, without guaranteeing the optimal one.", "x": "", "src": "Level 1 · Foundations", "c": 2}, {"id": "sc-f415700d4d0c", "q": "Automation", "a": "Using technology to perform tasks with minimal human intervention.", "x": "", "src": "Level 1 · Foundations", "c": 1}, {"id": "sc-891e0758a720", "q": "Robotics", "a": "The field of designing and building robots that sense, decide and act in the physical world.", "x": "", "src": "Level 1 · Foundations", "c": 1}, {"id": "sc-d937dfff9ce2", "q": "Computer vision", "a": "The field of AI that enables computers to interpret and understand images and video.", "x": "", "src": "Level 1 · Foundations", "c": 1}, {"id": "sc-88897cd5cc54", "q": "Natural language processing (NLP)", "a": "The field of AI concerned with understanding, generating and analyzing human language.", "x": "", "src": "Level 1 · Foundations", "c": 1}, {"id": "sc-ab227fc8cc40", "q": "Speech recognition", "a": "Converting spoken audio into text (also called automatic speech recognition, ASR).", "x": "", "src": "Level 1 · Foundations", "c": 1}, {"id": "sc-47399e4f9e9a", "q": "Chatbot", "a": "A program that converses with users in natural language, through text or voice.", "x": "", "src": "Level 1 · Foundations", "c": 1}, {"id": "sc-a92b63fda614", "q": "Virtual assistant", "a": "An AI agent such as Siri, Alexa or Google Assistant that performs tasks or answers questions via voice or text.", "x": "", "src": "Level 1 · Foundations", "c": 1}, {"id": "sc-3ca6a767be6d", "q": "Recommendation system", "a": "A system that suggests items (movies, products, songs) to users based on their preferences and behavior.", "x": "", "src": "Level 1 · Foundations", "c": 1}, {"id": "sc-f3faf6658530", "q": "Supervised learning", "a": "Learning from labeled examples (input-output pairs) to predict outputs for new inputs.", "x": "", "src": "Level 1 · Foundations", "c": 1}, {"id": "sc-0a5c8eca94c9", "q": "Unsupervised learning", "a": "Learning patterns or structure from unlabeled data, such as clusters or lower-dimensional representations.", "x": "", "src": "Level 1 · Foundations", "c": 1}, {"id": "sc-d9319b96d4e3", "q": "Reinforcement learning", "a": "Learning by trial and error: an agent takes actions in an environment and learns from rewards and penalties.", "x": "", "src": "Level 1 · Foundations", "c": 2}, {"id": "sc-94172256b168", "q": "Classification", "a": "A supervised task that predicts a discrete category, e.g., spam or not spam.", "x": "", "src": "Level 1 · Foundations", "c": 1}, {"id": "sc-ea585073ff88", "q": "Regression", "a": "A supervised task that predicts a continuous numeric value, e.g., house price.", "x": "", "src": "Level 1 · Foundations", "c": 1}, {"id": "sc-ebb05f32f532", "q": "Clustering", "a": "An unsupervised task that groups similar data points together without predefined labels.", "x": "", "src": "Level 1 · Foundations", "c": 1}, {"id": "sc-d25a20e55868", "q": "Training set", "a": "The portion of data used to fit a model's parameters.", "x": "", "src": "Level 1 · Foundations", "c": 1}, {"id": "sc-64161258f45c", "q": "Test set", "a": "Held-out data used only at the end to estimate how well a model performs on unseen data.", "x": "", "src": "Level 1 · Foundations", "c": 1}, {"id": "sc-71e78f2d4dcf", "q": "Validation set", "a": "Data held out from training and used to tune hyperparameters and select models.", "x": "", "src": "Level 1 · Foundations", "c": 2}, {"id": "sc-26de05a44d1e", "q": "Accuracy", "a": "The fraction of predictions a model gets right: correct predictions ÷ total predictions.", "x": "", "src": "Level 1 · Foundations", "c": 1}, {"id": "sc-d97b809c679c", "q": "Error rate", "a": "The fraction of predictions a model gets wrong (1 − accuracy for classification).", "x": "", "src": "Level 1 · Foundations", "c": 1}, {"id": "sc-f4f3e2c24a11", "q": "Bias (in data)", "a": "A systematic skew in data or a process that leads to unfair or inaccurate outcomes.", "x": "", "src": "Level 1 · Foundations", "c": 1}, {"id": "sc-f5569d8a3a52", "q": "Pattern recognition", "a": "Automatically identifying regularities, such as shapes, sequences or trends, in data.", "x": "", "src": "Level 1 · Foundations", "c": 1}, {"id": "sc-9f0c29a94eaf", "q": "Data point", "a": "A single observation or value in a dataset.", "x": "", "src": "Level 1 · Foundations", "c": 1}, {"id": "sc-1533827f1053", "q": "Outlier", "a": "A data point that differs markedly from the rest of the data.", "x": "", "src": "Level 1 · Foundations", "c": 1}, {"id": "sc-6730454615fe", "q": "Missing data", "a": "Values that are absent from a dataset, often shown as blank, NULL or NaN.", "x": "", "src": "Level 1 · Foundations", "c": 1}, {"id": "sc-f88e460f9f30", "q": "Data cleaning", "a": "Detecting and correcting errors, inconsistencies and missing values in data (also called data cleansing).", "x": "", "src": "Level 1 · Foundations", "c": 1}, {"id": "sc-8b6a19dce8d0", "q": "Raw data", "a": "Data in its original, unprocessed form as collected from a source.", "x": "", "src": "Level 1 · Foundations", "c": 1}, {"id": "sc-17a5c3cce271", "q": "Data collection", "a": "Gathering data from sources such as surveys, sensors, logs, APIs or databases.", "x": "", "src": "Level 1 · Foundations", "c": 1}, {"id": "sc-9eff1ec918ce", "q": "Data source", "a": "The origin of data, such as a database, file, API, sensor or website.", "x": "", "src": "Level 1 · Foundations", "c": 1}, {"id": "sc-8151325dcdba", "q": "Sample", "a": "A subset of a population selected for analysis.", "x": "", "src": "Level 1 · Foundations", "c": 1}, {"id": "sc-db4d33057935", "q": "Population", "a": "The entire group of individuals or items that a study is interested in.", "x": "", "src": "Level 1 · Foundations", "c": 1}, {"id": "sc-ed4b436c7545", "q": "Hypothesis", "a": "A testable statement or proposed explanation about a relationship or effect.", "x": "", "src": "Level 1 · Foundations", "c": 1}, {"id": "sc-1469596fc89a", "q": "Correlation", "a": "A statistical measure of how strongly two variables move together.", "x": "", "src": "Level 1 · Foundations", "c": 1}, {"id": "sc-a46edd968281", "q": "Causation", "a": "A relationship in which a change in one variable directly produces a change in another.", "x": "", "src": "Level 1 · Foundations", "c": 1}, {"id": "sc-c844b235fe6d", "q": "\"Correlation does not imply causation\"", "a": "Two variables moving together does not prove that one causes the other; a confounder or coincidence may explain it.", "x": "Ice cream sales and drownings both rise in summer; heat drives both.", "src": "Level 1 · Foundations", "c": 1}, {"id": "sc-48075864b259", "q": "Trend", "a": "A general direction in which data moves over time, such as upward or downward.", "x": "", "src": "Level 1 · Foundations", "c": 1}, {"id": "sc-93a8018f99fa", "q": "Average", "a": "A single value summarizing the center of data, usually the arithmetic mean (sum ÷ count).", "x": "", "src": "Level 1 · Foundations", "c": 1}, {"id": "sc-5138292fdb5c", "q": "Percentage", "a": "A ratio expressed as a fraction of 100.", "x": "", "src": "Level 1 · Foundations", "c": 1}, {"id": "sc-b82b40b84a2f", "q": "Chart", "a": "A visual representation of data, such as a bar, line or pie chart.", "x": "", "src": "Level 1 · Foundations", "c": 1}, {"id": "sc-c3ee137d4f22", "q": "Table", "a": "Data arranged in rows and columns.", "x": "", "src": "Level 1 · Foundations", "c": 1}, {"id": "sc-f359c19530bb", "q": "Open data", "a": "Data that anyone can freely access, use and share, often published by governments or research bodies.", "x": "", "src": "Level 1 · Foundations", "c": 1}, {"id": "sc-abda2271bdb6", "q": "Descriptive statistics", " ervations fall.", "x": "", "src": "Level 2 · Statistics & Probability", "c": 1}, {"id": "sc-168f421aa7ba", "q": "Five-number summary", "a": "Minimum, Q1, median, Q3 and maximum; the basis of a box plot.", "x": "", "src": "Level 2 · Statistics & Probability", "c": 2}, {"id": "sc-1a0eaf2e50f7", "q": "1.5 × IQR rule", "a": "A common outlier rule: points below Q1 − 1.5·IQR or above Q3 + 1.5·IQR are flagged as outliers.", "x": "", "src": "Level 2 · Statistics & Probability", "c": 2}, {"id": "sc-71d801eadea8", "q": "Skewness", "a": "A measure of the asymmetry of a distribution. Positive (right) skew has a long right tail.", "x": "", "src": "Level 2 · Statistics & Probability", "c": 3}, {"id": "sc-15e6dd285a07", "q": "Kurtosis", "a": "A measure of how heavy a distribution's tails are compared with a normal distribution.", "x": "", "src": "Level 2 · Statistics & Probability", "c": 3}, {"id": "sc-a88397b662ae", "q": "Probability", "a": "A number from 0 to 1 measuring how likely an event is to occur.", "x": "", "src": "Level 2 · Statistics & Probability", "c": 1}, {"id": "sc-0effb3e85b63", "q": "Sample space", "a": "The set of all possible outcomes of a random experiment.", "x": "", "src": "Level 2 · Statistics & Probability", "c": 2}, {"id": "sc-5006ed0248a0", "q": "Event", "a": "A set of outcomes from the sample space to which a probability is assigned.", "x": "", "src": "Level 2 · Statistics & Probability", "c": 2}, {"id": "sc-55a159938ff5", "q": "Independent events", "a": "Events where the occurrence of one does not change the probability of the other: P(A and B) = P(A)·P(B).", "x": "", "src": "Level 2 · Statistics & Probability", "c": 2}, {"id": "sc-1d4d175b9aea", "q": "Mutually exclusive events", "a": "Events that cannot happen at the same time: P(A and B) = 0.", "x": "", "src": "Level 2 · Statistics & Probability", "c": 2}, {"id": "sc-fde833f3d222", "q": "Conditional probability", "a": "The probability of A given that B occurred: P(A|B) = P(A and B) / P(B).", "x": "", "src": "Level 2 · Statistics & Probability", "c": 2}, {"id": "sc-7980e792768d", "q": "Joint probability", "a": "The probability that two or more events occur together, P(A and B).", "x": "", "src": "Level 2 · Statistics & Probability", "c": 2}, {"id": "sc-b609134e03f6", "q": "Marginal probability", "a": "The probability of a single event regardless of other variables, obtained by summing or integrating over them.", "x": "", "src": "Level 2 · Statistics & Probability", "c": 2}, {"id": "sc-cb1881fe282a", "q": "Bayes' theorem", "a": "P(A|B) = P(B|A)·P(A) / P(B). It updates a prior belief with evidence to give a posterior.", "x": "", "src": "Level 2 · Statistics & Probability", "c": 3}, {"id": "sc-4a47653d5fc5", "q": "Prior", "a": "In Bayesian statistics, the belief about a parameter before seeing the data.", "x": "", "src": "Level 2 · Statistics & Probability", "c": 3}, {"id": "sc-0fba9ce50071", "q": "Posterior", "a": "The updated belief about a parameter after combining the prior with observed data via Bayes' theorem.", "x": "", "src": "Level 2 · Statistics & Probability", "c": 3}, {"id": "sc-b4f899713e79", "q": "Likelihood", "a": "The probability (or density) of the observed data as a function of the model parameters.", "x": "", "src": "Level 2 · Statistics & Probability", "c": 3}, {"id": "sc-91d7adfe0992", "q": "Random variable", "a": "A variable whose value is a numerical outcome of a random process.", "x": "", "src": "Level 2 · Statistics & Probability", "c": 2}, {"id": "sc-59ac7ab91232", "q": "Probability distribution", "a": "A function describing how probability is spread over the possible values of a random variable.", "x": "", "src": "Level 2 · Statistics & Probability", "c": 2}, {"id": "sc-dd9ff7f0271a", "q": "Probability mass function (PMF)", "a": "Gives the probability of each value of a discrete random variable.", "x": "", "src": "Level 2 · Statistics & Probability", "c": 2}, {"id": "sc-0ac8a7472262", "q": "Probability density function (PDF)", "a": "Describes the relative likelihood of a continuous random variable; probabilities are areas under the curve.", "x": "", "src": "Level 2 · Statistics & Probability", "c": 3}, {"id": "sc-d7b2945735cd", "q": "Cumulative distribution function (CDF)", "a": "F(x) = P(X ≤ x): the probability that a random variable is at most x.", "x": "", "src": "Level 2 · Statistics & Probability", "c": 3}, {"id": "sc-25b4b240fcf7", "q": "Expected value", "a": "The probability-weighted average of all possible values of a random variable; its long-run mean.", "x": "", "src": "Level 2 · Statistics & Probability", "c": 2}, {"id": "sc-b0a7479893a0", "q": "Normal distribution", "a": "The symmetric bell-shaped distribution defined by its mean μ and standard deviation σ (also called Gaussian).", "x": "", "src": "Level 2 · Statistics & Probability", "c": 2}, {"id": "sc-87d5578eacf1", "q": "Standard normal distribution", "a": "A normal distribution with mean 0 and standard deviation 1.", "x": "", "src": "Level 2 · Statistics & Probability", "c": 2}, {"id": "sc-8fddf2154390", "q": "68-95-99.7 rule", "a": "For a normal distribution, about 68%, 95% and 99.7% of values lie within 1, 2 and 3 standard deviations of the mean.", "x": "", "src": "Level 2 · Statistics & Probability", "c": 2}, {"id": "sc-2e2b919b7606", "q": "Z-score", "a": "(x − μ) / σ: how many standard deviations a value is from the mean.", "x": "", "src": "Level 2 · Statistics & Probability", "c": 2}, {"id": "sc-d7a6b7da5421", "q": "Uniform distribution", "a": "A distribution in which all outcomes in a range are equally likely.", "x": "", "src": "Level 2 · Statistics & Probability", "c": 2}, {"id": "sc-cd383da762f1", "q": "Bernoulli distribution", "a": "The distribution of a single trial with two outcomes: success with probability p, failure with 1 − p.", "x": "", "src": "Level 2 · Statistics & Probability", "c": 2}, {"id": "sc-851ca04fde87", "q": "Binomial distribution", "a": "The number of successes in n independent Bernoulli trials, each with success probability p.", "x": "", "src": "Level 2 · Statistics & Probability", "c": 2}, {"id": "sc-f726aea6fe33", "q": "Poisson distribution", "a": "Models the count of events in a fixed interval when events occur independently at a constant average rate λ.", "x": "", "src": "Level 2 · Statistics & Probability", "c": 2}, {"id": "sc-50fe7fdc6323", "q": "Exponential distribution", "a": "Models the waiting time between events in a Poisson process; it is memoryless.", "x": "", "src": "Level 2 · Statistics & Probability", "c": 2}, {"id": "sc-22b1a4bd9886", "q": "Beta distribution", "a": "A distribution on [0, 1], often used as a prior for probabilities (it is conjugate to the binomial).", "x": "", "src": "Level 2 · Statistics & Probability", "c": 3}, {"id": "sc-2d2f66987331", "q": "Student's t-distribution", "a": "A bell-shaped distribution with heavier tails than the normal, used when the sample is small and σ is unknown.", "x": "", "src": "Level 2 · Statistics & Probability", "c": 3}, {"id": "sc-2abdace95d7d", "q": "Chi-square distribution", "a": "The distribution of a sum of squared standard normal variables; used in goodness-of-fit and independence tests.", "x": "", "src": "Level 2 · Statistics & Probability", "c": 3}, {"id": "sc-c875f3b560f9", "q": "Log-normal distribution", "a": "A distribution whose logarithm is normally distributed; right-skewed, common for incomes and prices.", "x": "", "src": "Level 2 · Statistics & Probability", "c": 3}, {"id": "sc-da8c4ac0db2c", "q": "Power law", "a": "A relationship where one quantity varies as a power of another; it produces heavy-tailed \"long tail\" distributions.", "x": "", "src": "Level 2 · Statistics & Probability", "c": 3}, {"id": "sc-1885c945ef7f", "q": "Law of large numbers", "a": "As the sample size grows, the sample mean converges to the population (expected) mean.", "x": "", "src": "Level 2 · Statistics & Probability", "c": 2}, {"id": "sc-c1b2f2a75b28", "q": "Central limit theorem (CLT)", "a": "The distribution of the sample mean of many independent samples approaches a normal distribution, whatever the population's shape (given finite variance).", "x": "", "src": "Level 2 · Statistics & Probability", "c": 3}, {"id": "sc-5381342ff549", "q": "Sampling distribution", "a": "The probability distribution of a statistic (like the mean) over many repeated samples.", "x": "", "src": "Level 2 · Statistics & Probability", "c": 3}, {"id": "sc-c6136925d372", "q": "Standard error", "a": "The standard deviation of a sampling distribution; for the mean it is σ / √n.", "x": "", "src": "Level 2 · Statistics & Probability", "c": 3}, {"id": "sc-7f432d5761e7", "q": "Random sampling", "a": "Selecting a sample so that every member of the population has a known, usually equal, chance of being chosen.", "x": "", "src": "Level 2 · Statistics & Probability", "c": 1}, {"id": "sc-dc4f3d3a23a6", "q": "Stratified sampling", "a": "Dividing the population into subgroups (strata) and sampling from each, to keep their proportions.", "x": "", "src": "Level 2 · Statistics & Probability", "c": 2}, {"id": "sc-b4aa552c7d74", "q": "Cluster sampling", "a": "Randomly selecting whole groups (clusters) and including all or some members of each.", "x": "", "src": "Level 2 · Statistics & Probability", "c": 2}, {"id": "sc-ee7910975293", "q": "Systematic sampling", "a": "Selecting every k-th member from an ordered list after a random start.", "x": "", "src": "Level 2 · Statistics & Probability", "c": 2}, {"id": "sc-09a6fec7bd45", "q": "Convenience sampling", "a": "Sampling whoever is easiest to reach; quick but prone to bias.", "x": "", "src": "Level 2 · Statistics & Probability", "c": 1}, {"id": "sc-84bc721dd3bf", "q": "Sampling bias", "a": "A biased sample that does not represent the population because some members were more likely to be chosen.", "x": "", "src": "Level 2 · Statistics & Probability", "c": 2}, {"id": "sc-57e4add6e568", "q": "Selection bias", "a": "Distortion that arises when the way subjects are selected makes the sample unrepresentative.", "x": "", "src": "Level 2 · Statistics & Probability", "c": 2}, {"id": "sc-00814d44c222", "q": "Survivorship bias", "a": "Drawing conclusions only from the cases that \"survived\" a selection process, ignoring the ones that failed.", "x": "Studying only successful startups to learn what makes startups succeed.", "src": "Level 2 · Statistics & Probability", "c": 2}, {"id": "sc-806fd0845dbd", "q": "Confounding variable", "a": "A variable that influences both the supposed cause and the effect, creating a spurious association.", "x": "", "src": "Level 2 · Statistics & Probability", "c": 2}, {"id": "sc-46451d6fbaa9", "q": "Simpson's paradox", "a": "A trend that appears in several groups reverses or disappears when the groups are combined.", "x": "", "src": "Level 2 · Statistics & Probability", "c": 3}, {"id": "sc-b033017753e6", "q": "Point estimate", "a": "A single value used to estimate a population parameter, such as the sample mean.", "x": "", "src": "Level 2 · Statistics & Probability", "c": 2}, {"id": "sc-37554c2563cc", "q": "Confidence interval", "a": "A range computed from sample data that, under repeated sampling, would contain the true parameter at a stated rate (e.g., 95%).", "x": "", "src": "Level 2 · Statistics & Probability", "c": 3}, {"id": "sc-0d4a0836b6f6", "q": "Margin of error", "a": "Half the width of a confidence interval; the expected maximum difference between the estimate and the true value at that confidence level.", "x": "", "src": "Level 2 · Statistics & Probability", "c": 2}, {"id": "sc-c9018239ec96", "q": "Null hypothesis (H₀)", "a": "The default claim of no effect or no difference, which a test tries to find evidence against.", "x": "", "src": "Level 2 · Statistics & Probability", "c": 2}, {"id": "sc-5cb31e6b24e5", "q": "Alternative hypothesis (H₁)", "a": "The claim that there is an effect or difference; supported if the null is rejected.", "x": "", "src": "Level 2 · Statistics & Probability", "c": 2}, { tric test that builds the null distribution by randomly shuffling labels.", "x": "", "src": "Level 2 · Statistics & Probability", "c": 3}, {"id": "sc-10e61e45dc01", "q": "Monte Carlo simulation", "a": "Using repeated random sampling to estimate numerical results, such as probabilities or integrals.", "x": "", "src": "Level 2 · Statistics & Probability", "c": 3}, {"id": "sc-bf150487ee6e", "q": "Markov chain", "a": "A random process in which the next state depends only on the current state (the Markov property).", "x": "", "src": "Level 2 · Statistics & Probability", "c": 3}, {"id": "sc-a6f7d8abcfbc", "q": "Markov chain Monte Carlo (MCMC)", "a": "Algorithms (e.g., Metropolis-Hastings, Gibbs sampling) that sample from complex distributions by building a Markov chain.", "x": "", "src": "Level 2 · Statistics & Probability", "c": 4}, {"id": "sc-c83fa7a14099", "q": "Frequentist vs Bayesian", "a": "Frequentists treat parameters as fixed and probability as long-run frequency; Bayesians treat parameters as uncertain and update beliefs with data.", "x": "", "src": "Level 2 · Statistics & Probability", "c": 3}, {"id": "sc-87594beab579", "q": "Entropy (information theory)", "a": "The average uncertainty or information content of a random variable: H = −Σ p log p.", "x": "", "src": "Level 2 · Statistics & Probability", "c": 3}, {"id": "sc-36e999f3b61f", "q": "KL divergence", "a": "Kullback-Leibler divergence: a non-symmetric measure of how one probability distribution differs from a reference distribution.", "x": "", "src": "Level 2 · Statistics & Probability", "c": 4}, {"id": "sc-4235227b5143", "q": "Python", "a": "A general-purpose, readable programming language and the most widely used language for data science and ML.", "x": "", "src": "Level 3 · Data Tools: Python, SQL, Pandas, Charts", "c": 1}, {"id": "sc-4dc7c9ec434e", "q": "R", "a": "A programming language built for statistics and data visualization, popular in academia and research.", "x": "", "src": "Level 3 · Data Tool
