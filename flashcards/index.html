chnique Anthropic described in 2024 for reducing retrieval failures.", "x": "", "src": "Level 10 · Frontier Topics (2023–2026)", "c": 5}, {"id": "sc-bdf332e7fc76", "q": "Late chunking", "a": "Embedding a whole document first, then splitting token embeddings into chunks, so chunks retain surrounding context.", "x": "", "src": "Level 10 · Frontier Topics (2023–2026)", "c": 5}, {"id": "sc-47d337519167", "q": "ColBERT", "a": "A late-interaction retrieval model that compares individual token embeddings from the query and document.", "x": "", "src": "Level 10 · Frontier Topics (2023–2026)", "c": 5}, {"id": "sc-157fc686d0ed", "q": "Multimodal RAG", "a": "Retrieval across text, images, tables and other kinds of content.", "x": "", "src": "Level 10 · Frontier Topics (2023–2026)", "c": 5}, {"id": "sc-b25440c76bbd", "q": "Mixture of Experts (MoE)", "a": "An architecture that activates only a subset of its specialized subnetworks for each token, reducing compute.", "x": "", "src": "Level 10 · Frontier Topics (2023–2026)", "c": 5}, {"id": "sc-27c7602ca399", "q": "Small language model (SLM)", "a": "A compact model, such as Microsoft's Phi series, built for lower cost or on-device use.", "x": "", "src": "Level 10 · Frontier Topics (2023–2026)", "c": 3}, {"id": "sc-37a25dc56c44", "q": "Mamba", "a": "A 2023 sequence architecture based on state space models, offering linear-time scaling in sequence length.", "x": "", "src": "Level 10 · Frontier Topics (2023–2026)", "c": 5}, {"id": "sc-6e1a11163fcb", "q": "Kolmogorov-Arnold Network (KAN)", "a": "A 2024 architecture with learnable activation functions on edges rather than fixed ones on nodes.", "x": "", "src": "Level 10 · Frontier Topics (2023–2026)", "c": 5}, {"id": "sc-6c019827b026", "q": "Speculative decoding", "a": "A small draft model proposes tokens that a larger model verifies, which speeds up generation.", "x": "", "src": "Level 10 · Frontier Topics (2023–2026)", "c": 5}, {"id": "sc-6a8687004f66", "q": "Diffusion Transformer (DiT)", "a": "A diffusion model that uses a transformer as its denoising network rather than a U-Net.", "x": "", "src": "Level 10 · Frontier Topics (2023–2026)", "c": 5}, {"id": "sc-2f30f0b2fb40", "q": "Flow matching", "a": "A generative method that trains a model to learn a velocity field that transports noise to data.", "x": "", "src": "Level 10 · Frontier Topics (2023–2026)", "c": 5}, {"id": "sc-68839791d674", "q": "Rectified flow", "a": "A flow method that learns straight paths between noise and data, allowing fewer sampling steps.", "x": "", "src": "Level 10 · Frontier Topics (2023–2026)", "c": 5}, {"id": "sc-5f2354e725fd", "q": "Consistency model", "a": "A 2023 generative model trained to map noise directly to data, enabling one-step or few-step sampling.", "x": "", "src": "Level 10 · Frontier Topics (2023–2026)", "c": 5}, {"id": "sc-05d3fe3905f9", "q": "Sora", "a": "OpenAI's text-to-video model, announced in February 2024.", "x": "", "src": "Level 10 · Frontier Topics (2023–2026)", "c": 2}, {"id": "sc-ea0401c5c758", "q": "Veo", "a": "Google DeepMind's family of video generation models.", "x": "", "src": "Level 10 · Frontier Topics (2023–2026)", "c": 2}, {"id": "sc-e472ce81361a", "q": "Gaussian splatting", "a": "A 2023 3D scene rendering method representing scenes as many 3D Gaussians, enabling real-time rendering.", "x": "", "src": "Level 10 · Frontier Topics (2023–2026)", "c": 5}, {"id": "sc-0938ab7eb68e", "q": "Neural radiance field (NeRF)", "a": "A neural representation of a 3D scene, trained from images, for rendering new views.", "x": "", "src": "Level 10 · Frontier Topics (2023–2026)", "c": 5}, {"id": "sc-7733d08325ab", "q": "World model", "a": "A model that learns to simulate an environment, so that an agent can predict and plan.", "x": "", "src": "Level 10 · Frontier Topics (2023–2026)", "c": 5}, {"id": "sc-84fa5fc48ae3", "q": "Genie", "a": "Google DeepMind's 2024 generative model that creates playable, interactive environments from prompts or images.", "x": "", "src": "Level 10 · Frontier Topics (2023–2026)", "c": 4}, {"id": "sc-06f401fd3208", "q": "JEPA", "a": "Joint Embedding Predictive Architecture: Yann LeCun's approach of predicting abstract representations rather than raw inputs.", "x": "", "src": "Level 10 · Frontier Topics (2023–2026)", "c": 5}, {"id": "sc-c0c1e74484e0", "q": "AlphaFold", "a": "DeepMind's protein structure prediction system. Its developers shared the 2024 Nobel Prize in Chemistry.", "x": "", "src": "Level 10 · Frontier Topics (2023–2026)", "c": 3}, {"id": "sc-37cbc4211c81", "q": "AlphaProof and AlphaGeometry", "a": "DeepMind systems that together reached silver-medal level on 2024 International Math Olympiad problems.", "x": "", "src": "Level 10 · Frontier Topics (2023–2026)", "c": 4}, {"id": "sc-e95681b8b289", "q": "IMO gold-level AI (2025)", "a": "Experimental systems from OpenAI and Google DeepMind reached gold-medal-level scores on 2025 Olympiad problems.", "x": "", "src": "Level 10 · Frontier Topics (2023–2026)", "c": 4}, {"id": "sc-97620d5f297a", "q": "Neuro-symbolic AI", "a": "Combining neural networks with symbolic logic or formal reasoning.", "x": "", "src": "Level 10 · Frontier Topics (2023–2026)", "c": 4}, {"id": "sc-4e1ad8b722a8", "q": "Physical AI", "a": "AI systems that act in the physical world, such as robots and autonomous vehicles.", "x": "", "src": "Level 10 · Frontier Topics (2023–2026)", "c": 3}, {"id": "sc-bb69679eb5a0", "q": "Diffusion Policy", "a": "A robot learning method that uses a diffusion model to generate sequences of actions.", "x": "", "src": "Level 10 · Frontier Topics (2023–2026)", "c": 5}, {"id": "sc-66253cfa9ade", "q": "Imitation learning", "a": "Training a policy from demonstrations of a task, rather than from reward alone.", "x": "", "src": "Level 10 · Frontier Topics (2023–2026)", "c": 4}, {"id": "sc-9619949f14ba", "q": "Sim-to-real transfer", "a": "Training a robot in simulation and carrying the learned behavior over to the real world.", "x": "", "src": "Level 10 · Frontier Topics (2023–2026)", "c": 4}, {"id": "sc-70761ddbad5e", "q": "Mechanistic interpretability", "a": "Reverse-engineering neural networks to understand the internal computations behind their behavior.", "x": "", "src": "Level 10 · Frontier Topics (2023–2026)", "c": 5}, {"id": "sc-f818e2afc478", "q": "Feature (interpretability)", "a": "A direction or pattern in a network's activations that corresponds to a human-understandable concept.", "x": "", "src": "Level 10 · Frontier Topics (2023–2026)", "c": 5}, {"id": "sc-de2703037d1d", "q": "Superposition", "a": "Networks represent more features than they have dimensions by overlapping them.", "x": "", "src": "Level 10 · Frontier Topics (2023–2026)", "c": 5}, {"id": "sc-1323fe403a79", "q": "Polysemantic neuron", "a": "A single neuron that responds to several unrelated concepts.", "x": "", "src": "Level 10 · Frontier Topics (2023–2026)", "c": 5}, {"id": "sc-a1fc03485526", "q": "Sparse autoencoder (SAE)", "a": "Decomposes model activations into a larger set of sparse features that are easier to interpret.", "x": "", "src": "Level 10 · Frontier Topics (2023–2026)", "c": 5}, {"id": "sc-02b4e3ca0640", "q": "Golden Gate Claude", "a": "A 2024 Anthropic demo that amplified a Golden Gate Bridge feature, which made the model obsessed with the bridge.", "x": "", "src": "Level 10 · Frontier Topics (2023–2026)", "c": 5}, {"id": "sc-4eeb6b499877", "q": "Activation steering", "a": "Changing model behavior by adding a chosen vector to its internal activations.", "x": "", "src": "Level 10 · Frontier Topics (2023–2026)", "c": 5}, {"id": "sc-86b2ed6f0a0d", "q": "Circuit tracing", "a": "Mapping how features interact in steps inside a model to produce an output.", "x": "", "src": "Level 10 · Frontier Topics (2023–2026)", "c": 5}, {"id": "sc-f2b2eb945a61", "q": "Linear probe", "a": "A simple classifier trained on a model's activations to test whether they contain certain information.", "x": "", "src": "Level 10 · Frontier Topics (2023–2026)", "c": 5}, {"id": "sc-6fa99798dd2b", "q": "AI alignment", "a": "Ensuring that AI systems reliably pursue the goals and values their designers and users intend.", "x": "", "src": "Level 10 · Frontier Topics (2023–2026)", "c": 4}, {"id": "sc-ef3f1521c55c", "q": "Outer vs inner alignment", "a": "Outer alignment is specifying the right objective; inner alignment is getting a model to actually pursue it.", "x": "", "src": "Level 10 · Frontier Topics (2023–2026)", "c": 5}, {"id": "sc-21c104c59e3c", "q": "Goal misgeneralization", "a": "A model performs competently in new settings while pursuing a different goal than the one intended.", "x": "", "src": "Level 10 · Frontier Topics (2023–2026)", "c": 5}, {"id": "sc-e7d6a98003a6", "q": "Deceptive alignment", "a": "A hypothetical failure in which a model behaves well in training while hiding different goals.", "x": "", "src": "Level 10 · Frontier Topics (2023–2026)", "c": 5}, {"id": "sc-6b2386f83bfb", "q": "Sleeper agents", "a": "A 2024 Anthropic study showing that deliberately planted deceptive behaviors can survive safety training.", "x": "", "src": "Level 10 · Frontier Topics (2023–2026)", "c": 5}, {"id": "sc-3d3f40829c50", "q": "Alignment faking", "a": "A 2024 study in which a model selectively complied in training to avoid having its behavior modified.", "x": "", "src": "Level 10 · Frontier Topics (2023–2026)", "c": 5}, {"id": "sc-3649aa906c87", "q": "Emergent misalignment", "a": "A 2025 finding that narrow fine-tuning, such as on insecure code, can produce broad misaligned behavior.", "x": "", "src": "Level 10 · Frontier Topics (2023–2026)", "c": 5}, {"id": "sc-0e77ed30d0a5", "q": "Sandbagging", "a": "A model deliberately underperforming on an evaluation.", "x": "", "src": "Level 10 · Frontier Topics (2023–2026)", "c": 5}, {"id": "sc-1138986390e3", "q": "Evaluation awareness", "a": "A model recognizing that it is being tested, which can make test results less reliable.", "x": "", "src": "Level 10 · Frontier Topics (2023–2026)", "c": 5}, {"id": "sc-5f1b145831ca", "q": "Scheming", "a": "An AI covertly pursuing misaligned goals while hiding its real capabilities or intentions.", "x": "", "src": "Level 10 · Frontier Topics (2023–2026)", "c": 5}, {"id": "sc-f4e31d96ee2c", "q": "Many-shot jailbreaking", "a": "A long-context attack that fills a prompt with many fake harmful dialogue examples.", "x": "", "src": "Level 10 · Frontier Topics (2023–2026)", "c": 5}, {"id": "sc-03326f8ec16b", "q": "Constitutional classifiers", "a": "Safeguards trained on written rules that screen inputs and outputs to resist jailbreaks.", "x": "", "src": "Level 10 · Frontier Topics (2023–2026)", "c": 5}, {"id": "sc-60b6f93d8e5a", "q": "Deliberative alignment", "a": "OpenAI's 2024 technique of training reasoning models to reason explicitly about safety specifications before responding.", "x": "", "src": "Level 10 · Frontier Topics (2023–2026)", "c": 5}, {"id": "sc-b39fd3f018bb", "q": "AI control", "a": "Techniques for safely using powerful models even if they may be untrustworthy, through monitoring and restrictions.", "x": "", "src": "Level 10 · Frontier Topics (2023–2026)", "c": 5}, {"id": "sc-93fad39cf480", "q": "Responsible Scaling Policy (RSP)", "a": "Anthropic's framework that ties required safety measures to model capability thresholds (AI Safety Levels).", "x": "", "src": "Level 10 · Frontier Topics (2023–2026)", "c": 5}, {"id": "sc-37b2e852be75", "q": "Frontier AI", "a": "The most capable general-purpose models at the leading edge of the field.", "x": "", "src": "Level 10 · Frontier Topics (2023–2026)", "c": 3}, {"id": "sc-326c1ed3d6bd", "q": "EU AI Act", "a": "The EU's risk-based AI law, which entered into force in August 2024 and applies in stages.", "x": "", "src": "Level 10 · Frontier Topics (2023–2026)", "c": 3}, {"id": "sc-7def56c64b70", "q": "Dangerous capability evaluations", "a": "Tests of whether a model could materially assist with severe harms, such as in cybersecurity or biology.", "x": "", "src": "Level 10 · Frontier Topics (2023–2026)", "c": 5}, {"id": "sc-8d4bf6d792bc", "q": "Unlearning", "a": "Removing specific knowledge or the influence of particular data from a trained model.", "x": "", "src": "Level 10 · Frontier Topics (2023–2026)", "c": 4}, {"id": "sc-39114ee2edfb", "q": "C2PA and watermarking", "a": "Provenance methods that attach or embed information identifying AI-generated content.", "x": "", "src": "Level 10 · Frontier Topics (2023–2026)", "c": 4}, {"id": "sc-a78b8deba4ed", "q": "Automated AI research", "a": "Using AI systems to speed up AI research itself; a closely watched capability and risk.", "x": "", "src": "Level 10 · Frontier Topics (2023–2026)", "c": 4}, {"id": "sc-217012e550ea", "q": "Recursive self-improvement", "a": "A hypothetical process in which AI repeatedly improves its own design, accelerating progress.", "x": "", "src": "Level 10 · Frontier Topics (2023–2026)", "c": 4}, {"id": "sc-4c0b857669c0", "q": "Data wall", "a": "The concern that public, high-quality training data is running short, which pushes attention to synthetic data and reasoning.", "x": "", "src": "Level 10 · Frontier Topics (2023–2026)", "c": 4}, {"id": "sc-0a5a0fb83120", "q": "Compute cluster scale", "a": "Frontier training now uses clusters of hundreds of thousands of GPUs, making power a limiting constraint.", "x": "", "src": "Level 10 · Frontier Topics (2023–2026)", "c": 4}, {"id": "sc-206ff1955a5c", "q": "High-bandwidth memory (HBM)", "a": "Stacked memory placed close to AI accelerators, and a major supply bottleneck.", "x": "", "src": "Level 10 · Frontier Topics (2023–2026)", "c": 4}, {"id": "sc-4aa513498896", "q": "NVIDIA Blackwell", "a": "NVIDIA's AI accelerator architecture, announced in 2024 as the successor to Hopper.", "x": "", "src": "Level 10 · Frontier Topics (2023–2026)", "c": 3}, {"id": "sc-0fd1e0434ec4", "q": "ARC-AGI", "a": "François Chollet's benchmark of novel visual puzzles, intended to test adaptable reasoning rather than memorized skill.", "x": "", "src": "Level 10 · Frontier Topics (2023–2026)", "c": 4}, {"id": "sc-f8be9f97ea95", "q": "SWE-bench", "a": "A benchmark that tests models on resolving real GitHub issues.", "x": "", "src": "Level 10 · Frontier Topics (2023–2026)", "c": 4}, {"id": "sc-155a754b4d6d", "q": "Humanity's Last Exam", "a": "A 2025 benchmark of very hard expert-written questions across many academic fields.", "x": "", "src": "Level 10 · Frontier Topics (2023–2026)", "c": 4}, {"id": "sc-d39ee479f0a1", "q": "GDPval", "a": "An OpenAI evaluation from 2025 that measures model performance on real-world professional work tasks.", "x": "", "src": "Level 10 · Frontier Topics (2023–2026)", "c": 4}]}, {"name": "Machine Learning", "cards": [{"id": "H4_X/eNQp;", "q": "How Deep Belief Network is created?", "a": "Stacking multiple Restricted Boltzman Machine (RBM)", "x": "", "src": "Hands-On ML (Géron)", "c": 4}, {"id": "t-9d24cdc5e2c9", "q": "Semi-Supervised Algorithm Example", "a": "Deep Belief Networks (DBN)", "x": "", "src": "", "c": 2}, {"id": "t-4cb5d3aa63a7", "q": "Restricted Boltzman Machine (RBM) is?", "a": "an Unsupervised Learning Algorithm", "x": "", "src": "", "c": 4}, {"id": "t-dc81f3cd6a12", "q": "What are some most important supervised learning algorithms", "a": "* KNN<br>* Linear Regression<br>* Logistic Regression<br>* Support Vector Machines (SVM)<br>* Decision Trees and Random Forests<br>* Neural Networks", "x": "", "src": "", "c": 2}, {"id": "t-97a973b04920", "q": "What are two main approach to generalize ML", "a": "1. Instance based learning<br>2. Model based learning", "x": "", "src": "", "c": 2}, {"id": "t-76bd5a5a8b39", "q": "What is instance based learning?", "a": "* This uses similarity of measure between two examples. e.g.: count the total no of words <br><br>* System learns the examples by heart, then generalize to new cases using similarity measure", "x": "", "src": "", "c": 2}, {"id": "t-f16d2ca98646", "q": "What is Model-based learning", " lization", "c": 3}, {"id": "mjII?JnHWG", "q": "Example of ConvNet (how it works)", "a": "<img src=\"media/paste-fc4b013badf94d0449eb60fd901f19c0bd8fa3d5.jpg\" alt=\"\" loading=\"lazy\">", "x": "", "src": "Coursera DL Specialization", "c": 3}, {"id": "z-lmpO^2R-", "q": "What is the use of Pooling layer in Convnet?", "a": "- Pooling layer helps in reducing the size of presenation to speed-up computation<br>- detecing some features<br><br>Hyperparameter:<br>f: filter size<br>s: stride<br>Max/Avg pooling", "x": "Pl note that \"No parameter to learn\" in Max pooling layer you just have to set the hyperparameter f and s and there are no weights", "src": "Coursera DL Specialization", "c": 3}, {"id": "vlr7X{0J:x", "q": "Example of Neural Network (LeNet-5 Arch)", "a": "<img src=\"media/paste-cd71ebbc561bf2c24a5c2e4816b5ad952eff1d5e.jpg\" alt=\"\" loading=\"lazy\"><br><br><img src=\"media/paste-564b105c5e15e5322403f52e18203d4d395c19df.jpg\" alt=\"\" loading=\"lazy\">", "x": "", "src": "Coursera DL Specialization", "c": 3}, {"id": "QYl.>}XgIP", "q": "Why convolutions?", "a": "<img src=\"media/paste-590648a629258f351032192b5d43360e03efc06f.jpg\" alt=\"\" loading=\"lazy\"><br><br><img src=\"media/paste-acff2f0ed0a7f3db1333c6ec69a06bb0988c08bc.jpg\" alt=\"\" loading=\"lazy\">", "x": "", "src": "Coursera DL Specialization", "c": 3}]}, {"name": "Data Mining & Data Engineering", "cards": [{"id": "Ai&LD~]P`|", "q": "What is Support of Association rules in data mining", "a": "Support is the no of times an item apperas in then total transactions, this helps in understanding the popularity of the product.", "x": "", "src": "Data Mining", "c": 2}, {"id": "Ri)uG(n>!6", "q": "What is Confidence of Association rules in data mining", "a": "Confidence is an indication of how often the rule is valid, a kind of likelyhood, say if A is purchased and B is also purchased. This helps in finding more assocations in transaction.", "x": "", "src": "Data Mining", "c": 2}, {"id": "QF:[pObILH", "q": "What is Entropy in Decesion Trees in data mining", "a": "Entropy is a probability distribution which tell about some sort of uncertanity. Inj decesion tress we use entropy to check the discorder. High entropy means high level of disorder, we should aim for lowe entropy close to 0 (zero)", "x": "", "src": "Data Mining", "c": 3}, {"id": "r<}5S<auQ,", "q": "What is Information Gain in Decesion tree in data mining", "a": "IG is a metric to train decesion trees, this actually mesaures the quality of split, we can get information about a variable.", "x": "", "src": "Data Mining", "c": 3}, {"id": "Qw^cQTe(hS", "q": "What is BigQuery?", "a": "Google Cloud Data Warehouse", "x": "", "src": "Coursera ML on GCP", "c": 2}, {"id": "t-f4d4fa3c0e2d", "q": "What is the data pipeline?", "a": "<div> A sequence of data processing components  <\/div>", "x": "", "src": "", "c": 2}, {"id": "t-5cffddea09b4", "q": "What are the data pipeline components?", "a": "<div> 1. Origin - IoT Sensor, Social Media API's, Data Warehouse, Data Lake<br><br>2. Destination - Data Visualization, Data Warehouse, Data Lake<br><br>3. Data flow - ETL tools<br><br>4. Storage - Data Store<br><br>5. Processing<br><br>6. Workflow<br><br>7. Monitoring<br><br>8. Technology<div><br><br> Read more here: https://www.altexsoft.com/blog/data-pipeline-components-and-types<\/div> <\/div>", "x": "", "src": "", "c": 2}, {"id": "t-b6a3da588d1a", "q": "What is Correlation?", "a": "<div> Correlation (association) is a statistical relationship between two entities, it is a measure of the extent to which two variables are related In other words, it's how two variables move in relation to one another. A positive correlation is a relationship between two variables in which both variables move in the same direction. <\/div>", "x": "", "src": "", "c": 1}, {"id": "t-1e593308b05c", "q": "When is histogram is used?", "a": "<div> Histogram is mainly used in places where you want to know the distribution of your variables.  <\/div>", "x": "", "src": "", "c": 1}]}, {"name": "Data Structures & Algorithms", "cards": [{"id": "J8ZVi|^~&b", "q": "What is the brute force technique for problem solving in algorithms?", "a": "<ul>\n<li>The first approach that comes to our mind on seeing the problem, just like iterating every possibility available to solve that problem.<br><br><\/li>\n<li>Brute force technique typically tries to exhaust all possibilities (extreme search).<br><br><\/li>\n<li>Checking all possible candidates for the solution and also checking whether each candidate satisfies the problem's statement<\/li>\n<\/ul>", "x": "", "src": "Big O Notation", "c": 1}, {"id": "y`aZNI7;<s", "q": "Give few example of brute-force approach of problem solving?", "a": "<ul>\n<li>Bubble Sort<br><br><\/li>\n<li>Selection Sort<\/li>\n<\/ul>", "x": "", "src": "Basics", "c": 1}, {"id": "c]1W6^-!G%", "q": "What are the most important type of Algorithms in problem solving?", "a": "<ul><br><li>Brute Force Algorithms<br><br><\/li><br><li>Recursive Algorithms<br><br><\/li><br><li>Divide and Conquer Algorithms<br><br><\/li><br><li>Dynamic Programming Algorithms<br><br><\/li><br><li>Greedy Algorithms<br><br><\/li><br><li>Backtracking Algorithms<\/li><br><\/ul>", "x": "", "src": "Basics", "c": 2}, {"id": "OzHe{AiLx@", "q": "What are the problems which can be solved by using Recursive algorithms?", "a": "<ul>\n<li>Factorial of a Number<br><br><\/li><li>Fibonacci Series<br><br><\/li><li>Tower of Hanoi<br><br><\/li><li>DFS for Graph<\/li>\n<\/ul>", "x": "", "src": "Basics", "c": 2}, {"id": "QjQP:$u`Rs", "q": "What are the problems which can be solved by using Divide and Conquer Algorithms?", "a": "<ul>\n<li>Binary Search<br><br><\/li><li>Merge Sort<br><br><\/li><li>Quick Sort<br><br><\/li><li>Strassen’s Matrix Multiplication<br><\/li>\n<\/ul>", "x": "", "src": "Basics", "c": 3}, {"id": "sl!{zJ?**K", "q": "What is Divide and Conquer Algorithm?", "a": "Solve problem in 2 sections:<div><br><div>1. Divide problem into subproblem of the same type<\/div><div><br><\/div><div>2. Solve smaller problem independently<\/div><div><br><\/div><div>Finally add the combined result to produce the final answer<\/div><\/div>", "x": "", "src": "Basics", "c": 2}, {"id": "ymGkL^a>rf", "q": "What are Dynamic Programming Algorithms?", "a": "<div>Dyamic programming algoritms are:<\/div><ul><li>Based on the memoization technique <br><br><\/li><li>Divide the complex problem into smaller overlapping subproblems and storing the result for future use to avoid calculating it again.<br><\/li><\/ul>", "x": "", "src": "Basics", "c": 3}, {"id": "q7:Cr^Bdxq", "q": "What are the problems which can be solved by using Dynamic Programming Algorithms?", "a": "<ul><li>Knapsack Problem<br><br><\/li><li>Weighted Job Scheduling<br><br><\/li><li>Floyd Warshall Algorithm<br><br><\/li><li>Dijkstra Shortest Path Algorithm<br><\/li><\/ul>", "x": "", "src": "Basics", "c": 3}, {"id": "ox@9{ew-u/", "q": "What are Greedy Algorithms?", "a": "<div>By using Greedy Algorithms:<\/div><ul><li>Solution is built part by part<br><br><\/li><li>Next part is chosen on the basis that it gives immediate benefit<br><br><\/li><li>Previous choice not considered<\/li><\/ul>", "x": "", "src": "Basics", "c": 2}, {"id": "Di}sBf7|u/", "q": "What are the problems which can be solved by using Greedy Algorithms?", "a": "<ul><li>Prim’s Algorithm<br><br><\/li><li>Kruskal’s Algorithm<br><br><\/li><li>Huffman Coding<\/li><\/ul>", "x": "", "src": "Basics", "c": 3}, {"id": "O%yRSy.4Sf", "q": "What are Backtracking Algorithms?", "a": "In Backtracking algorithm:<div><ul><li>Problem is solved recursively in an incremental way<br><br><\/li><li>It is a systematic way of trying out different sequences of decisions until we found one that \"works\" <br><br><\/li><li>It remove all those solutions that fail to satisfy the constraints of the problem at any point of time<br><br><\/li><li>This algorithms is generally used to solve optimization problems<br><br><\/li><\/ul><\/div>", "x": "", "src": "Basics", "c": 3}, {"id": "As)]AASW<z", "q": "What are the problems which can be solved by using Backtracking Algorithms?", "a": "<ul><li>Hamiltonian Cycle<br><br><\/li><li>M-Coloring Problem<br><br><\/li><li>N Queen Problem<br><br><\/li><li>Rat in Maze Problem<br><\/li><\/ul>", "x": "", "src": "Basics", "c": 3}, {"id": "KjGQfCQb1*", "q": "What is Big-O notation?", "a": "* how quickly runtime will grow relative to the input as the input get arbitrarily large. <div>* It's not always a measure of speed but instead a mesure of how well an algorithm scales.<\/div>", "x": "", "src": "Big O Notation", "c": 2}, {"id": "eHBsxu$5w,", "q": "What are runtime of common Big-O functions?", "a": "<img src=\"media/paste-d219be8b71c6a527375335139e2474bf752d8649.jpg\" alt=\"\" loading=\"lazy\"><div><br><\/div><div>https://www.bigocheatsheet.com/<br><\/div><div><br><\/div>", "x": "", "src": "Big O Notation", "c": 2}, {"id": "CbyH_<a!ho", "q": "<div class=\"code\"><div><span>What is the Big-O (<\/span><span>time complexity) <\/span><span>of the below code?<\/span><\/div><div><br><\/div><div>def func_constant(values):<br><\/div><div>    #prints first item in a list of values.<\/div><div>    print values[0]<\/div><div><br><\/div><div>func_constant([1,2,3])<\/div><\/div>", "a": "<div class=\"code\"><strong>O(1) Constant<\/strong><\/div>", "x": "function is constant because regardless of the list size, the function will only ever take a constant step size, in this case 1, printing the first value from a list. so we can see here that an input list of 100 values will print just 1 item, a list of 10,000 values will print just 1 item, and a list of <strong>n<\/strong> values will print just 1 item!", "src": "Big O Notation", "c": 1}, {"id": "Ene1z4=F%D", "q": "<div class=\"code\"><div><span>What is the Big-O (<\/span><span>time complexity) <\/span><span>of the below code?<\/span><\/div><div><br><\/div><div>def func_lin(lst):<br>    '''<br>    Takes in list and prints out all values<br>    '''<br>    for val in lst:<br>        print val<br>        <br>func_lin([1,2,3])<span><br><\/span><\/div><\/div>", "a": "<div class=\"code\"><strong>O(n) Linear<br><\/strong><\/div>", "x": "This function runs in O(n) (linear time). This means that the number of operations taking place scales linearly with n, so we can see here that an input list of 100 values will print 100 times, a list of 10,000 values will print 10,000 times, and a list of n values will print n times.", "src": "Big O Notation", "c": 1}, {"id": "pr#`Zu38W|", "q": "<div class=\"code\"><div><span>What is the Big-O (<\/span><span>time complexity) <\/span><span>of the below code?<\/span><\/div><div><br><\/div><div><br><\/div>def func_quad(lst):<br>    '''<br>    Prints pairs for every item in list.<br>    '''<br>    for item_1 in lst:<br>        for item_2 in lst:<br>            print item_1,item_2<br>            <br>lst = [0, 1, 2, 3]<br><br>func_quad(lst)<\/div>", "a": "<div class=\"code\"><strong>O(n^2) Quadratic<\/strong><\/div>", "x": "Note how we now have two loops, one nested inside another. This means that for a list of n items, we will have to perform n operations for <em>every item in the list!<\/em> This means in total, we will perform n times n assignments, or n^2. So a list of 10 items will have 10^2, or 100 operations. You can see how dangerous this can get for very large inputs! This is why Big-O is so important to be aware of!", "src": "Big O Notation", "c": 2}, {"id": "J_Zu6r[uX/", "q": "<div class=\"code\"><div><span>What is the Big-O (<\/span><span>time complexity) <\/span><span>of the below code?<\/span><\/div><div><br><\/div><div><br><\/div>def print_3(lst):<br>    '''<br>    Prints all items three times<br>    '''<br>    for val in lst:<br>        print val<br>        <br>    for val in lst:<br>        print val<br>        <br>    for val in lst:<br>        print val<div>print_3(lst)<br><\/div><\/div>", "a": "<div class=\"code\"><strong>O(n) Linear<\/strong><\/div>", "x": "We can see that the first function will print O(n) items and the second will print O(3n) items. However for n going to inifinity the constant can be dropped, since it will not have a large effect, so both functions are O(n).", "src": "Big O Notation", "c": 2}, {"id": "J^R8[#l@}>", "q": "<strong>What is Space Complexity in algorithm analysis?<\/strong>", "a": "Space Complexity focuses on how much memory/space an algorithm uses.", "x": "", "src": "Big O Notation", "c": 2}, {"id": "G=mUi0a0q}", "q": "<div class=\"code\"><div><span>What is the Big-O (Space<\/span><span> Complexity) <\/span><span>of the below code?<\/span><\/div><div><br><\/div><div>def create_list(n):<br>    new_list = []<br>    <br>    for num in range(n):<br>        new_list.append('new')<br>    <br>    return new_list<br><\/div><div><br><\/div><div>print create_list(5)<br><\/div><\/div>", "a": "<div class=\"code\"><strong>O(n) Linear<\/strong><\/div>", "x": "Size of the new_list object scales with the input <strong>n<\/strong>, this shows that it is an O(n) algorithm with regards to <strong>space<\/strong> complexity.", "src": "Big O Notation", "c": 2}, {"id": "C84k$V0b,R", "q": "<div class=\"code\"><div>What is the space complexity of the below function?<\/div><div><br><\/div>def printer(n=10):<br>    '''<br>    Prints \"hello world!\" n times<br>    '''<br>    for x in range(n):<br>        print 'Hello World!'<div>printer()<br><\/div><\/div>", "a": "<div class=\"code\"><strong>O(1) Constant<\/strong><\/div>", "x": "we only assign the 'hello world!' variable once, not every time we print. So the algorithm has O(1) <strong>space<\/strong> complexity and an O(n) <strong>time<\/strong> complexity.", "src": "Big O Notation", "c": 1}, {"id": "hYd/>Y`63_", "q": "Big-O for common list operations?", "a": "<img src=\"media/paste-6252ba5390a5439c8d9aae9adc120f1604e65950.jpg\" alt=\"\" loading=\"lazy\">", "x": "", "src": "Big O Notation", "c": 2}, {"id": "v8s(kU|%!j", "q": "Big-O for common dict operations?", "a": "<img src=\"media/paste-77361644ec8220b127b812f84d816937bef00266.jpg\" alt=\"\" loading=\"lazy\">", "x": "", "src": "Big O Notation", "c": 2}, {"id": "KGU#^UAPy]", "q": "<div class=\"code\"><div>What is the time complexity of the given code?<\/div><div><br><\/div>x = n<br>while x &gt; 0:<br>   y = 2 + 2<br>   x = x // 2<\/div>", "a": "<div class=\"code\">O(log n)<\/div>", "x": "<span>x is cut in half each time through the loop, so it will only take log(n) iterations<\/span>", "src": "Big O Notation", "c": 3}, {"id": "fT+X6{!m!w", "q": "What is a dynamic array?", "a": "<li>A dynamic array is similar to an array, but with the difference that its size can be dynamically modified at runtime<br><br><\/li><li>It grows automatically when you try to make an insertion into a fully occupied list<br><br><\/li><li>They double in size when full<br><br><\/li><li>Python list is a dynamic array<br><br><br>Check Dynamic Array Imple:<br>https://www.tutorialspoint.com/implementation-of-dynamic-array-in-python<br><\/li>", "x": "", "src": "Array", "c": 2}, {"id": "r{l03Wq*X|", "q": "What is an amortized analysis?", "a": "<li>Amortized analysis is a method for analyzing a given algorithm's complexity, or how much of a resource, especially time or memory, it takes to execute.<br><br><\/li><li>Amortized Analysis is used for algorithms where an occasional operation is very slow, but most of the other operations are faster. <br><br><\/li><li> In Amortized Analysis, we analyze a sequence of operations and guarantee a worst case average time which is lower than the worst case time of a particular expensive operation.<br><br><br>Check here: https://www.geeksforgeeks.org/analysis-algorithm-set-5-amortized-analysis-introduction/<br><\/li>", "x": "", "src": "Array", "c": 3}, {"id": "vfxIQ,Z_KZ", "q": "How to check for an anagram for given two strings?", "a": "An anagram is when the two strings can be written using the exact same letters, we can just rearrange letters to get a different phrase/word.<div><br><\/div><div>e.g.; \"clint eastwood\" is an anagram of \"old west action\"<\/div><div><br><\/div><div>Code:<\/div><div>https://github.com/ppant/DS-Algos-Python/tree/master/Arrays<br><\/div><div><br><\/div>", "x": "", "src": "Array", "c": 2}, {"id": "F)X|u*IZx}", "q": "Python Stack Data Structure Implementation", "a": "<div class=\"code\"><img src=\"media/paste-d33dac366ee933af5eefafcef0e711a542379225.jpg\" alt=\"\" loading=\"lazy\"><\/div>", "x": "Check my Github for full code: https://github.com/ppant/DS-Algos-Python/blob/master/Stacks/StackImple.py", "src": "Stack Queues Deques", "c": 2}, {"id": "D^O22;5j~c", "q": "BFS (Breadth First Search)", "a": "Facts: BFS can be started from any vertex you like also while exploring vertices you can visit vertices in any order you like.<br><br>Rule is:<br>1. When you are selecting a vetex for exploration then you should visit all its adjacent verices then only you should go to next vertex for exploration<br>2. You should select the next vertex for exploration from a queue data structure only.<br><br>BFS spanning tree<br>Level order of binary tree<br>Time complexity: O(n) where n is no of vertices", "x": "", "src": "Graph Algorithms", "c": 3}, {"id": "K|,#fqn}-U", "q": "DFS (Depth First Search)", "a": "Facts: DFS can be started from any vertex you like.<br><br>Rule is:<br>1. While exploration once you have reached a new vertex, start exploring it and suspend the previous one , similarly you dig deep till no new node to explore. <br>2. Suspended node to be stored in stack data structure which will be used while coming back during traversal.<br><br>DFS spanning tree<br>Preorder<br>Time complexity: O(n) no of vertices", "x": "", "src": "Graph Algorithms", "c": 3}]}, {"name": "Python", "cards": [{"id": "P;*uHrcq{:", "q": "<div class=\"code\">{x:x**2 for x in range(10)}<\/div>", "a": "<div class=\"code\"><div><div><div><div><div><pre>{0: 0, 1: 1, 2: 4, 3: 9, 4: 16, 5: 25, 6: 36, 7: 49, 8: 64, 9: 81}<\/pre><\/div><\/div><\/div><\/div><\/div><\/div>", "x": "<div>This is an example of dictionary comprehension<\/div>", "src": "Python", "c": 2}, {"id": "z.t}iK%C:z", "q": "<div class=\"code\">[x**2 for x in range(10)]<\/div>", "a": "<div class=\"code\"><div><div><div><div><div><pre>[0, 1, 4, 9, 16, 25, 36, 49, 64, 81]<\/pre><\/div><\/div><\/div><\/div><\/div><\/div>", "x": "This is an example of List comprehension", "src": "Python", "c": 2}, {"id": "16)PD", "q": "Strings in Python are immutable/mutable?", "a": "Strings in Python are immutable means you can't change in-place value of a char. Once string is created you can't change/replace its elements", "x": "", "src": "Python", "c": 1}, {"id": "5sFH4", "q": "What is set?", "a": "Set is a collection of un-ordered unique items it looks like dictionary (in notation) but only keys which are unique. It can help in removing repeated items means you can use set to cast list.", "x": "", "src": "Python", "c": 1}, {"id": "tSk+1", "q": "Is Python list mutable?", "a": "List are mutable, this means that we can change in-place value.", "x": "", "src": "Python", "c": 1}, {"id": "b+<_C", "q": "Is tuples are mutable?", "a": "tuples are not mutable (does not support item assignment) aka immutable, fewer methods in tuples then why to use instead of list. The key is immutability. if an program if you want sequence/val does not get changed then tuple is an solution like storing calendar dates which know will not change during your programs.", "x": "", "src": "Python", "c": 1}, {"id": "ft*W3", "q": "<div class=\"code\">s= \"Hello World\" <br>s[::-1]<\/div>", "a": "<div class=\"code\">dlroW olleH<\/div>", "x": "this will reverse string s \"dlroW olleH\" double colon is used to tell the range and also how many elements can be skipped.", "src": "Python", "c": 2}, {"id": "pF^425kNtx", "q": "How to make a dictionary?", "a": "<div class=\"code\">my_dict = {}<\/div>", "x": "", "src": "Python", "c": 1}, {"id": "n`jQr-aC/E", "q": "<div class=\"code\">How to access key1 in dictionary <span>my_dict = {'key1':'value1','key2':'value2'}<\/span>?<\/div>", "a": "<div class=\"code\">my_dict['key1']<\/div>", "x": "Pl note that dictinary is defined by {} and accessed using ['key-name']", "src": "Python", "c": 1}, {"id": "G^O@O$qm/)", "q": "Method to return a list of all keys of a dictionary?", "a": "<div class=\"code\">d.keys()<\/div>", "x": "", "src": "Python", "c": 1}, {"id": "FA]|vY&uO7", "q": "What are Python methods?", "a": "Functions that belong to objects", "x": "In Python everything is an object, each object have methods associated, depending on type i.e.; list, int, float etc but avaliable methods are different.", "src": "Python", "c": 1}, {"id": "cpkZ2nKJGE", "q": "Name a method which can change the object in which it was called?", "a": "<div class=\"code\">append<\/div>", "x": "str.append(\"test\") will change the str", "src": "Python", "c": 2}, {"id": "y47nu@3B,f", "q": "Given a list with tuple, sort the second element using lambda expression in Python", "a": "<div>sorted([('abc', 121),('abc', 231),('abc', 148), ('abc',221)],key=lambda x: x[1], reverse=True)<br><\/div>", "x": "", "src": "Python", "c": 3}]}];const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const txt=h=>{const d=document.createElement('div');d.innerHTML=h;return d.textContent.replace(/\s+/g,' ').trim();};
// Storage keys are prefixed: localStorage is shared with every other repo on the same github.io origin.
const KEY='mlds.known',TOUR='mlds.tourDone',DECK='mlds.deck',FONT='mlds.font';
const SYNC={clientId:'613993939930-t700rcuoqbjbd1k9bcc9aq6jiq6hjfsj.apps.googleusercontent.com',url:'https://script.google.com/macros/s/AKfycbzyZsB1sdEzIxWugaURVagSbwN8_Y9s9myVOL-ufi0H8WEzZxHyVX_B8Q6Jeb7aT4cuDA/exec'};  // Google sign-in and sync stay hidden until these are set: see SETUP-SIGNIN.md
let known={};try{known=JSON.parse(localStorage.getItem(KEY)||'{}');}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(known));}catch(e){}};
const ALL=DECKS.flatMap(d=>d.cards.map(c=>({...c,deck:d.name,plain:(txt(c.q)+' '+txt(c.a)+' '+txt(c.x)).toLowerCase()})));
let list=[],i=0,flipped=false;
// Shuffle is the default. Each card keeps a random key, so the order stays put during searches and syncs,
// and a new order comes with each page load or each time shuffle is turned back on.
const ORDER='mlds.order';let shuffled=localStorage.getItem(ORDER)!='inOrder';
const reshuffle=()=>ALL.forEach(c=>{c.r=Math.random();});reshuffle();
$('deck').add(new Option('All decks ('+ALL.length+')','all'));
DECKS.forEach(d=>$('deck').add(new Option(d.name+' ('+d.cards.length+')',d.name)));
if([...$('deck').options].some(o=>o.value==localStorage.getItem(DECK)))$('deck').value=localStorage.getItem(DECK);
const pool=()=>$('deck').value=='all'?ALL:ALL.filter(c=>c.deck==$('deck').value);
function build(keep){const q=$('q').value.toLowerCase().trim();
 list=pool().filter(c=>(!q||c.plain.includes(q))&&($('mode').value=='all'||!known[c.id]));
 if(shuffled)list.sort((a,b)=>a.r-b.r);
 if(!keep)i=0;i=Math.min(i,Math.max(0,list.length-1));render();}
// Know more search: topic, then "machine learning" or "AI" when the card needs that context, then its description.
// Capped at 30 words because Google ignores words past about 32; the description is what gets cut.
function searchContext(c,text){
 if(/\b(AI|ML|LLMs?)\b|\b[Mm]achine [Ll]earning|\b[Dd]eep [Ll]earning/.test(text))return '';
 const level=+(c.src.match(/^Level (\d+)/)||[])[1];
 if(level==9||level==10)return 'AI';
 if(level>=4&&level<=7||c.deck=='Machine Learning'||c.deck=='Deep Learning')return 'machine learning';
 return level&&/\b(models?|training|trained|predict\w*|neural|learn\w*)\b/i.test(text)?'machine learning':'';}
function searchQuery(c){
 const q=txt(c.q),topic=q.length>120?q.slice(0,120).replace(/\s+\S*$/,''):q,desc=txt(c.a);
 if(!topic)return '';
 const head=[topic,searchContext(c,topic+' '+desc)].filter(Boolean).join(' ');
 const room=Math.max(0,30-head.split(/\s+/).length);
 return (head+' '+desc.split(/\s+/).slice(0,room).join(' ')).replace(/[\s,;:.]+$/,'');}
function showStats(){const p=pool();$('stats').textContent='Known: '+p.filter(x=>known[x.id]).length+'/'+p.length;}
function render(){flipped=false;$('card').classList.remove('flip');const c=list[i];
 showStats();
 $('dots').style.display=c?'':'none';if(c){$('dots').innerHTML='<i></i>'.repeat(5).replace(/<i>/g,(m,o)=>o/7<c.c?'<i class="on">':m);$('dots').title=$('dots').ariaLabel='Complexity: '+c.c+' of 5';}
 const query=c?searchQuery(c):'';$('more').style.display=query?'':'none';$('more').href='https://www.google.com/search?q='+encodeURIComponent(query);
 if(!c){$('front').innerHTML='<div class="in"><div class="q">🎉 No cards here.</div></div>';$('back').innerHTML='';$('pos').textContent='';return;}
 $('pos').textContent='Card '+(i+1)+' of '+list.length;
 const chips='<div class="chips">'+($('deck').value=='all'?'<span class="chip">'+esc(c.deck)+'</span>':'')+(c.src?'<span class="chip">'+esc(c.src)+'</span>':'')+'</div>';
 $('front').innerHTML='<div class="in">'+chips+'<div class="lbl">Question</div><div class="q">'+c.q+'</div></div>';
 $('back').innerHTML='<div class="in"><div class="lbl">Answer</div><div class="qsmall">'+c.q.replace(/<img[^>]*>/g,'')+'</div><div class="ans">'+c.a+'</div>'+(c.x?'<div class="x">'+c.x+'</div>':'')+'</div>';
 $('front').scrollTop=$('back').scrollTop=0;}
const flip=()=>{flipped=!flipped;$('card').classList.toggle('flip',flipped)};
const go=n=>{if(list.length){i=(i+n+list.length)%list.length;render();}};
const mark=v=>{const c=list[i];if(!c)return;if(v)known[c.id]=1;else delete known[c.id];save();stamp(c.id,!!v);

const say=()=>{const c=list[i];if(!c||!window.speechSynthesis)return;speechSynthesis.cancel();

$('scene').onclick=e=>{if(e.target.tagName=='IMG'&&(flipped?e.target.closest('.back'):e.target.closest('.front'))){

// Text size on the tile, in 10% steps from 80% to 200%; whole numbers avoid floating-point drift.
let fontPct=+localStorage.getItem(FONT)||100;
const setFont=p=>{fontPct=Math.min(200,Math.max(80,p));document.documentElement.style.setProperty('--fs',fontPct/100);
 $('smaller').disabled=fontPct<=80;$('bigger').disabled=fontPct>=200;try{localStorage.setItem(FONT,fontPct);}catch(e){}};
setFont(fontPct);$('size').onclick=$('more').onclick=e=>e.stopPropagation();const changeFont=d=>{setFont(fontPct+d);prefsChanged();};$('smaller').onclick=()=>changeFont(-10);$('bigger').onclick=()=>changeFont(10);
$('zoom').onclick=()=>$('zoom').classList.remove('on');

$('again').onclick=()=>mark(0);$('good').onclick=()=>mark(1);$('say').onclick=say;
function showOrder(){const b=$('shuf');b.innerHTML=shuffled?'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg> Shuffle':'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg> In order';b.classList.toggle('on',shuffled);
 b.title=shuffled?'Cards are shuffled. Click to show them in order.':'Cards are in order. Click to shuffle.';b.setAttribute('aria-pressed',shuffled);}
// Switching keeps the current card on screen, and only changes which card comes next.
$('shuf').onclick=()=>{const cur=list[i],wasFlipped=flipped;shuffled=!shuffled;if(shuffled)reshuffle();
 try{localStorage.setItem(ORDER,shuffled?'shuffle':'inOrder');}catch(e){}
 showOrder();build();i=Math.max(0,list.indexOf(cur));render();if(wasFlipped)flip();};
showOrder();
$('deck').onchange=()=>{localStorage.setItem(DECK,$('deck').value);prefsChanged();build();};$('mode').onchange=()=>build();$('q').oninput=()=>build();
const STEPS=[
 {t:'Welcome 👋',p:`Flashcards for machine learning, deep learning, data mining, algorithms and Python: <b>${ALL.length}</b> cards in ${DECKS.length} decks. This quick tour shows how it works.`},
 {el:'deck',t:'1. Pick a deck',p:'Study one topic, or choose <b>All decks</b> to mix them. Your choice is remembered.'},
 {el:'scene',t:'2. Think, then flip',p:'The dots in the top-left corner show how complex a card is, from 1 to 5. Read the question and answer it in your head. Then <b>click the card</b> or press <kbd>Space</kbd> to flip it.'},
 {el:'scene',flip:1,t:'3. Check the answer',p:'The back shows the answer, and sometimes an explanation or a diagram. Click a diagram to enlarge it, or click <b>Know more</b> to search Google for the topic in a new tab.'},
 {el:'rate',t:'4. Be honest with yourself',p:'Press <b>Know it</b> (<kbd>2</kbd>) if you got it right, or <b>Again</b> (<kbd>1</kbd>) if you didn’t. Use <b>← Prev</b> / <b>Next →</b> to browse without rating.'},
 {el:'stats',t:'5. Track your progress',p:'This counts the cards you know. Progress is saved in this browser'+(SYNC.url?', and on all your devices if you sign in with Google.':'.')},
 {el:'mode',t:'6. Focus on what’s left',p:'Switch to <b>Not yet known</b> to study only the cards you haven’t marked as known.'},
 {el:'tools',t:'7. Search and choose the order',p:'<b>Search</b> looks through questions, answers and explanations. Cards start shuffled: click <b>Shuffle</b> to switch to <b>In order</b> and back. In order, Surya curated runs from basics to advanced.'},
 {el:'help',t:'You’re all set! 🎉',p:'The cards also work offline once loaded. Shortcuts: <kbd>Space</kbd> flip · <kbd>←</kbd><kbd>→</kbd> move · <kbd>1</kbd> Again · <kbd>2</kbd> Know it · <kbd>S</kbd> speak · <kbd>+</kbd><kbd>−</kbd> text size.<br>Click <b>?</b> any time to see this tour again.'}];
let ts=-1;
function tourRect(id){if(id=='rate'){const a=$('again').getBoundingClientRect(),b=$('good').getBoundingClientRect();return{left:a.left,top:Math.min(a.top,b.top),right:b.right,bottom:Math.max(a.bottom,b.bottom)};}
 if(id=='tools'){const a=$('q').getBoundingClientRect(),b=$('shuf').getBoundingClientRect();return{left:Math.min(a.left,b.left),top:Math.min(a.top,b.top),right:Math.max(a.right,b.right),bottom:Math.max(a.bottom,b.bottom)};}
 return $(id).getBoundingClientRect();}
function tourShow(){const s=STEPS[ts],tip=$('tip'),spot=$('spot'),last=ts==STEPS.length-1;
 if(!!s.flip!==flipped)flip();
 tip.innerHTML=`<h3>${s.t}</h3><p>${s.p}</p><div class="row"><span class="dots">${ts+1} / ${STEPS.length}</span>${last?'':'<button class="skip" id="tSkip">Skip tour</button>'}${ts?'<button id="tBack">Back</button>':''}<button class="pri" id="tNext">${last?'Start learning':ts?'Next':'Show me'}</button></div>`;
 $('tNext').onclick=()=>tourGo(1);if(ts)$('tBack').onclick=()=>tourGo(-1);if(!last)$('tSkip').onclick=tourEnd;
 const W=innerWidth,H=innerHeight,tw=tip.offsetWidth,th=tip.offsetHeight,pad=8;
 if(!s.el){spot.style.cssText=`left:${W/2}px;top:${H/2}px;width:0;height:0`;tip.style.left=(W-tw)/2+'px';tip.style.top=Math.max(12,(H-th)/2)+'px';$('tNext').focus();return;}
 $(s.el=='rate'?'good':s.el=='tools'?'q':s.el).scrollIntoView({block:'center'});
 const r=tourRect(s.el);spot.style.cssText=`left:${r.left-pad}px;top:${r.top-pad}px;width:${r.right-r.left+2*pad}px;height:${r.bottom-r.top+2*pad}px`;
 let top=r.bottom+pad+12;if(top+th>H-12)top=r.top-pad-12-th;if(top<12)top=Math.max(12,H-th-12);
 tip.style.top=top+'px';tip.style.left=Math.min(Math.max(12,(r.left+r.right)/2-tw/2),W-tw-12)+'px';$('tNext').focus();}
function tourGo(n){ts+=n;if(ts>=STEPS.length)return tourEnd();tourShow();}
function tourStart(){ts=0;$('tour').classList.add('on');tourShow();}
function tourEnd(){ts=-1;$('tour').classList.remove('on');if(flipped)flip();try{localStorage.setItem(TOUR,'1');}catch(e){}}
$('help').onclick=e=>{e.stopPropagation();tourStart();};
addEventListener('resize',()=>{if(ts>=0)tourShow();});
document.onkeydown=e=>{if(ts>=0){if(e.key=='Escape')tourEnd();else if(e.key=='ArrowRight')tourGo(1);else if(e.key=='ArrowLeft'&&ts)tourGo(-1);return;}
 if($('zoom').classList.contains('on')){if(e.key=='Escape'||e.key==' '){e.preventDefault();$('zoom').classList.remove('on');}return;}
 if(e.target.tagName=='INPUT'||e.target.tagName=='SELECT')return;
 if(e.key==' '){e.preventDefault();flip();}else if(e.key=='ArrowRight')go(1);else if(e.key=='ArrowLeft')go(-1);
 else if(e.key=='1')mark(0);else if(e.key=='2')mark(1);else if(e.key.toLowerCase()=='s')say();else if(e.key=='+'||e.key=='=')changeFont(10);else if(e.key=='-')changeFont(-10);};
// Google sign-in and sync; see SETUP-SIGNIN.md. The browser stays the source of truth while studying, so the
// app is instant and works offline or signed out; changes reach the sheet in the background.
// Each card has a time stamp: positive = known, negative = not known. The newest change to a card wins.
const SESSION='mlds.session',USER='mlds.user',STAMPS='mlds.stamps',DIRTY='mlds.dirty',PREFS_AT='mlds.prefsAt',PREFS_DIRTY='mlds.prefsDirty';
const loadJson=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d;}catch(e){return d;}};
const store=(k,v)=>{try{localStorage.setItem(k,typeof v=='string'?v:JSON.stringify(v));}catch(e){}};
let stamps=loadJson(STAMPS,{}),dirty=loadJson(DIRTY,{}),syncBusy=false,syncAgain=false,syncTimer=0,lastPull=0;
const seconds=()=>Math.floor(Date.now()/1000);
const session=()=>localStorage.getItem(SESSION)||'';
const saveSyncState=()=>{store(STAMPS,stamps);store(DIRTY,dirty);};
function stamp(id,isKnown){const t=Math.max(seconds(),Math.abs(stamps[id]||0)+1);stamps[id]=isKnown?t:-t;
 if(session())dirty[id]=stamps[id];saveSyncState();queueSync();}
function prefsChanged(){store(PREFS_AT,String(seconds()));if(session()){store(PREFS_DIRTY,'1');queueSync();}}
const localPrefs=()=>({font:fontPct,deck:$('deck').value,at:+localStorage.getItem(PREFS_AT)||0});
const queueSync=()=>{if(!SYNC.url||!session())return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>syncNow(),4000);};
const syncStatus=t=>{const el=$('syncState');if(el)el.textContent=t;};
function callBackend(body,keepalive){return fetch(SYNC.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),keepalive:!!keepalive})
 .then(r=>r.json()).then(r=>{if(!r.success){const e=new Error(r.error||'Sync failed');e.code=r.code;throw e;}return r;});}
// Takes in the sheet's data. Newer local changes are kept, and are sent on the next sync.
function mergeRemote(res,firstLoad){let changed=false;
 Object.entries(res.progress||{}).forEach(([id,t])=>{if(Math.abs(t)>Math.abs(stamps[id]||0)){stamps[id]=t;delete dirty[id];
  if(t>0&&!known[id]){known[id]=1;changed=true;}else if(t<0&&known[id]){delete known[id];changed=true;}}});
 saveSyncState();if(changed)save();
 const p=res.prefs;if(p&&p.at>(+localStorage.getItem(PREFS_AT)||0)){store(PREFS_AT,String(p.at));setFont(p.font);
  // Only on load: a sync in the middle of studying must not switch the deck.
  if(firstLoad&&p.deck&&p.deck!=$('deck').value&&[...$('deck').options].some(o=>o.value==p.deck)){$('deck').value=p.deck;localStorage.setItem(DECK,p.deck);changed=true;}}
 if(changed){if(!flipped&&ts<0)build(true);else showStats();}}
function signedOutByServer(){localStorage.removeItem(SESSION);showAccount('Please sign in again to keep syncing.');}
// Sends pending changes. Resolves to true once everything so far has reached the sheet.
async function syncNow(opts={}){if(!SYNC.url||!session())return false;
 if(syncBusy){syncAgain=true;return false;}
 if(!navigator.onLine){syncStatus('Offline, will sync later');return false;}
 clearTimeout(syncTimer);const sent={...dirty},sendPrefs=localStorage.getItem(PREFS_DIRTY)=='1',prefs=localPrefs();
 const hasChanges=Object.keys(sent).length>0||sendPrefs;if(!hasChanges&&!opts.pull)return true;
 syncBusy=true;syncStatus(hasChanges?'Saving…':'Syncing…');let ok=false;
 try{const res=await callBackend({action:'sync',session:session(),changes:sent,prefs:sendPrefs?prefs:undefined,pull:!!opts.pull},opts.keepalive);
  Object.keys(sent).forEach(id=>{if(dirty[id]===sent[id])delete dirty[id];});saveSyncState();
  if(sendPrefs&&(+localStorage.getItem(PREFS_AT)||0)==prefs.at)localStorage.removeItem(PREFS_DIRTY);
  if(res.session)store(SESSION,res.session);
  if(opts.pull){lastPull=Date.now();mergeRemote(res,opts.firstLoad);}
  ok=true;syncStatus('Synced');
 }catch(e){if(e.code=='auth')signedOutByServer();else{syncStatus('Not synced yet');clearTimeout(syncTimer);syncTimer=setTimeout(()=>syncNow(),60000);}}
 syncBusy=false;if(syncAgain){syncAgain=false;queueSync();}
 return ok&&!Object.keys(dirty).length&&localStorage.getItem(PREFS_DIRTY)!='1';}
function wipeLocalProgress(){known={};stamps={};dirty={};save();saveSyncState();localStorage.removeItem(PREFS_DIRTY);}
async function onGoogleCredential(g){showAccount('Signing in…',true);
 try{const sub=JSON.parse(atob(g.credential.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).sub;
  // Another account used this browser and its session ended without a sign-out: keep their progress out of this one.
  const prev=loadJson(USER,null);if(prev&&prev.sub!=sub){wipeLocalProgress();localStorage.removeItem(VISITOR);}
  Object.keys(known).forEach(id=>{if(!stamps[id])stamps[id]=1;});  // from before sync: real, but older than any change on another device
  const sent={...stamps},prefs=localPrefs(),res=await callBackend({action:'signIn',idToken:g.credential,visitorId:visitorId(),knownCount:Object.keys(known).length,changes:sent,prefs:prefs.at?prefs:undefined});
  store(SESSION,res.session);store(USER,res.user);
  dirty={};Object.keys(stamps).forEach(id=>{if(stamps[id]!==sent[id])dirty[id]=stamps[id];});saveSyncState();  // marked while signing in
  localStorage.removeItem(PREFS_DIRTY);
  mergeRemote(res,true);lastPull=Date.now();showAccount();syncStatus('Synced');showStats();queueSync();
 }catch(e){showAccount(e.code=='forbidden'?'This Google account isn’t allowed to sign in.':'Sign-in failed. Please try again.');}}
async function signOut(){const btn=$('signOut');btn.disabled=true;syncStatus('Saving…');
 clearTimeout(syncTimer);while(syncBusy)await new Promise(r=>setTimeout(r,200));
 if(!await syncNow()){if(!session())return;btn.disabled=false;syncStatus('Couldn’t save your progress. Still signed in, so nothing is lost.');return;}
 localStorage.removeItem(SESSION);localStorage.removeItem(USER);wipeLocalProgress();localStorage.removeItem(VISITOR);lastKnownSent=-1;  // a shared computer's next user isn't linked to this account
 if(window.google&&google.accounts)google.accounts.id.disableAutoSelect();
 build(true);showAccount();}
let gsiStarted=false;
function loadGoogleButton(){const box=$('gbtn');if(!box)return;
 const draw=()=>{const el=$('gbtn');if(!el)return;google.accounts.id.initialize({client_id:SYNC.clientId,callback:onGoogleCredential});
  google.accounts.id.renderButton(el,{size:'medium',text:'signin_with',shape:'pill'});};
 if(window.google&&google.accounts)return draw();
 if(gsiStarted)return;gsiStarted=true;
 const js=document.createElement('script');js.src='https://accounts.google.com/gsi/client';js.async=true;
 js.onload=draw;js.onerror=()=>{gsiStarted=false;};document.head.appendChild(js);}
function showAccount(msg,busy){const a=$('acct'),u=loadJson(USER,null);
 if(session()&&u&&!busy){const first=String(u.name||u.email||'').split(' ')[0];
  a.innerHTML='<span title="'+esc(u.email||'')+'">'+esc(first)+'</span><span id="syncState"></span><button id="signOut">Sign out</button>';$('signOut').onclick=signOut;return;}
 a.innerHTML=(busy?'':'<span id="gbtn"></span>')+(msg?'<span id="syncState">'+esc(msg)+'</span>':'');
 if(!busy)loadGoogleButton();}
// Visit counting: a random ID in this browser and a row in the Visitors tab, with a notice and an opt-out.
// A failure here is ignored, because it must never affect studying or signing in.
const VISITOR='mlds.visitor',NOTRACK='mlds.noTrack',NOTICE='mlds.noticeSeen',FORGET='mlds.forgetVisitor';
const browserOptOut=()=>navigator.globalPrivacyControl===true;
const trackingOff=()=>localStorage.getItem(NOTRACK)=='1'||browserOptOut();
let lastKnownSent=-1,lastVisitAt=0;
const VISIT_EVERY=300000;  // while someone is active, Last Seen is kept current to within 5 minutes
const newVisitorId=()=>{if(crypto.randomUUID)return crypto.randomUUID();const b=crypto.getRandomValues(new Uint8Array(16));b[6]=b[6]&15|64;b[8]=b[8]&63|128;
 const h=[...b].map(x=>x.toString(16).padStart(2,'0')).join('');return [h.slice(0,8),h.slice(8,12),h.slice(12,16),h.slice(16,20),h.slice(20)].join('-');};
function visitorId(){if(trackingOff())return '';let id=localStorage.getItem(VISITOR);if(!id){id=newVisitorId();store(VISITOR,id);}return id;}
function sendVisit(keepalive){const id=visitorId();if(!id||!navigator.onLine)return;const count=Object.keys(known).length;lastKnownSent=count;lastVisitAt=Date.now();
 callBackend({action:'visit',visitorId:id,knownCount:count,session:session()||undefined},keepalive).catch(()=>{});}
// Removes this browser's row. Remembered until it succeeds, so going offline can't lose an opt-out.
function flushForget(){const id=localStorage.getItem(FORGET);if(!id||!navigator.onLine)return;
 callBackend({action:'forgetVisitor',visitorId:id}).then(()=>{if(localStorage.getItem(FORGET)==id)localStorage.removeItem(FORGET);}).catch(()=>{});}
function dropVisitorId(){const id=localStorage.getItem(VISITOR);if(id){store(FORGET,id);localStorage.removeItem(VISITOR);}flushForget();}
function setTracking(on){if(on){localStorage.removeItem(NOTRACK);sendVisit();}else{store(NOTRACK,'1');dropVisitorId();}
 hideNotice();showVisitControl();}
function hideNotice(){store(NOTICE,'1');$('notice').style.display='none';}
function showVisitControl(){const v=$('visitCtl');
 if(browserOptOut()){v.textContent=' · Visit counting is off (your browser’s privacy setting)';return;}
 const on=!trackingOff();v.innerHTML=' · Visit counting is '+(on?'on':'off')+': <a href="#" id="visitToggle">turn '+(on?'off':'on')+'</a>';
 $('visitToggle').onclick=e=>{e.preventDefault();setTracking(!on);};}
// Site-wide totals. These don't use the visitor ID, so people who turned counting off see them too.
function showCounts(){if(!navigator.onLine||$('counts').textContent)return;
 const n=(v,w)=>v.toLocaleString()+' '+w+(v==1?'':'s');
 callBackend({action:'stats'}).then(r=>{if(r.views>0)$('counts').textContent=n(r.views,'view')+' · '+n(r.users,'unique user');}).catch(()=>{});}
function startVisits(){showVisitControl();
 if(trackingOff()){dropVisitorId();}
 else{sendVisit();
  if(!localStorage.getItem(NOTICE)){const n=$('notice');n.style.display='';
   n.innerHTML='This site counts visits with a random ID saved in your browser. If you sign in, it’s linked to your account. <a href="privacy.html">Privacy</a> <button id="noticeOk">OK</button> <button id="noticeOff">Turn off</button>';
   $('noticeOk').onclick=hideNotice;$('noticeOff').onclick=()=>setTracking(false);}}
 flushForget();
 addEventListener('online',()=>{flushForget();if(lastKnownSent<0)sendVisit();});
 const stillHere=()=>{if(!trackingOff()&&Date.now()-lastVisitAt>VISIT_EVERY)sendVisit();};
 addEventListener('pointerdown',stillHere,{passive:true});addEventListener('keydown',stillHere,{passive:true});
 document.addEventListener('visibilitychange',()=>{if(document.visibilityState=='visible')stillHere();
  else if(!trackingOff()&&Object.keys(known).length!=lastKnownSent)sendVisit(true);});}
if(SYNC.clientId&&SYNC.url){$('acct').style.display='';$('privacy').innerHTML='Signing in saves your name, email and progress in a private Google Sheet kept by the site owner. <a href="privacy.html">Privacy</a>';
 showAccount();
 if(session())syncNow({pull:true,firstLoad:true});
 startVisits();showCounts();addEventListener('online',showCounts);
 addEventListener('online',()=>{if(!session())loadGoogleButton();else syncNow({pull:true});});
 document.addEventListener('visibilitychange',()=>{if(!session())return;
  if(document.visibilityState=='hidden')syncNow({keepalive:true});
  else if(Date.now()-lastPull>300000)syncNow({pull:true});});
}
build();
if(!localStorage.getItem(TOUR))setTimeout(tourStart,400);

// Offline cache: sw.js keeps the page and images; a new build is fetched in the background
// and the "Refresh" banner switches to it (old cache is then removed).
const net=()=>{$('net').textContent=navigator.onLine?'':'offline · ';};addEventListener('online',net);addEventListener('offline',net);net();
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
 let reload=false;  // only after "Refresh"; the first install also changes the controller
 navigator.serviceWorker.addEventListener('controllerchange',()=>{if(reload){reload=false;location.reload();}});
 navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>{
  const offer=w=>{$('upd').classList.add('on');$('updBtn').onclick=()=>{reload=true;$('upd').classList.remove('on');w.postMessage('skipWaiting');};};
  if(reg.waiting&&navigator.serviceWorker.controller)offer(reg.waiting);
  reg.addEventListener('updatefound',()=>{const w=reg.installing;w.addEventListener('statechange',()=>{
   if(w.state=='installed'&&navigator.serviceWorker.controller)offer(w);});});
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState=='visible')reg.update().catch(()=>{});});
 }).catch(()=>{});
 if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
}
