<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Idiom Flashcards</title><style>
:root{--bg:#f4efe6;--ink:#1f2a37;--card:#fffdf8;--acc:#c2410c;--mut:#6b7280}
*{box-sizing:border-box}body{margin:0;font-family:Georgia,serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center}
header{width:100%;max-width:760px;padding:16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
h1{font-size:22px;margin:0 auto 0 0}select,button,input{font:inherit;font-size:14px;padding:6px 10px;border:1px solid #d6cfc2;border-radius:8px;background:#fff;cursor:pointer}
.bar{width:100%;max-width:760px;padding:0 16px;color:var(--mut);font-size:14px;display:flex;justify-content:space-between}
.scene{perspective:1400px;width:calc(100% - 32px);max-width:728px;height:460px;margin:12px 16px;cursor:pointer}
.card{position:relative;width:100%;height:100%;transition:transform .55s;transform-style:preserve-3d}.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;background:var(--card);border-radius:18px;box-shadow:0 10px 30px #0002;padding:28px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;overflow:auto}
.back{transform:rotateY(180deg);justify-content:flex-start}.lbl{font:12px sans-serif;letter-spacing:.15em;text-transform:uppercase;color:var(--acc);margin-bottom:12px}
.big{font-size:30px;line-height:1.3}.idiom{font-size:26px;font-weight:bold;color:var(--acc);margin:4px 0 10px}
.back img{max-height:150px;max-width:100%;border-radius:10px;margin:6px 0}.ex{font-style:italic;margin:6px 0;line-height:1.45}
.syn{margin-top:10px;font:14px sans-serif;color:var(--mut)}.cat{font:12px sans-serif;background:#fde7d9;color:var(--acc);padding:2px 8px;border-radius:99px;margin-bottom:10px}
.controls{display:flex;gap:10px;margin:6px 0 24px;flex-wrap:wrap;justify-content:center}.controls button{padding:10px 18px;font-size:15px}
.again{border-color:#dc2626!important;color:#dc2626}.good{border-color:#16a34a!important;color:#16a34a}
.hint{font:12px sans-serif;color:var(--mut);margin-bottom:20px}
#help{width:34px;height:34px;padding:0;border-radius:50%;font-weight:bold}
#tour{position:fixed;inset:0;z-index:50;display:none}#tour.on{display:block}
#spot{position:fixed;border-radius:14px;box-shadow:0 0 0 9999px #0f172acc;transition:all .3s;pointer-events:none}
#tip{position:fixed;width:min(360px,calc(100vw - 24px));background:#fff;border-radius:14px;padding:18px 18px 14px;box-shadow:0 12px 40px #0006;font:15px/1.5 sans-serif;transition:top .3s,left .3s}
#tip h3{margin:0 0 6px;font:bold 18px Georgia,serif;color:var(--acc)}#tip p{margin:0 0 12px}#tip kbd{background:#f3f4f6;border:1px solid #d1d5db;border-radius:4px;padding:0 5px;font-size:13px}
#tip .row{display:flex;align-items:center;gap:8px}#tip .dots{margin-right:auto;color:var(--mut);font-size:13px}
#tip button{font:14px sans-serif;padding:6px 12px}#tip .pri{background:var(--acc);color:#fff;border-color:var(--acc)}#tip .skip{border:none;background:none;color:var(--mut)}
</style></head><body>
<header><h1>Idiom Flashcards</h1><select id="deck"></select>
<select id="dir"><option value="f">Idiom → Meaning</option><option value="r">Meaning → Idiom</option></select>
<select id="mode"><option value="all">All cards</option><option value="due">Not yet known</option></select>
<input id="q" placeholder="Search…" size="12"><button id="shuf">Shuffle</button><button id="help" title="How to use this (tour)">?</button></header>
<div id="tour"><div id="spot"></div><div id="tip" role="dialog" aria-live="polite"></div></div>
<div class="bar"><span id="pos"></span><span id="stats"></span></div>
<div class="scene" id="scene"><div class="card" id="card"><div class="face front" id="front"></div><div class="face back" id="back"></div></div></div>
<div class="controls"><button id="prev">← Prev</button><button id="say">🔊 Speak</button><button class="again" id="again">Again</button><button class="good" id="good">Know it</button><button id="next">Next →</button></div>
<div class="hint">Space/click = flip · ←/→ = navigate · 1 = again · 2 = know it · S = speak</div>
<script>
const DECKS=/*DATA*/null;const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let known=JSON.parse(localStorage.getItem('idiomKnown')||'{}'),list=[],i=0,flipped=false;
DECKS.forEach((d,k)=>$('deck').add(new Option(d.name+' ('+d.cards.length+')',k)));
const deck=()=>DECKS[$('deck').value];const key=c=>$('deck').value+'|'+c.idiom;
function build(keep){const q=$('q').value.toLowerCase();
 list=deck().cards.filter(c=>(!q||(c.idiom+' '+c.meaning).toLowerCase().includes(q))&&($('mode').value=='all'||!known[key(c)]));
 if(!keep)i=0;i=Math.min(i,Math.max(0,list.length-1));render();}
function render(){flipped=false;$('card').classList.remove('flip');const c=list[i];
 $('stats').textContent='Known: '+deck().cards.filter(x=>known[key(x)]).length+'/'+deck().cards.length;
 if(!c){$('front').innerHTML='<div class="big">🎉 No cards here.</div>';$('back').innerHTML='';$('pos').textContent='';return;}
 $('pos').textContent='Card '+(i+1)+' of '+list.length;const rev=$('dir').value=='r';
 $('front').innerHTML=(c.cat?'<span class="cat">'+esc(c.cat)+'</span>':'')+'<div class="lbl">'+(rev?'Meaning':'Idiom')+'</div><div class="big">'+esc(rev?c.meaning:c.idiom)+'</div>';
 $('back').innerHTML='<div class="lbl">'+(rev?'Idiom':'Meaning')+'</div><div class="idiom">'+esc(rev?c.idiom:c.meaning)+'</div>'
  +'<div style="color:var(--mut)">'+esc(rev?c.meaning:c.idiom)+'</div>'
  +(c.img?'<img src="'+esc(c.img)+'" alt="" loading="lazy">':'')
  +(c.examples||[]).map(e=>'<div class="ex">“'+esc(e)+'”</div>').join('')
  +(c.synonyms&&c.synonyms.length?'<div class="syn">Similar: '+c.synonyms.map(esc).join(' · ')+'</div>':'');}
const flip=()=>{flipped=!flipped;$('card').classList.toggle('flip',flipped)};
const go=n=>{if(list.length){i=(i+n+list.length)%list.length;render();}};
const mark=v=>{const c=list[i];if(!c)return;if(v)known[key(c)]=1;else delete known[key(c)];
 localStorage.setItem('idiomKnown',JSON.stringify(known));if($('mode').value=='due'&&v)build(true);else go(1);};
const say=()=>{const c=list[i];if(!c)return;speechSynthesis.cancel();
 speechSynthesis.speak(new SpeechSynthesisUtterance(flipped?c.idiom+'. '+(c.examples||[]).join(' '):($('dir').value=='r'?c.meaning:c.idiom)));};
$('scene').onclick=flip;$('prev').onclick=()=>go(-1);$('next').onclick=()=>go(1);
$('again').onclick=()=>mark(0);$('good').onclick=()=>mark(1);$('say').onclick=say;
$('shuf').onclick=()=>{for(let a=list.length-1;a>0;a--){const b=Math.random()*(a+1)|0;[list[a],list[b]]=[list[b],list[a]];}i=0;render();};
['deck','mode','dir'].forEach(x=>$(x).onchange=()=>build());$('q').oninput=()=>build();
const total=DECKS.reduce((n,d)=>n+d.cards.length,0).toLocaleString();
const STEPS=[
 {t:'Welcome to Idiom Flashcards 👋',p:`Learn English idioms with flip cards. There are <b>${total}</b> idioms in ${DECKS.length} decks. This quick tour shows you how everything works. It takes about a minute.`},
 {el:'deck',t:'1. Pick a deck',p:'<b>English Idioms &amp; Phrases Dictionary</b> is a big list with a meaning and an example for each idiom. <b>Most Common 300 Idioms</b> is a smaller set with pictures, several examples, similar phrases and topics like Food or Money.'},
 {el:'dir',t:'2. Choose how to study',p:'<b>Idiom → Meaning</b> shows the idiom and asks you what it means. <b>Meaning → Idiom</b> does the reverse: you see the meaning and try to recall the idiom.'},
 {el:'scene',t:'3. Think, then flip',p:'This is your card. Try to remember the answer, then <b>click the card</b> or press <kbd>Space</kbd> to flip it.'},
 {el:'scene',flip:1,t:'4. Check the answer',p:'The back shows the answer with example sentences. Some cards also have a picture and similar phrases. Click again to flip it back.'},
 {el:'rate',t:'5. Be honest with yourself',p:'Press <b>Know it</b> (<kbd>2</kbd>) if you got it right, or <b>Again</b> (<kbd>1</kbd>) if you didn’t. Either way you move to the next card. Use <b>← Prev</b> / <b>Next →</b> to browse without rating.'},
 {el:'stats',t:'6. Track your progress',p:'This counts how many cards in the deck you know. Progress is saved in this browser, so you can close the page and pick up later.'},
 {el:'mode',t:'7. Focus on what’s left',p:'Switch to <b>Not yet known</b> to study only the cards you haven’t marked as known. When a card is marked, it drops out of the pile.'},
 {el:'tools',t:'8. Search and shuffle',p:'Type in <b>Search</b> to find an idiom by any word in it or its meaning. <b>Shuffle</b> mixes up the order so you can’t learn the sequence instead of the idioms.'},
 {el:'say',t:'9. Hear it out loud',p:'Press <b>🔊 Speak</b> or <kbd>S</kbd> to hear the card read aloud. On the back it reads the idiom and the examples.'},
 {el:'help',t:'You’re all set! 🎉',p:'Shortcuts: <kbd>Space</kbd> flip · <kbd>←</kbd><kbd>→</kbd> move · <kbd>1</kbd> Again · <kbd>2</kbd> Know it · <kbd>S</kbd> speak.<br>Click <b>?</b> any time to see this tour again.'}];
let ts=-1;
function tourRect(id){if(id=='rate'){const a=$('again').getBoundingClientRect(),b=$('good').getBoundingClientRect();return{left:a.left,top:Math.min(a.top,b.top),right:b.right,bottom:Math.max(a.bottom,b.bottom)};}
 if(id=='tools'){const a=$('q').getBoundingClientRect(),b=$('shuf').getBoundingClientRect();return{left:Math.min(a.left,b.left),top:Math.min(a.top,b.top),right:Math.max(a.right,b.right),bottom:Math.max(a.bottom,b.bottom)};}
 return $(id).getBoundingClientRect();}
function tourShow(){const s=STEPS[ts],tip=$('tip'),spot=$('spot'),last=ts==STEPS.length-1;
 if(!!s.flip!==flipped)flip();
 tip.innerHTML=`<h3>${s.t}</h3><p>${s.p}</p><div class="row"><span class="dots">${ts+1} / ${STEPS.length}</span>${last?'':'<button class="skip" id="tSkip">Skip tour</button>'}${ts?'<button id="tBack">Back</button>':''}<button class="pri" id="tNext">${last?'Start learning':ts?'Next':'Show me'}</button></div>`;
 $('tNext').onclick=()=>tourGo(1);if(ts)$('tBack').onclick=()=>tourGo(-1);if(!last)$('tSkip').onclick=tourEnd;
 const W=innerWidth,H=innerHeight,tw=tip.offsetWidth,th=tip.offsetHeight,pad=8;
 if(!s.el){spot.style.cssText=`left:${W/2}px;top:${H/2}px;width:0;height:0`;tip.style.left=(W-tw)/2+'px';tip.style.top=Math.max(12,(H-th)/2)+'px';$('tNext').focus();return;}
 $(s.el=='rate'?'good':s.el=='tools'?'q':s.el).scrollIntoView({block:'center'});
 const r=tourRect(s.el);spot.style.cssText=`left:${r.left-pad}px;top:${r.top-pad}px;width:${r.right-r.left+2*pad}px;height:${r.bottom-r.top+2*pad}px`;
 let top=r.bottom+pad+12;if(top+th>H-12)top=r.top-pad-12-th;if(top<12)top=Math.max(12,H-th-12);
 tip.style.top=top+'px';tip.style.left=Math.min(Math.max(12,(r.left+r.right)/2-tw/2),W-tw-12)+'px';$('tNext').focus();}
function tourGo(n){ts+=n;if(ts>=STEPS.length)return tourEnd();tourShow();}
function tourStart(){ts=0;$('tour').classList.add('on');tourShow();}
function tourEnd(){ts=-1;$('tour').classList.remove('on');if(flipped)flip();localStorage.setItem('idiomTourDone','1');}
$('help').onclick=e=>{e.stopPropagation();tourStart();};
addEventListener('resize',()=>{if(ts>=0)tourShow();});
document.onkeydown=e=>{if(ts>=0){if(e.key=='Escape')tourEnd();else if(e.key=='ArrowRight')tourGo(1);else if(e.key=='ArrowLeft'&&ts)tourGo(-1);return;}
 if(e.target.tagName=='INPUT')return;
 if(e.key==' '){e.preventDefault();flip();}else if(e.key=='ArrowRight')go(1);else if(e.key=='ArrowLeft')go(-1);
 else if(e.key=='1')mark(0);else if(e.key=='2')mark(1);else if(e.key.toLowerCase()=='s')say();};
build();
if(!localStorage.getItem('idiomTourDone'))setTimeout(tourStart,400);
</script></body></html>
